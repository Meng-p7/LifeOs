<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>LifeOS · 个人生活操作系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
/*__CSS__*/
</style>
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<div class="app" id="app">
  <!-- 顶栏 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-text">
        <h1>LifeOS</h1>
        <div class="date-line" id="dateLine"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="chip-sync" id="syncChip" type="button" title="数据同步状态"></button>
      <button class="icon-btn" id="btnTheme" type="button" aria-label="切换深浅主题" title="切换主题"></button>
      <button class="icon-btn" id="btnExport" type="button" aria-label="导出备份" title="导出备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 导航（桌面顶部 / 移动底部） -->
  <nav class="nav" id="nav" aria-label="主导航">
    <button class="nav-item active" data-view="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-view="tasks" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>任务</span>
    </button>
    <button class="nav-item" data-view="study" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>学习</span>
    </button>
    <button class="nav-item" data-view="fitness" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"/><path d="M2 9v6M22 9v6M6.5 2v4M17.5 2v4M6.5 18v4M17.5 18v4"/></svg>
      <span>健身</span>
    </button>
    <button class="nav-item" data-view="schedule" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>日程</span>
    </button>
    <button class="nav-item" data-view="review" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>复盘</span>
    </button>
  </nav>

  <!-- 视图容器 -->
  <main class="main" id="main">
    <section class="view" id="view-today" role="tabpanel" aria-label="今日"></section>
    <section class="view" id="view-tasks" role="tabpanel" aria-label="任务" hidden></section>
    <section class="view" id="view-study" role="tabpanel" aria-label="学习" hidden></section>
    <section class="view" id="view-fitness" role="tabpanel" aria-label="健身" hidden></section>
    <section class="view" id="view-schedule" role="tabpanel" aria-label="日程" hidden></section>
    <section class="view" id="view-review" role="tabpanel" aria-label="复盘" hidden></section>
  </main>
</div>

<!-- 计时器浮动条 -->
<div class="timer-bar" id="timerBar" hidden aria-live="polite">
  <div class="timer-info">
    <span class="timer-dot" aria-hidden="true"></span>
    <span id="timerLabel">计时中</span>
    <strong id="timerClock">00:00</strong>
  </div>
  <div class="timer-actions">
    <button class="btn small" id="timerPause" type="button">暂停</button>
    <button class="btn small primary" id="timerStop" type="button">结束并记录</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<script>
/*__JS__*/
</script>
</body>
</html>
