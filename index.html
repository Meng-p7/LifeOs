<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>LifeOS · 个人生活操作系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
/* ================= LifeOS 设计系统 ================= */
:root{
  --bg:#f5f6fa;
  --bg-2:#eef0f7;
  --surface:#ffffff;
  --surface-2:#f8f9fd;
  --ink:#191c24;
  --ink-2:#565c6e;
  --ink-3:#98a0b3;
  --line:#e6e9f2;
  --line-2:#d5ddf1;
  --blue:#3b6ef5;
  --blue-deep:#2f59d0;
  --blue-soft:#edf2fe;
  --blue-2:#b9ccfb;
  --blue-soft-2:#dfe8fd;
  --coral:#ff5a7a;
  --coral-deep:#e23e60;
  --coral-soft:#ffedf1;
  --green:#17b26a;
  --green-deep:#0e9d5c;
  --green-soft:#e7f7ef;
  --amber:#e8a020;
  --amber-soft:#fdf3e0;
  --violet:#7b5cf0;
  --violet-soft:#f1edfe;
  --r-lg:16px;
  --r-md:12px;
  --r-sm:8px;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 28px rgba(20,24,40,.07);
  --shadow-lg:0 2px 6px rgba(20,24,40,.08),0 18px 46px rgba(20,24,40,.14);
  --font:"Sora","Space Grotesk","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.9,.32,1);
  --nav-h:60px;
}
[data-theme="dark"]{
  --bg:#101425;
  --bg-2:#161b30;
  --surface:#1a2036;
  --surface-2:#202742;
  --ink:#eef0f8;
  --ink-2:#a6adc2;
  --ink-3:#6b7390;
  --line:#2a3252;
  --line-2:#3a4368;
  --blue:#5d84f7;
  --blue-deep:#7ea0fa;
  --blue-soft:#232f55;
  --blue-2:#3355b8;
  --blue-soft-2:#26325a;
  --coral:#ff7d95;
  --coral-deep:#ff9db1;
  --coral-soft:#3d2434;
  --green:#2ec27e;
  --green-deep:#4ad79a;
  --green-soft:#16352a;
  --amber:#f0b445;
  --amber-soft:#3a2f16;
  --violet:#9b83f5;
  --violet-soft:#2a2450;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 18px 46px rgba(0,0,0,.5);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font);font-size:14px;color:var(--ink)}
::selection{background:rgba(59,110,245,.22)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2.5px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:350;background:linear-gradient(90deg,var(--blue),var(--violet),var(--coral));border-radius:0 2px 2px 0;transition:width .1s linear}

.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 20px calc(var(--nav-h) + 28px)}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;padding:12px 0;margin-bottom:8px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;
}
@supports not (background: color-mix(in srgb, red 50%, blue)){ .topbar{background:var(--bg)} }
.topbar.stuck{border-bottom-color:var(--line);box-shadow:0 8px 24px rgba(20,24,40,.06)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 6px 16px rgba(59,110,245,.35);
  transition:transform .3s var(--ease);
}
.brand-mark:hover{transform:rotate(-8deg) scale(1.08)}
.brand-text{min-width:0}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.2px}
.date-line{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:8px;align-items:center}

.icon-btn{
  width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  transition:all .18s var(--ease);
}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink);box-shadow:var(--shadow);transform:translateY(-1px)}
.icon-btn svg{width:16px;height:16px}

.chip-sync{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  font-size:12.5px;font-weight:700;transition:all .18s var(--ease);
}
.chip-sync:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.sync-icon{font-size:11px}
.sync-icon.local{color:var(--ink-3)}
.sync-icon.synced{color:var(--green)}
.sync-icon.syncing{color:var(--blue)}
.sync-icon.pending{color:var(--amber)}
.sync-icon.offline{color:var(--ink-3)}
.sync-icon.error{color:var(--coral-deep)}

/* ---------- 导航：桌面顶部 / 移动底部 ---------- */
.nav{
  display:flex;gap:4px;border-bottom:2px solid var(--line);
  margin-bottom:22px;overflow-x:auto;scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav-item{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  padding:11px 18px;font-size:14.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;border-radius:8px 8px 0 0;transition:color .18s;
  min-height:44px;
}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{color:var(--ink)}
.nav-item.active{color:var(--blue)}
.nav-item.active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-2px;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:3px 3px 0 0;
  animation:tabIn .3s var(--ease);
}
@keyframes tabIn{from{transform:scaleX(.3);opacity:0}to{transform:scaleX(1);opacity:1}}
.nav-item .badge{
  min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--coral);color:#fff;
  font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
}

.main{min-height:60vh}
.view{display:none}
.view.show{display:block}
.view.show>*{animation:viewIn .38s var(--ease) both}
.view.show>*:nth-child(2){animation-delay:.05s}
.view.show>*:nth-child(3){animation-delay:.1s}
.view.show>*:nth-child(4){animation-delay:.15s}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- 通用组件 ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:20px;margin-bottom:16px;
  transition:box-shadow .25s ease,border-color .25s ease;
}
.card:hover{border-color:var(--line-2)}
.card:last-child{margin-bottom:0}
.card-title{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.card-title .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--violet));flex:none}
.card-title .extra{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 2px 12px;flex-wrap:wrap}
.sec-title h2{font-size:16px;font-weight:800}
.sec-title .extra{font-size:12.5px;color:var(--ink-3);font-weight:600}
.sec-title:first-child{margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2);
  transition:all .16s var(--ease);min-height:38px;
}
.btn:hover{border-color:var(--line-2);color:var(--ink);box-shadow:var(--shadow);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);box-shadow:0 8px 18px rgba(59,110,245,.32)}
.btn.danger{color:var(--coral-deep)}
.btn.danger:hover{border-color:var(--coral);background:var(--coral-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 11px;font-size:12.5px;min-height:32px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}

.inp{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s,background .15s;
  width:100%;min-height:40px;
}
.inp:focus{outline:none;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3.5px rgba(59,110,245,.14)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid2-13{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}

/* 统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 12px;text-align:center;transition:transform .2s var(--ease),box-shadow .2s ease;
  display:flex;flex-direction:column;gap:2px;align-items:center;
}
button.stat{cursor:pointer;min-height:44px}
button.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-v{font-size:26px;font-weight:800;line-height:1.15;color:var(--blue)}
.stat-v.coral{color:var(--coral)}
.stat-v.green{color:var(--green)}
.stat-v.amber{color:var(--amber)}
.stat-v.violet{color:var(--violet)}
.stat-k{font-size:12px;color:var(--ink-2);font-weight:600}
.stat-sub{font-size:11px;color:var(--ink-3);font-weight:500}

/* 标签 */
.tag{font-size:11.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag-subject{background:var(--blue-soft);color:var(--blue-deep)}
.tag-due{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag-due.today{background:var(--amber-soft);color:#a8760a}
[data-theme="dark"] .tag-due.today{color:var(--amber)}
.tag-due.over{background:var(--coral-soft);color:var(--coral-deep)}
.tag-done{background:var(--green-soft);color:var(--green-deep)}
.tag-type-class{background:var(--blue-soft);color:var(--blue-deep)}
.tag-type-study{background:var(--violet-soft);color:var(--violet)}
.tag-type-fitness{background:var(--coral-soft);color:var(--coral-deep)}
.tag-type-rest{background:var(--green-soft);color:var(--green-deep)}
.tag-type-other{background:var(--surface-2);color:var(--ink-2)}
.pri-dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.pri-high{background:var(--coral)}
.pri-normal{background:var(--blue)}
.pri-low{background:var(--ink-3)}

/* 空状态 */
.empty{
  text-align:center;padding:36px 18px;color:var(--ink-3);font-size:13.5px;
  border:1.5px dashed var(--line);border-radius:var(--r-md);background:var(--surface-2);
}
.empty-icon{font-size:26px;margin-bottom:6px;opacity:.5}
.empty b{display:block;font-size:14.5px;color:var(--ink-2);margin-bottom:3px;font-weight:700}
.empty p{font-size:12.5px}
.empty .btn{margin-top:12px}

/* 图表 */
.chart-axis{font-size:10.5px;fill:var(--ink-3);font-weight:600;font-family:var(--font)}
.chart-ring-text{font-size:20px;font-weight:800;fill:var(--ink);font-family:var(--font)}
.chart-ring-sub{font-size:10.5px;fill:var(--ink-2);font-weight:600;font-family:var(--font)}
.chart-line{stroke-dasharray:2000;stroke-dashoffset:2000;animation:drawLine 1.3s var(--ease) forwards}
.chart-area{opacity:0;animation:fadeIn .8s .5s ease forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.chart-note{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.hbars{display:flex;flex-direction:column;gap:7px}
.hbar-row{display:flex;align-items:center;gap:10px;font-size:13px;cursor:default;border-radius:8px;padding:3px 4px}
.hbar-row[data-click]{cursor:pointer}
.hbar-row[data-click]:hover{background:var(--surface-2)}
.hbar-name{width:96px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:9px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.hbar-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .8s var(--ease)}
.hbar-n{width:46px;text-align:right;flex:none;font-weight:700;color:var(--ink-2);font-size:12px}

.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px}
.heat-cell{aspect-ratio:1;border-radius:6px;background:var(--bg-2);transition:transform .15s var(--ease);min-width:0}
.heat-cell:hover{transform:scale(1.15);z-index:2}
.heat-cell.plan{border:1.5px solid var(--line-2)}
.heat-cell.full{background:linear-gradient(135deg,var(--green),var(--green-deep))}
.heat-cell.part{background:color-mix(in srgb,var(--green) 45%,var(--surface))}
.heat-cell.now{outline:2px solid var(--blue);outline-offset:1.5px}
.heat-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.heat-legend i{display:inline-block;width:11px;height:11px;border-radius:3.5px;margin-right:5px;vertical-align:-1px}

/* ---------- 今日（行动中心） ---------- */
.hero-top{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.hello{padding:22px}
.hello .greet{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
.hello .big{font-size:24px;font-weight:800;margin:6px 0 2px;line-height:1.25}
.hello .sub{font-size:13px;color:var(--ink-2)}
.countdown{display:flex;align-items:center;gap:16px;padding:20px 22px}
.countdown .num{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.countdown .num small{font-size:18px;font-weight:700;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.countdown .meta{flex:1;min-width:0}
.countdown .meta .t{font-size:14px;font-weight:700}
.countdown .meta .d{font-size:12px;color:var(--ink-2)}
.countdown .meta .track{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;margin-top:8px}
.countdown .meta .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--violet));width:0;transition:width 1s var(--ease)}

.focus-task{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface-2);margin-bottom:8px;
  transition:border-color .15s,box-shadow .15s;
}
.focus-task:last-child{margin-bottom:0}
.focus-task:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.focus-task .body{flex:1;min-width:0}
.focus-task .title{font-size:14px;font-weight:700;word-break:break-all}
.focus-task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.focus-task .ops{display:flex;gap:5px;flex:none}

.t-check{
  width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line-2);
  display:inline-flex;align-items:center;justify-content:center;transition:all .16s var(--ease);
  background:var(--surface);
}
.t-check:hover{border-color:var(--blue);transform:scale(1.08)}
.t-check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.4) rotate(-30deg);transition:all .22s var(--ease)}
.t-check.on{background:var(--green);border-color:var(--green)}
.t-check.on svg{opacity:1;transform:scale(1) rotate(0)}

/* 时间轴 */
.timeline{position:relative;padding-left:56px}
.timeline::before{content:"";position:absolute;left:43px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:1px}
.tl-item{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);border:1px solid transparent;margin-bottom:4px;transition:background .15s,border-color .15s}
.tl-item:hover{background:var(--surface-2);border-color:var(--line)}
.tl-item .time{position:absolute;left:-56px;width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);padding-top:2px}
.tl-item .dot{position:absolute;left:-17px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--blue)}
.tl-item.done .dot{background:var(--green);border-color:var(--green)}
.tl-item.now .dot{background:var(--coral);border-color:var(--coral);animation:pulse 2s infinite}
.tl-item.missed .dot{border-color:var(--ink-3)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.tl-item .body{flex:1;min-width:0}
.tl-item .title{font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl-item .title s{color:var(--ink-3)}
.tl-item .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.tl-item .ops{display:flex;gap:4px;flex:none}
.tl-nowline{position:relative;height:0;border-top:2px dashed var(--coral);margin:6px 0 6px 56px}
.tl-nowline span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:800;color:var(--coral-deep);background:var(--surface);padding:0 6px;border-radius:4px}
.tl-conflict{font-size:11px;font-weight:700;color:#a8760a;background:var(--amber-soft);padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
[data-theme="dark"] .tl-conflict{color:var(--amber)}

/* 任务列表 */
.task-list{display:flex;flex-direction:column;gap:8px}
.task{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color .18s,box-shadow .18s,opacity .3s;
}
.task:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px}
.task .body{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:600;word-break:break-all}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.task .ops{display:flex;gap:4px;flex:none}
.mini-btn{
  width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);border:1px solid transparent;transition:all .15s var(--ease);flex:none;
}
.mini-btn:hover{color:var(--ink);background:var(--surface-2);border-color:var(--line)}
.mini-btn.danger:hover{color:var(--coral-deep);background:var(--coral-soft);border-color:var(--coral)}
.mini-btn svg{width:15px;height:15px}

.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{
  padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:700;
  background:var(--surface-2);color:var(--ink-2);border:1.5px solid transparent;transition:all .15s var(--ease);
  min-height:34px;
}
.chip:hover{background:var(--bg-2);transform:translateY(-1px)}
.chip.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-2)}
.chip .n{opacity:.6;font-size:11.5px;margin-left:2px}

.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.add-row .inp{flex:1;min-width:180px}

/* 学习模块 */
.subject-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px}
.subject-card:last-child{margin-bottom:0}
.subject-card .body{flex:1;min-width:0}
.subject-card .name{font-size:14.5px;font-weight:800}
.subject-card .goal{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.subject-card .prog{margin-top:8px}
.subject-card .prog .track{height:8px;border-radius:4px;background:var(--bg-2);overflow:hidden}
.subject-card .prog .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .8s var(--ease)}
.subject-card .prog .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:4px;font-weight:600}

.study-rec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.study-rec:last-child{border-bottom:none}
.study-rec .t{font-weight:700;width:52px;flex:none}
.study-rec .body{flex:1;min-width:0}
.study-rec .min{font-weight:800;color:var(--blue);flex:none}

/* 健身模块 */
.fit-banner{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:var(--r-md);
  border:1.5px solid transparent;transition:transform .25s var(--ease),border-color .25s;
}
.fit-banner:hover{transform:translateY(-1px)}
.fit-banner.on{background:var(--blue-soft);border-color:var(--blue-2)}
.fit-banner.off{background:var(--surface-2);border-color:var(--line)}
.fit-banner .icon{
  width:44px;height:44px;border-radius:12px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .3s var(--ease);
}
.fit-banner:hover .icon{transform:scale(1.1) rotate(-6deg)}
.fit-banner.on .icon{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;box-shadow:0 6px 16px rgba(59,110,245,.35)}
.fit-banner.off .icon{background:var(--bg-2);color:var(--ink-2)}
.fit-banner .icon svg{width:22px;height:22px;flex:none}
.fit-banner h3{font-size:15.5px;font-weight:800}
.fit-banner p{font-size:13px;color:var(--ink-2)}
.fit-banner .rule{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:right;flex:none}

.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:15px;transition:box-shadow .2s ease,border-color .2s ease;position:relative;
}
.ex:hover{box-shadow:var(--shadow)}
.ex.all-done{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--surface))}
.ex-head{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.ex-num{width:24px;height:24px;border-radius:8px;background:var(--blue-soft);color:var(--blue-deep);font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ex-name{font-size:14px;font-weight:800}
.ex-part{font-size:10.5px;font-weight:800;color:var(--coral-deep);background:var(--coral-soft);padding:2px 8px;border-radius:99px;margin-left:auto}
.ex-target{font-size:12.5px;color:var(--ink-2);font-weight:600}
.ex-tip{font-size:11.5px;color:var(--ink-3);margin:2px 0 10px;line-height:1.5}
.sets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-btn{
  width:38px;height:38px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);
  font-size:12.5px;font-weight:800;color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s var(--ease);
}
.set-btn:hover{border-color:var(--blue);color:var(--blue);transform:scale(1.06)}
.set-btn:active{transform:scale(.92)}
.set-btn.on{background:linear-gradient(135deg,var(--green),var(--green-deep));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(23,178,106,.35)}
.set-btn.on::after{content:"✓";font-size:15px}
.sets .lbl{font-size:11.5px;color:var(--ink-3);margin-left:2px}
.rest-tip{display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--amber-soft);color:#9a6708;font-size:12.5px;font-weight:600}
[data-theme="dark"] .rest-tip{color:var(--amber)}
.rest-tip svg{width:16px;height:16px;flex:none}

.w-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;margin-bottom:6px}
.w-item:last-child{margin-bottom:0}
.w-item .d{font-weight:700;width:52px;flex:none}
.w-item .v{font-weight:800;width:66px;flex:none}
.w-item .delta{font-size:12px;font-weight:700;flex:1}
.w-item .delta.up{color:var(--coral-deep)}
.w-item .delta.down{color:var(--green)}
.w-item .delta.flat{color:var(--ink-3)}
.w-item .del{opacity:.6;color:var(--ink-3);padding:5px;border-radius:7px;transition:all .15s;flex:none}
.w-item .del:hover{opacity:1;color:var(--coral-deep);background:var(--coral-soft)}
.w-item .del svg{width:13px;height:13px;display:block}

.diet-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;margin-bottom:6px}
.diet-row:last-child{margin-bottom:0}
.diet-row .meal{font-weight:800;width:44px;flex:none;color:var(--violet)}
.diet-row .food{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diet-row .kcal{font-weight:800;flex:none;color:var(--amber)}
.diet-row .del{opacity:.6;color:var(--ink-3);padding:5px;border-radius:7px;flex:none;transition:all .15s}
.diet-row .del:hover{opacity:1;color:var(--coral-deep);background:var(--coral-soft)}
.diet-row .del svg{width:13px;height:13px;display:block}
.diet-total{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:10px;background:var(--blue-soft);font-size:13px;font-weight:700;color:var(--blue-deep);margin-top:8px}
[data-theme="dark"] .diet-total{color:var(--blue-deep)}

.hist-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);font-size:13px;transition:all .15s var(--ease)}
.hist-item:hover{border-color:var(--line-2);background:var(--surface)}
.hist-date{font-weight:700;width:96px;flex:none}
.hist-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}
.hist-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.hist-n{font-size:12px;color:var(--ink-2);font-weight:700;width:42px;text-align:right;flex:none}
.hist-note{font-size:12px;color:var(--ink-3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.rpe-badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);flex:none}

/* 日程：日视图 */
.sched-day{position:relative}
.sched-hours{position:relative;border-left:2px solid var(--line);margin-left:56px;padding:8px 0}
.sched-hour{position:relative;height:52px;border-top:1px dashed var(--line)}
.sched-hour:first-child{border-top:none}
.sched-hour .lab{position:absolute;left:-52px;top:-8px;width:44px;text-align:right;font-size:11px;font-weight:700;color:var(--ink-3)}
.sched-block{
  position:absolute;left:8px;right:8px;border-radius:10px;padding:7px 11px;font-size:12.5px;
  border:1.5px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s;z-index:2;
}
.sched-block:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);z-index:3}
.sched-block .t{font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sched-block .s{font-size:11px;color:var(--ink-2);margin-top:1px}
.sched-block.type-class{background:var(--blue-soft);border-color:var(--blue-2)}
.sched-block.type-study{background:var(--violet-soft);border-color:var(--violet)}
.sched-block.type-fitness{background:var(--coral-soft);border-color:var(--coral)}
.sched-block.type-rest{background:var(--green-soft);border-color:var(--green)}
.sched-block.done{opacity:.6}
.sched-block.done .t s{color:var(--ink-3)}
.sched-block .conflict-flag{position:absolute;top:5px;right:7px;font-size:10px;color:#a8760a}
[data-theme="dark"] .sched-block .conflict-flag{color:var(--amber)}

/* 日程：周视图 */
.sched-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sched-wcol{min-width:0}
.sched-wcol .head{font-size:11.5px;font-weight:800;text-align:center;padding:6px 2px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);margin-bottom:6px}
.sched-wcol.today .head{background:var(--blue);color:#fff}
.sched-wblock{font-size:11px;padding:5px 7px;border-radius:7px;margin-bottom:4px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;overflow:hidden}
.sched-wblock .bt{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-wblock .bs{color:var(--ink-3);font-size:10px}
.sched-wblock.type-class{background:var(--blue-soft)}
.sched-wblock.type-study{background:var(--violet-soft)}
.sched-wblock.type-fitness{background:var(--coral-soft)}
.sched-wblock.type-rest{background:var(--green-soft)}
.sched-wblock.done{opacity:.55}

/* 复盘 */
.review-field{margin-bottom:14px}
.review-field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.review-field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);resize:vertical;min-height:64px;line-height:1.6;font-size:13.5px}
.review-field textarea:focus{outline:none;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3.5px rgba(59,110,245,.14)}
.review-hist{border-left:3px solid var(--line);padding-left:14px;margin-bottom:16px}
.review-hist .rh-head{font-size:13px;font-weight:800;margin-bottom:5px}
.review-hist .rh-item{font-size:12.5px;color:var(--ink-2);margin-bottom:3px;line-height:1.6}
.review-hist .rh-item b{color:var(--ink)}

/* 计时器浮动条 */
.timer-bar{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:300;
  background:var(--ink);color:var(--bg);padding:9px 12px 9px 18px;border-radius:99px;
  box-shadow:0 14px 40px rgba(15,20,40,.4);max-width:calc(100vw - 24px);
}
.timer-info{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;white-space:nowrap}
.timer-dot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite;flex:none}
.timer-info strong{font-size:16px;font-variant-numeric:tabular-nums}
.timer-actions{display:flex;gap:6px}
.timer-bar .btn.small{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.timer-bar .btn.small:hover{background:rgba(255,255,255,.22)}
.timer-bar .btn.small.primary{background:var(--blue);border-color:var(--blue)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:700;
  padding:11px 20px;border-radius:99px;box-shadow:0 12px 34px rgba(15,20,40,.4);
  opacity:0;pointer-events:none;transition:all .28s var(--ease);z-index:500;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 弹窗 */
dialog.modal{
  border:none;border-radius:var(--r-lg);box-shadow:0 24px 70px rgba(15,20,40,.35);
  padding:0;width:min(480px,92vw);background:var(--surface);color:var(--ink);
}
dialog.modal.wide{width:min(640px,94vw)}
dialog.modal.danger .modal-head h2{color:var(--coral-deep)}
dialog::backdrop{background:rgba(20,24,40,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:dlgIn .28s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 0}
.modal-head h2{font-size:16.5px;font-weight:800}
.modal-body{padding:16px 22px 4px;max-height:min(64vh,560px);overflow-y:auto}
.modal-text{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field-hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.6}

/* 设置列表 */
.set-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.set-row:last-child{border-bottom:none}
.set-row .body{flex:1;min-width:0}
.set-row .t{font-weight:700}
.set-row .d{font-size:12px;color:var(--ink-3)}
.subj-pill{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);color:var(--blue-deep);font-size:12.5px;font-weight:700;padding:5px 6px 5px 12px;border-radius:99px}
.subj-pill button{color:var(--blue-deep);opacity:.55;font-size:14px;line-height:1;padding:0 4px;border-radius:50%;transition:all .15s}
.subj-pill button:hover{opacity:1;color:var(--coral-deep);transform:rotate(90deg)}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .hero-top{grid-template-columns:1fr}
  .grid2,.grid2-13{grid-template-columns:1fr}
}
@media (max-width:720px){
  :root{--nav-h:62px}
  .app{padding:14px 13px calc(var(--nav-h) + 26px)}
  /* 导航移到底部 */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:200;
    background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);border-bottom:none;
    margin:0;padding:0 6px;justify-content:space-around;gap:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)){ .nav{background:var(--surface)} }
  .nav-item{
    flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;border-radius:10px;
    min-height:var(--nav-h);justify-content:center;position:relative;
  }
  .nav-item svg{width:20px;height:20px}
  .nav-item.active{color:var(--blue)}
  .nav-item.active::after{left:50%;right:auto;transform:translateX(-50%);bottom:2px;width:26px;height:3px;border-radius:3px}
  .nav-item .badge{position:absolute;top:4px;right:calc(50% - 20px)}
  .timer-bar{bottom:calc(var(--nav-h) + 10px);width:calc(100vw - 20px)}
  .toast{bottom:calc(var(--nav-h) + 76px)}

  .card{padding:15px;border-radius:14px}
  .countdown{flex-wrap:wrap}
  .countdown .num{font-size:42px}
  .hello .big{font-size:20px}
  .ex-grid{grid-template-columns:1fr}
  .sched-week{grid-template-columns:repeat(7,1fr);gap:3px}
  .sched-wblock{font-size:10px;padding:4px 5px}
  .hist-date{width:78px}
  .hist-note{display:none}
  .hbar-name{width:72px;font-size:12px}
  .topbar{padding:10px 0}
  .date-line{display:none}
  .focus-task{flex-wrap:wrap}
  .focus-task .ops{width:100%;justify-content:flex-end}
  .sched-hours{margin-left:48px}
  .sched-hour .lab{left:-48px;width:40px}
  .timeline{padding-left:48px}
  .timeline::before{left:37px}
  .tl-item .time{left:-48px;width:38px;font-size:11px}
  .tl-item .dot{left:-15px}
  .tl-nowline{margin-left:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}

</style>
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<div class="app" id="app">
  <!-- 顶栏 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-text">
        <h1>LifeOS</h1>
        <div class="date-line" id="dateLine"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="chip-sync" id="syncChip" type="button" title="数据同步状态"></button>
      <button class="icon-btn" id="btnTheme" type="button" aria-label="切换深浅主题" title="切换主题"></button>
      <button class="icon-btn" id="btnExport" type="button" aria-label="导出备份" title="导出备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 导航（桌面顶部 / 移动底部） -->
  <nav class="nav" id="nav" aria-label="主导航">
    <button class="nav-item active" data-view="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-view="tasks" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

<script>

/* ================= src/js/store.js ================= */
/* ================= LifeOs 数据层 =================
 * 模型版本 v2：所有记录带 id / updatedAt / deleted（软删除墓碑），
 * 为跨设备同步与冲突处理做准备。v1 数据自动迁移并先备份。 */
"use strict";

const DB_KEY = "lifeos.v2";
const DB_V1_BACKUP_KEY = "lifeos.v1.backup";
const TIMER_KEY = "lifeos.timer.active";

const DEFAULT_EXERCISES = [
  { id: "pushup", name: "标准俯卧撑", sets: 3, reps: "15 次", part: "胸 · 三头", tip: "核心收紧，身体成一条直线，下放至胸口贴近地面" },
  { id: "press",  name: "单臂哑铃推举", sets: 3, reps: "左右各 10 次", part: "肩", tip: "左手 10 次后立刻换右手 10 次，合计为一组" },
  { id: "row",    name: "单臂哑铃划船", sets: 3, reps: "左右各 10 次", part: "背", tip: "腰背平直，哑铃拉向髋部，挤压背部" },
  { id: "squat",  name: "哑铃深蹲", sets: 3, reps: "15 次", part: "腿 · 臀", tip: "膝盖朝向脚尖方向，蹲至大腿与地面平行" },
  { id: "curl",   name: "哑铃弯举", sets: 3, reps: "12 次", part: "二头", tip: "大臂贴紧身体，不要借力摆动" },
  { id: "plank",  name: "平板支撑", sets: 3, reps: "60 秒", part: "核心", tip: "臀部不塌不翘，自然呼吸" }
];

const MEALS = ["早餐", "午餐", "晚餐", "加餐"];
const BLOCK_TYPES = [
  { id: "class",  name: "课程",   color: "var(--blue)" },
  { id: "study",  name: "学习",   color: "var(--violet)" },
  { id: "fitness",name: "健身",   color: "var(--coral)" },
  { id: "rest",   name: "休息",   color: "var(--green)" },
  { id: "other",  name: "其他",   color: "var(--ink-3)" }
];
const PRIORITIES = { high: "紧急", normal: "普通", low: "低优" };

function defaultState() {
  return {
    v: 2,
    settings: {
      theme: "auto",            // light | dark | auto
      examName: "考研初试",
      examDate: "",             // 为空时首页引导设置，不硬编码历史日期
      dietGoalKcal: 0,
      weightGoal: null,
      training: {
        planDays: [2, 4, 6],
        restSec: 90,
        exercises: DEFAULT_EXERCISES.map(e => ({ ...e }))
      },
      subjects: []
    },
    tasks: [],
    study: [],
    fitness: {},
    weight: {},
    diet: {},
    blocks: [],
    reviews: {},
    quotes: { queue: [], shown: {} }
  };
}

/* ---------- v1 → v2 迁移 ---------- */
function migrateV1(raw) {
  if (!raw || typeof raw !== "object") return defaultState();
  // 已经是 v2：补缺省字段（前向兼容）
  if (raw.v === 2) {
    const d = defaultState();
    const merged = { ...d, ...raw };
    merged.settings = { ...d.settings, ...(raw.settings || {}) };
    merged.settings.training = { ...d.settings.training, ...(raw.settings && raw.settings.training || {}) };
    if (!Array.isArray(merged.settings.subjects)) merged.settings.subjects = [];
    merged.tasks = Array.isArray(raw.tasks) ? raw.tasks : [];
    merged.study = Array.isArray(raw.study) ? raw.study : [];
    merged.blocks = Array.isArray(raw.blocks) ? raw.blocks : [];
    ["fitness", "weight", "diet", "reviews", "quotes"].forEach(k => {
      if (!merged[k] || typeof merged[k] !== "object") merged[k] = d[k];
    });
    return merged;
  }

  // v1：先整包备份，再转换
  try { localStorage.setItem(DB_V1_BACKUP_KEY, JSON.stringify(raw)); } catch (e) { /* 忽略 */ }
  const s = raw.settings || {};
  const subjects = (Array.isArray(s.subjects) ? s.subjects : []).map(name => ({
    id: uid(), name: String(name), weeklyMin: 0, goal: "", note: ""
  }));
  const byName = {};
  subjects.forEach(x => { byName[x.name] = x.id; });
  const tasks = (Array.isArray(raw.tasks) ? raw.tasks : []).map(t => ({
    id: t.id || uid(),
    title: String(t.title || ""),
    subjectId: (t.subject && byName[t.subject]) || null,
    due: t.due || "",
    priority: t.priority || "normal",
    estMin: 0,
    done: !!t.done,
    doneAt: t.doneAt || null,
    createdAt: t.createdAt || Date.now(),
    updatedAt: t.createdAt || Date.now(),
    deleted: false
  }));
  // v1 fitness: {date: {pushup:[..], note}} → v2 {date:{checks:{exId:[..]},note,rpe}}
  const fitness = {};
  Object.entries(raw.fitness || {}).forEach(([d, rec]) => {
    if (!rec || typeof rec !== "object") return;
    const checks = {};
    Object.entries(rec).forEach(([k, v]) => {
      if (Array.isArray(v)) checks[k] = v.slice(); // 动作打卡数组 → checks
    });
    fitness[d] = { checks, note: rec.note || "", rpe: rec.rpe || "", updatedAt: rec.updatedAt || Date.now() };
  });
  return {
    ...defaultState(),
    settings: {
      ...defaultState().settings,
      examName: s.examName || "考研初试",
      examDate: s.examDate || "",
      subjects
    },
    tasks,
    fitness,
    weight: raw.weight && typeof raw.weight === "object" ? raw.weight : {},
    quotes: (raw.quotes && typeof raw.quotes === "object") ? raw.quotes : { queue: [], shown: {} }
  };
}

const Store = {
  state: defaultState(),

  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(DB_KEY) || "null"); } catch (e) { raw = null; }
    // 兼容 v1 旧键
    if (!raw) {
      try { raw = JSON.parse(localStorage.getItem("studyWorkbench.v1") || "null"); } catch (e) { raw = null; }
    }
    this.state = migrateV1(raw);
    if (raw && raw.v !== 2) this.save();
    return this.state;
  },

  save() {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(this.state));
      Sync.markLocalChange();
    } catch (e) {
      UI.toast("保存失败：浏览器存储空间不足");
    }
  },

  /* ---- 通用记录操作（统一维护 updatedAt） ---- */
  touch(rec) { rec.updatedAt = Date.now(); return rec; },

  /* ---- 科目 ---- */
  subjects() { return this.state.settings.subjects.filter(s => !s.archived); },
  subjectName(id) { const s = this.state.settings.subjects.find(x => x.id === id); return s ? s.name : ""; },

  /* ---- 任务 ---- */
  openTasks() { return this.state.tasks.filter(t => !t.deleted && !t.done); },
  taskById(id) { return this.state.tasks.find(t => t.id === id); },

  /* ---- 学习记录 ---- */
  studyOf(date) { return this.state.study.filter(r => !r.deleted && r.date === date); },
  studyMinutes(date) { return this.studyOf(date).reduce((a, r) => a + r.minutes, 0); },
  studyMinutesBetween(d0, d1) {
    return this.state.study.filter(r => !r.deleted && r.date >= d0 && r.date <= d1).reduce((a, r) => a + r.minutes, 0);
  },

  /* ---- 体重 ---- */
  weightOf(date) { const v = this.state.weight[date]; return (v === undefined || v === null) ? null : v; },
  weight7Avg(dateStr) {
    // 以 dateStr 结尾的 7 个自然日内有记录的平均值（平滑指标）
    const vals = [];
    for (let i = 6; i >= 0; i--) {
      const d = parseDate(dateStr); d.setDate(d.getDate() - i);
      const v = this.weightOf(dstr(d));
      if (v !== null) vals.push(v);
    }
    if (!vals.length) return null;
    return +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
  },

  /* ---- 饮食 ---- */
  dietOf(date) { return (this.state.diet[date] || []).filter(d => !d.deleted); },
  dietKcal(date) { return this.dietOf(date).reduce((a, d) => a + (d.kcal || 0), 0); },

  /* ---- 时间块 ---- */
  blocksOf(date) { return this.state.blocks.filter(b => !b.deleted && b.date === date).sort((a, b) => a.start < b.start ? -1 : 1); },
  blocksBetween(d0, d1) { return this.state.blocks.filter(b => !b.deleted && b.date >= d0 && b.date <= d1); },

  /* ---- 复盘 ---- */
  reviewOf(date) { return this.state.reviews[date] || null; }
};

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const todayStr = () => dstr(today());
const parseDate = s => { const [a, b, c] = s.split("-").map(Number); return new Date(a, b - 1, c); };
const dayDiff = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const WEEK_CN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const WEEK_SHORT = ["日", "一", "二", "三", "四", "五", "六"];
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const fmtMin = m => (m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60 ? (m % 60) + " 分" : ""}` : `${m} 分钟`);
const fmtClock = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const PRIORITY_LABEL = p => PRIORITIES[p] || "普通";
const BLOCK_TYPE_LABEL = t => { const b = BLOCK_TYPES.find(x => x.id === t); return b ? b.name : "其他"; };

/* 本周范围（周一为第一天） */
function weekRange(anyDate) {
  const t = anyDate || today();
  const dow = (t.getDay() + 6) % 7;
  const mon = new Date(t); mon.setDate(t.getDate() - dow);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [dstr(mon), dstr(sun)];
}
/* 相对日期描述 */
function fmtDue(s) {
  const diff = dayDiff(todayStr(), s);
  if (diff === 0) return "今天";
  if (diff === 1) return "明天";
  if (diff === -1) return "昨天";
  if (diff < 0) return `逾期 ${-diff} 天`;
  if (diff <= 7) return `${diff} 天后`;
  const d = parseDate(s); return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function dueCls(s, done) {
  if (done || !s) return "";
  const diff = dayDiff(todayStr(), s);
  if (diff < 0) return "over";
  if (diff === 0) return "today";
  return "";
}
/* 按科目分组统计任务 */
function taskStatsBySubject() {
  const map = {};
  Store.state.tasks.filter(t => !t.deleted).forEach(t => {
    const k = t.subjectId || "__none";
    if (!map[k]) map[k] = { done: 0, total: 0 };
    map[k].total++; if (t.done) map[k].done++;
  });
  return map;
}


/* ================= src/js/ui.js ================= */
/* ================= UI 工具层 ================= */
"use strict";

const UI = {
  $: s => document.querySelector(s),
  $$: s => Array.from(document.querySelectorAll(s)),

  /* 创建元素快捷方式（自动处理 SVG 命名空间） */
  SVG_TAGS: new Set(["svg", "path", "circle", "line", "polyline", "polygon", "rect", "text", "g", "stop", "defs", "linearGradient", "radialGradient", "animate", "title", "tspan", "ellipse"]),
  h(tag, attrs = {}, ...children) {
    const el = this.SVG_TAGS.has(tag)
      ? document.createElementNS("http://www.w3.org/2000/svg", tag)
      : document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === "class") el.className = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    children.flat().forEach(c => {
      if (c == null) return;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
    return el;
  },

  toast(msg, ms = 2200) {
    const t = UI.$("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove("show"), ms);
  },

  /* ---------- 模态框系统 ---------- */
  modal({ title, body, submitText = "确定", cancelText = "取消", danger = false, wide = false, onSubmit }) {
    const dlg = UI.h("dialog", { class: "modal" + (wide ? " wide" : "") + (danger ? " danger" : "") });
    const form = UI.h("form", { method: "dialog", class: "modal-form", novalidate: true });
    const close = () => { dlg.close(); dlg.remove(); };

    dlg.append(
      UI.h("div", { class: "modal-head" },
        UI.h("h2", {}, title),
        UI.h("button", { class: "icon-btn", type: "button", "aria-label": "关闭", onclick: close },
          UI.h("span", { "aria-hidden": true, style: "font-size:18px;line-height:1" }, "×")))
    );
    const bodyEl = UI.h("div", { class: "modal-body" });
    if (typeof body === "function") body(bodyEl, close);
    else if (body) bodyEl.append(body);
    const actions = UI.h("div", { class: "modal-actions" },
      UI.h("button", { class: "btn", type: "button", onclick: close }, cancelText),
      UI.h("button", { class: "btn " + (danger ? "danger" : "primary"), type: "submit" }, submitText)
    );
    form.append(bodyEl, actions);
    form.addEventListener("submit", e => {
      e.preventDefault();
      if (onSubmit) {
        const r = onSubmit(bodyEl, close);
        if (r === false) return;
      }
      close();
    });
    dlg.append(form);
    document.body.append(dlg);
    dlg.showModal();
    // 自动聚焦第一个输入
    setTimeout(() => { const f = dlg.querySelector("input,select,textarea,button.primary"); if (f) f.focus(); }, 30);
    return { dlg, close };
  },

  /* 危险操作二次确认 */
  confirmDanger(title, message, confirmText = "确认删除") {
    return new Promise(resolve => {
      let resolved = false;
      const m = UI.modal({
        title, danger: true, submitText: confirmText,
        body: el => el.append(UI.h("p", { class: "modal-text" }, message)),
        onSubmit: () => { resolved = true; resolve(true); }
      });
      m.dlg.addEventListener("close", () => { if (!resolved) resolve(false); });
    });
  },

  /* ---------- 表单字段 ---------- */
  field(labelText, input, hint) {
    const lab = UI.h("label", { class: "field-label" }, labelText);
    const wrap = UI.h("div", { class: "field" }, lab, input);
    if (hint) wrap.append(UI.h("div", { class: "field-hint" }, hint));
    return wrap;
  },

  input({ type = "text", value = "", placeholder = "", min, max, step, required = false, id }) {
    const el = UI.h("input", { type, value: value == null ? "" : String(value), placeholder, class: "inp" });
    if (min != null) el.min = min;
    if (max != null) el.max = max;
    if (step != null) el.step = step;
    if (required) el.required = true;
    if (id) el.id = id;
    return el;
  },

  select(options, value, { allLabel } = {}) {
    const sel = UI.h("select", { class: "inp" });
    if (allLabel) sel.append(UI.h("option", { value: "" }, allLabel));
    options.forEach(o => {
      const opt = UI.h("option", { value: o.value }, o.label);
      if (String(o.value) === String(value)) opt.selected = true;
      sel.append(opt);
    });
    return sel;
  },

  /* ---------- 空状态 / 加载 ---------- */
  empty(title, sub, actionBtn) {
    return UI.h("div", { class: "empty" },
      UI.h("div", { class: "empty-icon", "aria-hidden": "true" }, "◇"),
      UI.h("b", {}, title),
      sub ? UI.h("p", {}, sub) : null,
      actionBtn || null
    );
  },

  /* 统计卡片 */
  stat({ value, label, color, sub, onClick, ariaLabel }) {
    const el = UI.h("button", { class: "stat", type: "button", "aria-label": ariaLabel || label },
      UI.h("div", { class: "stat-v" + (color ? " " + color : "") }, String(value)),
      UI.h("div", { class: "stat-k" }, label),
      sub ? UI.h("div", { class: "stat-sub" }, sub) : null
    );
    if (onClick) el.addEventListener("click", onClick);
    return el;
  },

  /* 区块标题 */
  sectionTitle(text, extra) {
    return UI.h("div", { class: "sec-title" },
      UI.h("h2", {}, text),
      extra || null
    );
  }
};

/* ---------- 主题 ---------- */
const Theme = {
  mq: window.matchMedia("(prefers-color-scheme: dark)"),
  current() {
    const t = Store.state.settings.theme || "auto";
    return t === "auto" ? (this.mq.matches ? "dark" : "light") : t;
  },
  apply() {
    document.documentElement.dataset.theme = this.current();
    document.querySelector('meta[name="theme-color"]').setAttribute("content", this.current() === "dark" ? "#101425" : "#f5f6fa");
  },
  toggle() {
    Store.state.settings.theme = this.current() === "dark" ? "light" : "dark";
    Store.save(); this.apply();
  },
  init() {
    this.mq.addEventListener("change", () => { if ((Store.state.settings.theme || "auto") === "auto") this.apply(); });
    this.apply();
  }
};


/* ================= src/js/charts.js ================= */
/* ================= SVG 图表库（零依赖） ================= */
"use strict";

const Charts = {
  svg(w, h, content, label) {
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", `0 0 ${w} ${h}`);
    s.setAttribute("role", "img");
    if (label) s.setAttribute("aria-label", label);
    s.style.width = "100%";
    s.style.height = "auto";
    s.style.display = "block";
    s.innerHTML = content;
    return s;
  },

  /* ---------- 折线图（体重/学习趋势） ---------- */
  line({ points, w = 620, h = 180, unit = "", color = "var(--blue)", label }) {
    // points: [{label, value}]
    if (!points || points.length < 2) return null;
    const PL = 40, PR = 14, PT = 16, PB = 26;
    const vals = points.map(p => p.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 0.001) { max = min + 0.5; min -= 0.5; }
    else { const pad = (max - min) * 0.14; max += pad; min -= pad; }
    const x = i => PL + (w - PL - PR) * (i / (points.length - 1));
    const y = v => PT + (h - PT - PB) * (1 - (v - min) / (max - min));
    const pts = points.map((p, i) => [x(i), y(p.value)]);
    const path = "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
    const area = path + ` L${x(points.length - 1).toFixed(1)},${h - PB} L${x(0).toFixed(1)},${h - PB} Z`;
    const gid = "lg-" + Math.random().toString(36).slice(2, 8);
    const dots = pts.map((p, i) =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? color : "var(--surface)"}" stroke="${color}" stroke-width="2.5"><title>${esc(points[i].label)}：${points[i].value}${unit}</title></circle>`).join("");
    const content = `
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${color}" stop-opacity=".22"/>
          <stop offset="1" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${PL}" y1="${h - PB}" x2="${w - PR}" y2="${h - PB}" stroke="var(--line)" stroke-width="1.5"/>
      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${h - PB}" stroke="var(--line)" stroke-width="1.5"/>
      <text class="chart-axis" x="${PL - 6}" y="${PT + 9}" text-anchor="end">${max.toFixed(1)}</text>
      <text class="chart-axis" x="${PL - 6}" y="${h - PB + 4}" text-anchor="end">${min.toFixed(1)}</text>
      <path d="${area}" fill="url(#${gid})" class="chart-area"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chart-line"/>
      ${dots}
      <text class="chart-axis" x="${PL}" y="${h - 6}">${esc(points[0].label)}</text>
      <text class="chart-axis" x="${w - PR}" y="${h - 6}" text-anchor="end">${esc(points[points.length - 1].label)}</text>`;
    return this.svg(w, h, content, label);
  },

  /* ---------- 柱状图（每日学习时长/任务完成） ---------- */
  bars({ items, w = 620, h = 190, unit = "", label, highlightLast = true }) {
    // items: [{label, value, tip}]
    if (!items || !items.length) return null;
    const PL = 8, PR = 8, PT = 18, PB = 28;
    const max = Math.max(1, ...items.map(i => i.value));
    const bw = (w - PL - PR) / items.length;
    const bars = items.map((it, i) => {
      const bh = Math.max(3, (h - PT - PB) * (it.value / max));
      const x = PL + i * bw + bw * 0.18;
      const y = h - PB - bh;
      const isToday = highlightLast && i === items.length - 1;
      return `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="6" fill="${isToday ? "var(--blue)" : "var(--blue-soft-2)"}" stroke="${isToday ? "var(--blue)" : "var(--blue-2)"}" stroke-width="1.5"><title>${esc(it.tip || it.label)}：${it.value}${unit}</title></rect>
      <text class="chart-axis" x="${(x + bw * 0.32).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(it.label)}</text></g>`;
    }).join("");
    return this.svg(w, h, bars, label);
  },

  /* ---------- 横向条形（科目分布） ---------- */
  hbars({ items, label }) {
    // items: [{name, done, total, onClick}]
    if (!items || !items.length) return null;
    const rows = items.map(it => {
      const pct = it.total ? Math.round(it.done / it.total * 100) : 0;
      return `<div class="hbar-row" ${it.onClick ? 'data-click="1"' : ""}>
        <span class="hbar-name">${esc(it.name)}</span>
        <span class="hbar-track"><span class="hbar-fill" style="width:${pct}%"></span></span>
        <span class="hbar-n">${it.done}/${it.total}</span>
      </div>`;
    }).join("");
    const div = UI.h("div", { class: "hbars", role: "img", "aria-label": label || "科目分布" });
    div.innerHTML = rows;
    if (items.some(i => i.onClick)) {
      div.querySelectorAll(".hbar-row").forEach((row, i) => {
        if (items[i].onClick) row.addEventListener("click", items[i].onClick);
      });
    }
    return div;
  },

  /* ---------- 进度环 ---------- */
  ring(pct, { size = 120, stroke = 11, color = "var(--blue)", label }) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
    const content = `
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" class="chart-ring">
        <animate attributeName="stroke-dashoffset" from="${c.toFixed(1)}" to="${off.toFixed(1)}" dur="0.9s" fill="freeze"/>
      </circle>
      <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-text">${pct}%</text>
      ${label ? `<text x="50%" y="63%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-sub">${esc(label)}</text>` : ""}`;
    const el = this.svg(size, size, content, `完成率 ${pct}%`);
    el.style.width = size + "px";
    return el;
  },

  /* ---------- 热力图 ---------- */
  heatmap({ weeks = 8, getState, getTitle, label }) {
    // getState(dateStr) => "" | "part" | "full" | "plan"
    const t = today(), dow = (t.getDay() + 6) % 7;
    const mon = new Date(t); mon.setDate(t.getDate() - dow - 7 * (weeks - 1));
    const cells = [];
    for (let wk = 0; wk < weeks; wk++) for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(d.getDate() + wk * 7 + i);
      const ds = dstr(d);
      const st = getState(ds);
      const cls = ["heat-cell"];
      if (st === "full") cls.push("full");
      else if (st === "part") cls.push("part");
      else if (st === "plan") cls.push("plan");
      if (ds === todayStr()) cls.push("now");
      cells.push(UI.h("div", { class: cls.join(" "), title: getTitle(ds), role: "img", "aria-label": getTitle(ds) }));
    }
    return UI.h("div", { class: "heat" }, cells);
  }
};


/* ================= src/js/sync.js ================= */
/* ================= 同步服务 =================
 * 状态机：local（本地模式，未配置云）→ 已登录 → syncing → synced / offline / error / pending
 * 设计原则：
 * - 无 Supabase 配置时永远是 local 状态，UI 如实显示「本地模式」，绝不假装同步成功；
 * - 所有记录带 id / updatedAt / deleted，为按记录合并做准备；
 * - 接入云端只需实现 CloudAdapter 接口并在 init 时注入（见 docs/SUPABASE_SETUP.md）。 */
"use strict";

const Sync = {
  status: "local",          // local | offline | syncing | synced | error | pending
  adapter: null,            // 未来注入 SupabaseAdapter
  lastSyncAt: null,
  lastError: "",
  _dirty: false,

  STATUS_TEXT: {
    local:   { icon: "●", text: "本地模式", tip: "数据仅保存在本机浏览器。配置云同步后可在多设备间同步（见 docs/SUPABASE_SETUP.md）" },
    offline: { icon: "○", text: "离线", tip: "网络不可用，更改已保存到本地，恢复联网后自动重试" },
    syncing: { icon: "◌", text: "同步中", tip: "正在与云端同步…" },
    synced:  { icon: "✓", text: "已同步", tip: "所有更改已同步到云端" },
    error:   { icon: "!", text: "同步失败", tip: "同步出错，可点击重试；本地数据不受影响" },
    pending: { icon: "↑", text: "待同步", tip: "有尚未同步的本地更改" }
  },

  init() {
    // 无 adapter → 本地模式。云端接入时：
    //   Sync.adapter = new SupabaseAdapter({ url, anonKey });
    //   if (Sync.adapter) await Sync.loginIfSession();
    if (!this.adapter) { this.setStatus("local"); return; }
    window.addEventListener("online", () => this.flush());
    window.addEventListener("offline", () => { if (this.adapter) this.setStatus("offline"); });
    if (navigator.onLine === false && this.adapter) this.setStatus("offline");
  },

  setStatus(s, err) {
    this.status = s;
    if (err) this.lastError = err;
    this.renderChip();
  },

  /* 本地发生更改：有 adapter 时标记待同步并触发 flush；无 adapter 时仅记录 */
  markLocalChange() {
    if (!this.adapter) return;
    this._dirty = true;
    if (this.status === "synced") this.setStatus("pending");
    this.scheduleFlush();
  },

  _flushTimer: null,
  scheduleFlush() {
    clearTimeout(this._flushTimer);
    this._flushTimer = setTimeout(() => this.flush(), 1200);
  },

  async flush() {
    if (!this.adapter || !this._dirty) return;
    if (navigator.onLine === false) { this.setStatus("offline"); return; }
    this.setStatus("syncing");
    try {
      await this.adapter.push(Store.state);
      this._dirty = false;
      this.lastSyncAt = Date.now();
      this.setStatus("synced");
    } catch (e) {
      console.warn("[sync] push failed:", e && e.message);
      this.setStatus("error", e && e.message);
    }
  },

  async pull() {
    if (!this.adapter) return;
    this.setStatus("syncing");
    try {
      const remote = await this.adapter.pull();
      const merged = mergeStates(Store.state, remote);
      Store.state = merged;
      Store.save();
      this._dirty = false;
      this.setStatus("synced");
    } catch (e) {
      console.warn("[sync] pull failed:", e && e.message);
      this.setStatus("error", e && e.message);
    }
  },

  async retry() {
    if (!this.adapter) {
      UI.toast("尚未配置云同步：请查看 docs/SUPABASE_SETUP.md 完成部署");
      return;
    }
    await this.flush();
    if (this.status === "error") UI.toast("同步失败：" + (this.lastError || "未知错误") + "，可再次点击重试");
  },

  renderChip() {
    const chip = document.getElementById("syncChip");
    if (!chip) return;
    const s = this.STATUS_TEXT[this.status] || this.STATUS_TEXT.local;
    chip.innerHTML = `<span class="sync-icon ${this.status}" aria-hidden="true">${s.icon}</span><span class="sync-text">${s.text}</span>`;
    chip.title = s.tip;
    chip.setAttribute("aria-label", "数据同步状态：" + s.text);
  }
};

/* ---------- 记录级合并（为跨设备同步准备） ----------
 * 策略：按集合逐条比较 updatedAt，较新者胜；软删除记录保留墓碑，避免已删除项被同步回来；
 * 无 updatedAt 的旧记录视为本地较新。 */
function mergeStates(local, remote) {
  if (!remote || typeof remote !== "object") return local;
  const pick = (a, b) => (b && (b.updatedAt || 0) >= (a && a.updatedAt || 0)) ? b : a;
  const mergeArr = (A = [], B = []) => {
    const map = new Map();
    A.concat(B).forEach(r => {
      if (!r || !r.id) return;
      const ex = map.get(r.id);
      map.set(r.id, ex ? pick(ex, r) : r);
    });
    return Array.from(map.values());
  };
  const mergeDict = (A = {}, B = {}) => {
    const out = { ...A };
    Object.keys(B).forEach(k => {
      const a = out[k], b = B[k];
      if (a && b && typeof a === "object" && !Array.isArray(a)) out[k] = { ...a, ...b, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
      else out[k] = b;
    });
    return out;
  };
  return {
    v: 2,
    settings: { ...local.settings, ...remote.settings, training: { ...local.settings.training, ...(remote.settings && remote.settings.training || {}) } },
    tasks: mergeArr(local.tasks, remote.tasks),
    study: mergeArr(local.study, remote.study),
    blocks: mergeArr(local.blocks, remote.blocks),
    fitness: mergeDict(local.fitness, remote.fitness),
    weight: mergeDict(local.weight, remote.weight),
    diet: mergeDict(local.diet, remote.diet),
    reviews: mergeDict(local.reviews, remote.reviews),
    quotes: local.quotes
  };
}

/* ---------- CloudAdapter 接口约定（实现类需提供） ----------
 * class SupabaseAdapter {
 *   constructor({ url, anonKey }) { ... }
 *   async signUp / signIn / signOut / currentUser()
 *   async push(state)   // 上传本地更改（可实现为按表 upsert）
 *   async pull()        // 拉取远端全量，返回与本地同构的 state
 * }
 * 密钥只允许来自服务端环境变量或部署平台的环境变量注入，禁止写进前端源码。 */


/* ================= src/js/timer.js ================= */
/* ================= 专注计时引擎 =================
 * 规则：
 * - 同时只允许一个计时；开始新的必须先结束或丢弃当前计时；
 * - 计时状态持久化到 localStorage，刷新/切页面不丢，恢复后继续累计；
 * - 暂停/继续只切换累计状态，不会产生重复时长；
 * - 只有「结束并记录」才写入 study 记录；丢弃则完全作废。 */
"use strict";

const Timer = {
  active: null,   // { subjectId, taskId, note, startedAt, accumMs, pausedAt }
  _tick: null,

  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(TIMER_KEY) || "null");
      if (raw && raw.subjectId) this.active = raw;
    } catch (e) { this.active = null; }
    return this.active;
  },

  persist() {
    try {
      if (this.active) localStorage.setItem(TIMER_KEY, JSON.stringify(this.active));
      else localStorage.removeItem(TIMER_KEY);
    } catch (e) { /* 忽略 */ }
  },

  isRunning() { return this.active && !this.active.pausedAt; },
  elapsedMs() {
    if (!this.active) return 0;
    const now = this.active.pausedAt || Date.now();
    return this.active.accumMs + (now - this.active.startedAt);
  },

  start(subjectId, taskId, note) {
    if (this.active) {
      UI.toast("已有计时在进行，请先结束或丢弃");
      return false;
    }
    this.active = { subjectId, taskId: taskId || null, note: note || "", startedAt: Date.now(), accumMs: 0, pausedAt: null };
    this.persist();
    this.startTick();
    UI.toast("计时开始");
    return true;
  },

  pause() {
    if (!this.active || this.active.pausedAt) return;
    this.active.accumMs += Date.now() - this.active.startedAt;
    this.active.pausedAt = Date.now();
    this.persist();
    UI.toast("已暂停");
  },

  resume() {
    if (!this.active || !this.active.pausedAt) return;
    this.active.startedAt = Date.now();
    this.active.pausedAt = null;
    this.persist();
    UI.toast("继续计时");
  },

  /* 结束并写入学习记录，返回记录 */
  stop() {
    if (!this.active) return null;
    const minutes = Math.max(1, Math.round(this.elapsedMs() / 60000));
    const now = new Date();
    const rec = {
      id: uid(),
      subjectId: this.active.subjectId,
      taskId: this.active.taskId,
      date: dstr(now),
      start: new Date(now.getTime() - minutes * 60000),
      end: now,
      startTime: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
      minutes,
      note: this.active.note || "",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      deleted: false
    };
    Store.state.study.push(rec);
    Store.save();
    this.discard();
    UI.toast(`已记录 ${minutes} 分钟`);
    return rec;
  },

  discard() {
    this.active = null;
    this.persist();
    this.stopTick();
  },

  startTick() {
    this.stopTick();
    this._tick = setInterval(() => App.renderTimerBar(), 1000);
    App.renderTimerBar();
  },
  stopTick() {
    clearInterval(this._tick);
    this._tick = null;
    App.renderTimerBar();
  },

  /* 恢复：页面加载时若有持久化计时，重启 tick */
  restore() {
    if (this.active) this.startTick();
  }
};


/* ================= src/js/views/today.js ================= */
/* ================= 视图：今日（行动中心） ================= */
"use strict";

const TodayView = {
  render() {
    const el = document.getElementById("view-today");
    const t = today();
    const hour = new Date().getHours();
    const greet = hour < 6 ? "夜深了" : hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : "晚上好";
    const ts = todayStr();

    el.innerHTML = "";
    el.append(
      this.heroSection(greet, t),
      this.focusSection(ts),
      this.timelineSection(ts),
      this.statsSection(ts)
    );
    this.renderTimelineInto(el, ts);
    this.fillSummary(ts);
  },

  /* 今日摘要（DOM 挂载后填充） */
  fillSummary(ts) {
    const summary = document.getElementById("todaySummary");
    if (!summary) return;
    const open = Store.openTasks();
    const overdue = open.filter(x => x.due && dayDiff(ts, x.due) > 0);
    const studyMin = Store.studyMinutes(ts);
    const parts = [`待完成 ${open.length} 项`];
    if (overdue.length) parts.push(`逾期 ${overdue.length} 项`);
    parts.push(`今日已学习 ${fmtMin(studyMin)}`);
    summary.textContent = parts.join(" · ");
  },

  /* 4.1 顶部：问候 + 倒计时 + 进度 */
  heroSection(greet, t) {
    const box = UI.h("div", { class: "hero-top" });
    // 问候 + 进度
    const hello = UI.h("div", { class: "card hello" },
      UI.h("div", { class: "greet" }, `${greet}，孟想`),
      UI.h("div", { class: "big" }, `${t.getMonth() + 1} 月 ${t.getDate()} 日 · ${WEEK_CN[t.getDay()]}`),
      UI.h("div", { class: "sub", id: "todaySummary" })
    );
    // 倒计时
    const s = Store.state.settings;
    let cd;
    if (!s.examDate) {
      cd = UI.h("div", { class: "card countdown" },
        UI.h("div", { class: "meta" },
          UI.h("div", { class: "t" }, "考研倒计时未设置"),
          UI.h("div", { class: "d" }, "在「设置」中填写考试名称和日期"),
          UI.h("button", { class: "btn small primary", type: "button", style: "margin-top:10px", onclick: () => App.switchView("settings") }, "去设置"))
      );
    } else {
      const diff = dayDiff(todayStr(), s.examDate);
      const start = new Date(s.examDate); start.setMonth(start.getMonth() - 4);
      const total = Math.max(1, dayDiff(dstr(start), s.examDate));
      const pct = diff > 0 ? Math.min(100, Math.max(2, Math.round((total - diff) / total * 100))) : 100;
      cd = UI.h("div", { class: "card countdown" },
        UI.h("div", { class: "num" }, String(Math.max(0, diff)), UI.h("small", {}, "天")),
        UI.h("div", { class: "meta" },
          UI.h("div", { class: "t" }, s.examName || "考试"),
          UI.h("div", { class: "d" }, s.examDate.replace(/-/g, "/") + (diff > 0 ? ` · 约 ${Math.floor(diff / 7)} 周` : "")),
          UI.h("div", { class: "track" }, UI.h("div", { class: "fill", style: `width:${pct}%` })),
          UI.h("div", { class: "d", style: "margin-top:5px" }, `备考进程 ${pct}%`))
      );
    }
    box.append(hello, cd);
    return box;
  },

  /* 4.2 今日重点 */
  focusSection(ts) {
    const open = Store.openTasks();
    const dueToday = open.filter(x => x.due && dayDiff(ts, x.due) <= 0);
    const overdue = open.filter(x => x.due && dayDiff(ts, x.due) > 0);
    const pri = { high: 0, normal: 1, low: 2 };
    const focus = open.slice().sort((a, b) => {
      const ao = a.due && dayDiff(ts, a.due) > 0 ? 1 : 0, bo = b.due && dayDiff(ts, b.due) > 0 ? 1 : 0;
      if (ao !== bo) return ao - bo;
      if (a.due !== b.due) return a.due ? (b.due ? (a.due < b.due ? -1 : 1) : -1) : 1;
      return pri[a.priority] - pri[b.priority];
    }).slice(0, 3);

    const doneToday = Store.state.tasks.filter(x => x.done && x.doneAt && dstr(new Date(x.doneAt)) === ts).length;
    const totalToday = doneToday + dueToday.length;
    const rate = totalToday ? Math.round(doneToday / totalToday * 100) : 0;

    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar" }), "今日重点",
        UI.h("span", { class: "extra" }, `今日已完成 ${doneToday}/${totalToday} · ${rate}%`))
    );

    // 完成率环 + 重点任务
    const grid = UI.h("div", { class: "grid2-13" });
    const ringBox = UI.h("div", { class: "chart-box", style: "display:flex;flex-direction:column;align-items:center;gap:8px" },
      Charts.ring(rate, { label: "今日完成率" }),
      UI.h("div", { style: "font-size:12px;color:var(--ink-3);text-align:center;line-height:1.7" },
        `待完成 ${dueToday.length} 项`, UI.h("br"),
        overdue.length ? `逾期 ${overdue.length} 项` : "无逾期任务")
    );
    const listBox = UI.h("div");
    if (focus.length) {
      focus.forEach(task => listBox.append(TasksView.taskRow(task, { compact: true })));
    } else {
      listBox.append(UI.empty("今日无待办任务", "去「任务」页添加，或享受一个自由安排的晚上", UI.h("button", { class: "btn small", type: "button", onclick: () => App.switchView("tasks") }, "去添加任务")));
    }
    grid.append(listBox, ringBox);
    card.append(grid);
    return card;
  },

  /* 4.3 今日时间轴 */
  timelineSection(ts) {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "今日时间轴",
        UI.h("span", { class: "extra" },
          UI.h("button", { class: "btn small", type: "button", onclick: () => App.switchView("schedule") }, "完整日程 →")))
    );
    const wrap = UI.h("div", { id: "todayTimeline", class: "timeline" });
    card.append(wrap);
    return card;
  },

  renderTimelineInto(root, ts) {
    const wrap = root.querySelector("#todayTimeline");
    if (!wrap) return;
    const blocks = Store.blocksOf(ts);
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    wrap.innerHTML = "";
    if (!blocks.length) {
      wrap.append(UI.empty("今天还没有安排时间块", "在「日程」里添加课程、学习或健身时间块", UI.h("button", { class: "btn small", type: "button", onclick: () => App.switchView("schedule") }, "去安排")));
      return;
    }
    // 当前时间线
    const first = blocks[0];
    if (nowMin > toMin(first.start)) {
      wrap.append(UI.h("div", { class: "tl-nowline" }, UI.h("span", {}, `${pad(Math.floor(nowMin / 60))}:${pad(nowMin % 60)} 现在`)));
    }
    blocks.forEach(b => {
      const startM = toMin(b.start), endM = toMin(b.end);
      const done = b.done;
      const now = nowMin >= startM && nowMin < endM;
      const missed = !done && endM < nowMin;
      const item = UI.h("div", { class: `tl-item ${done ? "done" : now ? "now" : missed ? "missed" : ""}` },
        UI.h("span", { class: "time" }, b.start),
        UI.h("span", { class: "dot" }),
        UI.h("div", { class: "body" },
          UI.h("div", { class: "title" },
            done ? UI.h("s", {}, b.title) : UI.h("span", {}, b.title),
            UI.h("span", { class: `tag tag-type-${b.type}` }, BLOCK_TYPE_LABEL(b.type))),
          UI.h("div", { class: "sub" }, `${b.start}–${b.end}${b.taskId ? " · 关联任务" : ""}`)),
        UI.h("div", { class: "ops" },
          !done ? UI.h("button", { class: "mini-btn", type: "button", title: "标记完成", "aria-label": "标记完成", onclick: () => { b.done = true; Store.touch(b); Store.save(); TodayView.render(); UI.toast("已完成"); } },
            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round" }, UI.h("polyline", { points: "20 6 9 17 4 12" }))) : null,
          UI.h("button", { class: "mini-btn", type: "button", title: "编辑", "aria-label": "编辑时间块", onclick: () => ScheduleView.editBlock(b) },
            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"}))))
      );
      wrap.append(item);
    });
  },

  /* 4.4 核心数据概览 */
  statsSection(ts) {
    const [w0, w1] = weekRange();
    const weekStudy = Store.studyMinutesBetween(w0, w1);
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    const w = Store.weightOf(ts);
    const avg7 = Store.weight7Avg(ts);
    const weekDone = Store.state.tasks.filter(x => x.done && x.doneAt && dstr(new Date(x.doneAt)) >= w0 && dstr(new Date(x.doneAt)) <= w1).length;

    const goStudy = () => App.switchView("study");
    const goFit = () => App.switchView("fitness");
    const goReview = () => App.switchView("review");

    return UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "核心数据"),
      UI.h("div", { class: "stat-row" },
        UI.stat({ value: fmtMin(Store.studyMinutes(ts)), label: "今日学习", onClick: goStudy, sub: `本周 ${(weekStudy / 60).toFixed(1)} 小时` }),
        UI.stat({ value: `${doneRateWeek()}%`, label: "本周任务完成率", color: "green", sub: `完成 ${weekDone} 项` }),
        UI.stat({ value: w === null ? "—" : `${w} kg`, label: "当前体重", color: "coral", sub: avg7 === null ? "暂无 7 日均值" : `7 日均值 ${avg7} kg`, onClick: goFit }),
        UI.stat({ value: `${weekFit} 次`, label: "本周训练", color: "violet", sub: `计划 ${Store.state.settings.training.planDays.length} 次/周`, onClick: goFit }),
        UI.stat({ value: Store.reviewOf(ts) ? "已写" : "未写", label: "今日复盘", color: Store.reviewOf(ts) ? "green" : "amber", onClick: goReview })
      ),
      UI.h("div", { class: "chart-note" }, "以上数字均来自你的真实记录：学习时长来自计时与手动记录，训练次数来自打卡，体重来自每日录入。")
    );
  }
};

function toMin(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function doneRateWeek() {
  const [w0, w1] = weekRange();
  const all = Store.state.tasks.filter(t => !t.deleted && t.createdAt && dstr(new Date(t.createdAt)) >= w0 && dstr(new Date(t.createdAt)) <= w1);
  if (!all.length) return 0;
  const done = all.filter(t => t.done && t.doneAt && dstr(new Date(t.doneAt)) >= w0 && dstr(new Date(t.doneAt)) <= w1).length;
  return Math.round(done / all.length * 100);
}
