        UI.field("目标体重（kg）", wg, "增重/减重目标，用于对照趋势"),
        UI.field("每日热量目标（kcal）", dg, "0 表示不设置"))
    );
  },

  /* ---- 云同步 ---- */
  cloudCard() {
    const cfg = SupabaseConfig.get();
    const session = SupabaseConfig.getSession();
    const configured = !!(cfg && cfg.url && cfg.key);
    const loggedIn = configured && !!session;

    const card = UI.h("div", { class: "card", id: "cloudCard" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "云同步",
        UI.h("span", { class: "extra", id: "cloudStatus" }, configured ? (loggedIn ? "已配置 · 已登录" : "已配置 · 未登录") : "未配置"))
    );

    // 配置区
    const urlInp = UI.input({ value: cfg ? cfg.url : "", placeholder: "https://xxxx.supabase.co" });
    const keyInp = UI.input({ type: "password", value: cfg ? cfg.key : "", placeholder: "sb_publishable_..." });
    const showBtn = UI.h("button", { class: "btn small", type: "button", title: "显示/隐藏密钥" }, "显示");
    let shown = false;
    showBtn.addEventListener("click", () => { shown = !shown; keyInp.type = shown ? "text" : "password"; showBtn.textContent = shown ? "隐藏" : "显示"; });
    const saveCfg = async () => {
      const url = urlInp.value.trim().replace(/\/+$/, ""), key = keyInp.value.trim();
      if (!url || !key) { UI.toast("请填写完整的地址和密钥"); return; }
      if (!/^https:\/\/[^\s]+\.supabase\.co$/.test(url) && !/^https:\/\/[^\s]+\.supabase\.in$/.test(url)) {
        UI.toast("地址格式不正确，应为 https://<项目>.supabase.co"); return;
      }
      SupabaseConfig.save({ url, key });
      Sync.adapter = new SupabaseAdapter({ url, key });
      Sync.restoreSession();
      UI.toast("配置已保存，正在恢复会话…");
      setTimeout(() => SettingsView.render(), 1500);
    };
    card.append(
      UI.h("div", { class: "field" }, UI.h("label", { class: "field-label" }, "Supabase 项目地址"), urlInp),
      UI.h("div", { class: "field" }, UI.h("label", { class: "field-label" }, "Publishable Key（前端公开客户端密钥）"),
        UI.h("div", { class: "row" }, UI.h("div", { class: "grow" }, keyInp), showBtn),
        UI.h("div", { class: "field-hint" }, "在 Supabase 控制台 Settings → API 获取。该密钥设计上前端可公开，数据隔离由数据库行级安全（RLS）保证；请勿使用 service_role key。")),
      UI.h("div", { class: "row", style: "margin-bottom:6px" },
        UI.h("button", { class: "btn primary", type: "button", onclick: saveCfg }, "保存并连接"),
        UI.h("button", { class: "btn", type: "button", onclick: async (e) => {
          const box = document.getElementById("cloudDiag");
          box.innerHTML = "";
          box.append(UI.h("div", { class: "field-hint" }, "正在诊断连接…（最多约 25 秒）"));
          e.target.disabled = true;
          const r = await Sync.diagnose();
          e.target.disabled = false;
          box.innerHTML = "";
          if (!r.configured) {
            box.append(UI.h("div", { class: "diag-row" }, UI.h("span", { class: "diag-dot bad" }), UI.h("span", {}, "请先填写地址和密钥并保存")));
            return;
          }
          r.steps.forEach(s => box.append(UI.h("div", { class: "diag-row" },
            UI.h("span", { class: "diag-dot " + (s.ok ? "ok" : "bad") }),
            UI.h("b", {}, s.name + "："),
            UI.h("span", {}, s.msg))));
          if (!r.steps[0].ok) {
            box.append(UI.h("div", { class: "field-hint" },
              "排查顺序：① 打开 supabase.com/dashboard 看项目是否显示 Paused（免费版 7 天无活动会自动暂停），是则点 Restore；② 确认地址复制无误（应形如 https://xxxx.supabase.co）。"));
          }
        } }, "诊断连接"),
        configured ? UI.h("button", { class: "btn danger", type: "button", onclick: async () => {
          const ok = await UI.confirmDanger("清除云同步配置", "将退出登录并清除本机保存的 Supabase 配置。云端数据不会被删除。确定吗？", "清除配置");
          if (!ok) return;
          if (Sync.adapter) await Sync.adapter.signOut().catch(() => {});
          SupabaseConfig.clear();
          SupabaseConfig.saveSession(null);
          Sync.adapter = null;
          Sync.setStatus("local");
          SettingsView.render();
          UI.toast("配置已清除");
        } }, "清除配置") : null)
    );
    card.append(UI.h("div", { id: "cloudDiag", style: "margin-top:4px" }));

    if (!configured) {
      card.append(UI.h("div", { class: "field-hint" },
        "配置后可在电脑与手机之间同步任务、学习、训练、体重、日程和复盘。首次登录时，本地已有数据会自动合并上传，不会被空云端覆盖。详细部署步骤见仓库 docs/SUPABASE_SETUP.md。"));
      return card;
    }

    // 账号区
    if (!loggedIn) {
      const email = UI.input({ type: "email", placeholder: "你的邮箱" });
      const pwd = UI.input({ type: "password", placeholder: "密码（至少 6 位）" });
      const doLogin = async () => {
        if (!email.value.trim() || !pwd.value) { UI.toast("填写邮箱和密码"); return; }
        try { await Sync.signIn(email.value.trim(), pwd.value); UI.toast("登录成功，数据已同步"); SettingsView.render(); }
        catch (e) {
          // 已登录但同步失败（表未建/网络）：显示真实原因，并切到已登录状态
          UI.toast((e.loggedIn ? "登录成功，但" : "登录失败：") + Sync.friendlyError(e), 6000);
          if (e.loggedIn) setTimeout(() => SettingsView.render(), 400);
        }
      };
      const doSignUp = async () => {
        if (!email.value.trim() || !pwd.value) { UI.toast("填写邮箱和密码"); return; }
        if (pwd.value.length < 6) { UI.toast("密码至少 6 位"); return; }
        try {
          const d = await Sync.signUp(email.value.trim(), pwd.value);
          if (d && d.access_token) { UI.toast("注册成功，数据已同步"); SettingsView.render(); }
          else UI.toast("注册成功：请先到邮箱点确认邮件，再回来登录", 3500);
        } catch (e) { UI.toast("注册失败：" + Sync.friendlyError(e)); }
      };
      card.append(
        UI.h("div", { class: "dlg-sep" }),
        UI.h("div", { class: "field" }, UI.h("label", { class: "field-label" }, "邮箱"), email),
        UI.h("div", { class: "field" }, UI.h("label", { class: "field-label" }, "密码"), pwd),
        UI.h("div", { class: "row" },
          UI.h("button", { class: "btn primary", type: "button", onclick: doLogin }, "登录"),
          UI.h("button", { class: "btn", type: "button", onclick: doSignUp }, "注册新账号")),
        UI.h("div", { class: "field-hint" }, "注册需要邮箱确认（Supabase 默认开启）；确认后返回本页登录。账号数据仅保存在你自己的 Supabase 项目中。")
      );
    } else {
      const emailTxt = (session.email || SupabaseConfig.getSession() && SupabaseConfig.getSession().email || "已登录");
      card.append(
        UI.h("div", { class: "dlg-sep" }),
        UI.h("div", { class: "row", style: "margin-bottom:10px" },
          UI.h("span", { style: "font-size:13.5px;font-weight:700" }, `账号：${emailTxt}`)),
        UI.h("div", { class: "row" },
          UI.h("button", { class: "btn primary", type: "button", onclick: async () => {
            try {
              const remote = await Sync.adapter.pull();
              Store.state = mergeStates(Store.state, remote);
              Store.save();
              await Sync.adapter.push(Store.state);
              Sync.setStatus("synced");
              App.renderAll();
              UI.toast("已同步");
            } catch (e) { Sync.setStatus("error", e.message); UI.toast("同步失败：" + Sync.friendlyError(e)); }
          } }, "立即同步"),
          UI.h("button", { class: "btn", type: "button", onclick: async () => {
            await Sync.signOut(); SettingsView.render(); UI.toast("已退出登录");
          } }, "退出登录")),
        UI.h("div", { class: "field-hint" }, "本地改动会在停止操作约 1 秒后自动上传；顶栏芯片显示实时同步状态。")
      );
    }
    return card;
  },

  editWeightGoal() { App.switchView("settings"); setTimeout(() => document.getElementById("view-settings").scrollIntoView({ behavior: "smooth" }), 60); },
  editDietGoal() { App.switchView("settings"); setTimeout(() => document.getElementById("view-settings").scrollIntoView({ behavior: "smooth" }), 60); },

    );
  },

  dataCard() {

    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "数据"),
      UI.h("div", { class: "stack" },
        UI.h("div", { class: "row" },
          UI.h("button", { class: "btn", type: "button", onclick: () => App.exportData() }, "导出备份（JSON）"),
          UI.h("button", { class: "btn", type: "button", onclick: () => document.getElementById("fileImport").click() }, "导入备份"),
          hasV1 ? UI.h("button", { class: "btn", type: "button", onclick: () => this.restoreV1() }, "恢复 v1 旧数据") : null),
        UI.h("div", { class: "field-hint" },
          "数据保存在本机浏览器 localStorage。建议定期导出备份；换设备时先导出、再在新设备导入。", UI.h("br"),
          `云同步状态：${SupabaseConfig.get() ? (SupabaseConfig.getSession() ? "已配置并登录" : "已配置，未登录") : "未配置"}。详细步骤见仓库 docs/SUPABASE_SETUP.md。`),
        UI.h("button", { class: "btn danger", type: "button", onclick: () => this.clearAll() }, "清空所有数据"))
    );
    return card;
  },

  async restoreV1() {
    const ok = await UI.confirmDanger("恢复 v1 旧数据",
      "将用首次升级时自动备份的 v1 数据覆盖当前全部数据（任务、健身、体重、语录；学习和日程等 v2 功能数据不受影响但会被合并）。确定继续吗？", "确认恢复");
    if (!ok) return;
    try {
      const raw = JSON.parse(localStorage.getItem(DB_V1_BACKUP_KEY) || "null");
      if (!raw) { UI.toast("没有找到 v1 备份"); return; }
      const v1 = migrateV1(raw);
      // 以 v1 数据为主，保留 v2 学习事项中不冲突的记录（v2 的 study 是对象结构）
      const keepIds = new Set(v1.tasks.map(t => t.id));
      v1.study.items = Store.state.study.items.filter(it => !keepIds.has(it.taskId)).concat(v1.study.items);
      v1.study.days = Store.state.study.days || {};
      v1.study.updatedAt = Date.now();
      v1.blocks = Store.state.blocks.filter(b => !v1.tasks.some(t => t.id === b.taskId));
      v1.quotes = Store.state.quotes;
      Store.state = v1;
      Store.save();
      App.renderAll();
      UI.toast("v1 数据已恢复");
    } catch (e) {
      UI.toast("恢复失败：" + e.message);
    }
  },

  async clearAll() {
    const ok = await UI.confirmDanger("清空所有数据",
      "将删除全部任务、学习记录、训练记录、体重、饮食、日程和复盘数据，且不可恢复。强烈建议先「导出备份」。确定清空吗？", "全部清空");
    if (!ok) return;
    const ok2 = await UI.confirmDanger("再确认一次", "这是最后一次确认。清空后只能通过之前的备份文件恢复。", "确认清空");
    if (!ok2) return;
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(TIMER_KEY);
    Store.state = defaultState();
    Store.save();
    App.renderAll();
    UI.toast("已清空");
  }
};


/* ================= src/js/app.js ================= */
/* ================= 应用入口 ================= */
"use strict";

const App = {
  curView: "today",

  init() {
    Store.load();
    Theme.init();
    Sync.init();
    Timer.restore();
    this.initLiquidGlass();
    this.bindNav();
    this.bindTopbar();
    this.initScrollFx();
    this.renderAll();
    this.hideSplash();
    // 窗口尺寸变化时重定位 pill
    window.addEventListener("resize", () => this.moveNavPill());
  },

  /* 启动动画：应用就绪后淡出（最短展示 600ms，避免一闪而过） */
  hideSplash() {
    const sp = document.getElementById("splash");
    if (!sp) return;
    const elapsed = performance.now();
    const wait = Math.max(0, 600 - elapsed);
    setTimeout(() => {
      sp.classList.add("hide");
      setTimeout(() => sp.remove(), 600);
    }, wait);
  },

  bindNav() {
    document.getElementById("nav").addEventListener("click", e => {
      const btn = e.target.closest(".nav-item");
      if (!btn) return;
      this.switchView(btn.dataset.view);
    });
  },

  bindTopbar() {
    document.getElementById("btnTheme").addEventListener("click", () => { Theme.toggle(); this.syncThemeIcon(); });
    document.getElementById("btnExport").addEventListener("click", () => this.exportData());
    document.getElementById("btnSettings").addEventListener("click", () => this.switchView("settings"));
    document.getElementById("syncChip").addEventListener("click", () => {
      if (!Sync.adapter) { App.switchView("settings"); setTimeout(() => document.getElementById("cloudCard").scrollIntoView({ behavior: "smooth" }), 80); return; }
      if (Sync.status === "loggedout") { App.switchView("settings"); setTimeout(() => document.getElementById("cloudCard").scrollIntoView({ behavior: "smooth" }), 80); return; }
      Sync.retry();
    });
    this.syncThemeIcon();
  },

  syncThemeIcon() {
    const btn = document.getElementById("btnTheme");
    const dark = Theme.current() === "dark";
    btn.innerHTML = dark
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
    btn.title = dark ? "切换到浅色" : "切换到深色";
  },

  switchView(v) {
    this.curView = v;
    ["today", "tasks", "study", "fitness", "settings"].forEach(x => {
      const el = document.getElementById("view-" + x);
      if (!el) return;
      el.classList.toggle("show", x === v);
      el.hidden = x !== v;
    });
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === v));
    this.moveNavPill();
    window.scrollTo({ top: 0, behavior: "instant" });
    if (v === "today") TodayView.render();
    if (v === "tasks") { TasksView.render(); }
    if (v === "study") StudyView.render();
    if (v === "fitness") FitnessView.render();
    if (v === "settings") SettingsView.render();
  },

  /* Liquid Glass 导航：滑动 pill 跟随激活项 */
  moveNavPill() {
    const pill = document.getElementById("navPill");
    const active = document.querySelector(".nav-item.active");
    if (!pill) return;
    if (!active) { pill.style.opacity = "0"; return; }  // 设置页等无导航项时隐藏 pill
    const r = active.getBoundingClientRect();
    const nr = active.parentElement.getBoundingClientRect();
    pill.style.width = r.width + "px";
    pill.style.opacity = "1";
    pill.style.transform = `translateX(${r.left - nr.left}px)`;
  },

  /* 生成 SVG 折射滤镜（feImage 位移贴图 + feDisplacementMap），参考 archisvaze/liquid-glass
   * 仅 Chrome 生效（@supports 检测），Firefox/Safari 自动降级为 CSS blur */
  initLiquidGlass() {
    const defs = document.getElementById("lg-defs");
    if (!defs) return;
    try {
      const W = 440, H = 84, R = 26;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          // 越靠近左右边缘与圆角，位移越大（模拟玻璃边缘厚度折射）
          const dx = Math.min(x + 1, W - x);
          const dy = Math.min(y + 1, H - y);
          const edgeX = Math.min(1, dx / (R * 1.7));
          const edgeY = Math.min(1, dy / (R * 1.0));
          const edge = Math.min(edgeX, edgeY);
          const s = Math.pow(1 - edge, 1.6);
          const i = (y * W + x) * 4;
          img.data[i] = 128 + s * 100;      // R 通道 → 水平位移
          img.data[i + 1] = 128 + s * 26;   // G 通道 → 垂直微位移
          img.data[i + 2] = 128;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const url = c.toDataURL();
      defs.innerHTML = `<filter id="lg-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
        <feImage href="${url}" x="0" y="0" width="100%" height="100%" result="dm" preserveAspectRatio="none"/>
        <feDisplacementMap in="b" in2="dm" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feColorMatrix in="d" type="saturate" values="1.55"/>
      </filter>`;
    } catch (e) { /* 降级：无滤镜时 CSS blur 仍生效 */ }
  },

  renderAll() {
    const line = document.getElementById("dateLine");
    if (line) line.textContent = `${today().getFullYear()} 年 ${today().getMonth() + 1} 月 ${today().getDate()} 日 · ${WEEK_CN[today().getDay()]}`;
    this.switchView(this.curView);
    Sync.renderChip();
  },

  /* ---- 导入 / 导出 ---- */
  exportData() {
    const blob = new Blob([JSON.stringify({ ...Store.state, exportAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `LifeOS备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    UI.toast("备份文件已下载");
  },

  bindImport() {
    document.getElementById("fileImport").addEventListener("change", async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        const data = JSON.parse(text);
        if (!data || typeof data !== "object" || !Array.isArray(data.tasks)) throw new Error("缺少 tasks 字段");
        const ok = await UI.confirmDanger("导入备份", "导入将合并/覆盖当前数据（同 ID 记录以较新者为准）。建议先导出当前数据作为备份。继续吗？", "确认导入");
        if (!ok) { e.target.value = ""; return; }
        const merged = mergeStates(Store.state, data);
        Store.state = merged;
        Store.save();
        this.renderAll();
        UI.toast("导入成功");
      } catch (err) {
        UI.toast("导入失败：文件格式不正确（" + err.message + "）");
      }
      e.target.value = "";
    });
  },


  initScrollFx() {
    const bar = document.getElementById("scrollProgress");
    const tb = document.getElementById("topbar");
    window.addEventListener("scroll", () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? window.scrollY / h * 100 : 0) + "%";
      tb.classList.toggle("stuck", window.scrollY > 8);
    }, { passive: true });
  }
};

/* 设置视图容器（动态加入，避免模板过长） */
(function ensureSettingsView() {
  const sec = document.createElement("section");
  sec.className = "view";
  sec.id = "view-settings";
  sec.setAttribute("role", "tabpanel");
  sec.setAttribute("aria-label", "设置");
  sec.hidden = true;
  document.getElementById("main").append(sec);
})();

document.addEventListener("DOMContentLoaded", () => {
  App.bindImport();
  App.init();
});

</script>
