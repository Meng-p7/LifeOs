/* ================= SVG 图表库（零依赖） ================= */
"use strict";

const Charts = {
  svg(w, h, content, label) {
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", `0 0 ${w} ${h}`);
    s.setAttribute("role", "img");
    if (label) s.setAttribute("aria-label", label);
    s.style.width = "100%";
    s.style.height = "auto";
    s.style.display = "block";
    s.innerHTML = content;
    return s;
  },

  /* ---------- 折线图（体重/学习趋势） ---------- */
  line({ points, w = 620, h = 180, unit = "", color = "var(--blue)", label }) {
    // points: [{label, value}]
    if (!points || points.length < 2) return null;
    const PL = 40, PR = 14, PT = 16, PB = 26;
    const vals = points.map(p => p.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 0.001) { max = min + 0.5; min -= 0.5; }
    else { const pad = (max - min) * 0.14; max += pad; min -= pad; }
    const x = i => PL + (w - PL - PR) * (i / (points.length - 1));
    const y = v => PT + (h - PT - PB) * (1 - (v - min) / (max - min));
    const pts = points.map((p, i) => [x(i), y(p.value)]);
    const path = "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
    const area = path + ` L${x(points.length - 1).toFixed(1)},${h - PB} L${x(0).toFixed(1)},${h - PB} Z`;
    const gid = "lg-" + Math.random().toString(36).slice(2, 8);
    const dots = pts.map((p, i) =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? color : "var(--surface)"}" stroke="${color}" stroke-width="2.5"><title>${esc(points[i].label)}：${points[i].value}${unit}</title></circle>`).join("");
    const content = `
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${color}" stop-opacity=".22"/>
          <stop offset="1" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${PL}" y1="${h - PB}" x2="${w - PR}" y2="${h - PB}" stroke="var(--line)" stroke-width="1.5"/>
      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${h - PB}" stroke="var(--line)" stroke-width="1.5"/>
      <text class="chart-axis" x="${PL - 6}" y="${PT + 9}" text-anchor="end">${max.toFixed(1)}</text>
      <text class="chart-axis" x="${PL - 6}" y="${h - PB + 4}" text-anchor="end">${min.toFixed(1)}</text>
      <path d="${area}" fill="url(#${gid})" class="chart-area"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chart-line"/>
      ${dots}
      <text class="chart-axis" x="${PL}" y="${h - 6}">${esc(points[0].label)}</text>
      <text class="chart-axis" x="${w - PR}" y="${h - 6}" text-anchor="end">${esc(points[points.length - 1].label)}</text>`;
    return this.svg(w, h, content, label);
  },

  /* ---------- 柱状图（每日学习时长/任务完成） ---------- */
  bars({ items, w = 620, h = 190, unit = "", label, highlightLast = true }) {
    // items: [{label, value, tip}]
    if (!items || !items.length) return null;
    const PL = 8, PR = 8, PT = 18, PB = 28;
    const max = Math.max(1, ...items.map(i => i.value));
    const bw = (w - PL - PR) / items.length;
    const bars = items.map((it, i) => {
      const bh = Math.max(3, (h - PT - PB) * (it.value / max));
      const x = PL + i * bw + bw * 0.18;
      const y = h - PB - bh;
      const isToday = highlightLast && i === items.length - 1;
      const zero = it.value === 0;
      return `<g><rect class="bar${isToday ? " today" : ""}${zero ? " zero" : ""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="6"><title>${esc(it.tip || it.label)}：${it.value}${unit}</title></rect>
      <text class="chart-axis" x="${(x + bw * 0.32).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(it.label)}</text></g>`;
    }).join("");
    return this.svg(w, h, bars, label);
  },

  /* ---------- 横向条形（科目分布） ---------- */
  hbars({ items, label }) {
    // items: [{name, done, total, onClick}]
    if (!items || !items.length) return null;
    const rows = items.map(it => {
      const pct = it.total ? Math.round(it.done / it.total * 100) : 0;
      return `<div class="hbar-row" ${it.onClick ? 'data-click="1"' : ""}>
        <span class="hbar-name">${esc(it.name)}</span>
        <span class="hbar-track"><span class="hbar-fill" style="width:${pct}%"></span></span>
        <span class="hbar-n">${it.done}/${it.total}</span>
      </div>`;
    }).join("");
    const div = UI.h("div", { class: "hbars", role: "img", "aria-label": label || "科目分布" });
    div.innerHTML = rows;
    if (items.some(i => i.onClick)) {
      div.querySelectorAll(".hbar-row").forEach((row, i) => {
        if (items[i].onClick) row.addEventListener("click", items[i].onClick);
      });
    }
    return div;
  },

  /* ---------- 进度环 ---------- */
  ring(pct, { size = 120, stroke = 11, color = "var(--blue)", label }) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
    const content = `
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" class="chart-ring">
        <animate attributeName="stroke-dashoffset" from="${c.toFixed(1)}" to="${off.toFixed(1)}" dur="0.9s" fill="freeze"/>
      </circle>
      <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-text">${pct}%</text>
      ${label ? `<text x="50%" y="63%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-sub">${esc(label)}</text>` : ""}`;
    const el = this.svg(size, size, content, `完成率 ${pct}%`);
    el.style.width = size + "px";
    return el;
  },

  /* ---------- 环形图（当日学习时长占比） ---------- */
  donut({ segments, size = 190, thickness = 26, centerText = "", centerSub = "", label }) {
    // segments: [{name, value, color}]
    const total = segments.reduce((a, s) => a + (s.value || 0), 0);
    if (!total) return null;
    const r = (size - thickness) / 2, c = 2 * Math.PI * r, cx = size / 2, cy = size / 2;
    let acc = 0;
    const arcs = segments.map(s => {
      const frac = (s.value || 0) / total;
      const dash = Math.max(0, frac * c - 2.5);
      const rot = -90 + acc * 360;
      acc += frac;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thickness}"
        stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${cx} ${cy})"
        style="transition:stroke-dasharray .6s ease"><title>${esc(s.name)}：${s.value} 分钟（${Math.round(frac*100)}%）</title></circle>`;
    }).join("");
    const content = `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${thickness}"/>
      ${arcs}
      ${centerText ? `<text x="50%" y="46%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-text">${esc(centerText)}</text>` : ""}
      ${centerSub ? `<text x="50%" y="64%" text-anchor="middle" dominant-baseline="middle" class="chart-ring-sub">${esc(centerSub)}</text>` : ""}`;
    const el = this.svg(size, size, content, label || "当日学习时长占比");
    el.style.width = size + "px";
    el.style.maxWidth = "100%";
    return el;
  },

  /* ---------- 热力图 ---------- */
  heatmap({ weeks = 8, getState, getTitle, label }) {
    // getState(dateStr) => "" | "part" | "full" | "plan"
    const t = today(), dow = (t.getDay() + 6) % 7;
    const mon = new Date(t); mon.setDate(t.getDate() - dow - 7 * (weeks - 1));
    const cells = [];
    for (let wk = 0; wk < weeks; wk++) for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(d.getDate() + wk * 7 + i);
      const ds = dstr(d);
      const st = getState(ds);
      const cls = ["heat-cell"];
      if (st === "full") cls.push("full");
      else if (st === "part") cls.push("part");
      else if (st === "plan") cls.push("plan");
      if (ds === todayStr()) cls.push("now");
      cells.push(UI.h("div", { class: cls.join(" "), title: getTitle(ds), role: "img", "aria-label": getTitle(ds) }));
    }
    return UI.h("div", { class: "heat" }, cells);
  }
};


/* ================= src/js/sync.js ================= */
/* ================= 同步服务 =================
 * 状态机：local（本地模式，未配置云）→ 已登录 → syncing → synced / offline / error / pending
 * 设计原则：
 * - 无 Supabase 配置时永远是 local 状态，UI 如实显示「本地模式」，绝不假装同步成功；
 * - 所有记录带 id / updatedAt / deleted，为按记录合并做准备；
 * - 接入云端只需实现 CloudAdapter 接口并在 init 时注入（见 docs/SUPABASE_SETUP.md）。 */
"use strict";

const Sync = {
  status: "local",          // local | loggedout | offline | syncing | synced | error | pending
  adapter: null,            // SupabaseAdapter（配置并登录后注入）
  lastSyncAt: null,
  lastError: "",
  _dirty: false,

  STATUS_TEXT: {
    local:     { icon: "●", text: "本地模式", tip: "数据仅保存在本机浏览器。在「设置」中配置 Supabase 后可多设备同步（docs/SUPABASE_SETUP.md）" },
    loggedout: { icon: "○", text: "未登录", tip: "云同步已配置，登录后自动同步" },
    offline:   { icon: "○", text: "离线", tip: "网络不可用，更改已保存到本地，恢复联网后自动重试" },
    syncing:   { icon: "◌", text: "同步中", tip: "正在与云端同步…" },
    synced:    { icon: "✓", text: "已同步", tip: "所有更改已同步到云端" },
    error:     { icon: "!", text: "同步失败", tip: "同步出错，可点击重试；本地数据不受影响" },
    pending:   { icon: "↑", text: "待同步", tip: "有尚未同步的本地更改" }
  },

  init() {
    // URL 参数一次性注入配置（?sb_url=...&sb_key=...），注入后立即从地址栏清除
    SupabaseConfig.applyFromUrl();
    const cfg = SupabaseConfig.get();
    if (cfg && cfg.url && cfg.key) {
      this.adapter = new SupabaseAdapter(cfg);
      this.restoreSession();
    } else {
      this.setStatus("local");
    }
    if (!this.adapter) return;
    window.addEventListener("online", () => this.flush());
    window.addEventListener("offline", () => { if (this.adapter) this.setStatus("offline"); });
    if (navigator.onLine === false) this.setStatus("offline");
  },

  /* 页面加载时尝试恢复会话并同步 */
  async restoreSession() {
    this.setStatus("syncing");
    try {
      const user = await this.adapter.currentUser();
      if (!user) { this.setStatus("loggedout"); return; }
      await this.adapter.syncAfterLogin();
      this.setStatus("synced");
    } catch (e) {
      console.warn("[sync] restore failed:", e && e.message);
      this.setStatus("error", this.friendlyError(e));
    }
  },

  /* 登录（设置页调用）。注意：登录成功但同步失败（如表未建）时要区分提示 */
  async signIn(email, password) {
    if (!this.adapter) throw new Error("尚未配置云同步");
    this.setStatus("syncing");
    try {
      await this.adapter.signIn(email, password);
    } catch (e) {
      this.setStatus("error", this.friendlyError(e));
      throw e;
    }
    try {
      await this.adapter.syncAfterLogin();
      this.setStatus("synced");
      return true;
    } catch (e) {
      this.setStatus("error", this.friendlyError(e));
      const err = new Error(this.friendlyError(e));
      err.loggedIn = true;   // 已拿到会话，只是同步没成功
      throw err;
    }
  },

  /* 注册（设置页调用；开了邮箱确认时需先收邮件点确认再登录） */
  async signUp(email, password) {
    if (!this.adapter) throw new Error("尚未配置云同步");
    const data = await this.adapter.signUp(email, password);
    if (data && data.access_token) {
      await this.adapter.syncAfterLogin();
      this.setStatus("synced");
    }
    return data;
  },

  async signOut() {
    if (!this.adapter) return;
    await this.adapter.signOut();
    this.setStatus("loggedout");
    this._dirty = false;
  },

  setStatus(s, err) {
    this.status = s;
    if (err) this.lastError = err;
    this.renderChip();
  },

  /* 云端错误的人话提示 */
  friendlyError(e) {
    const msg = (e && e.message) || "";
    const code = e && e.code;
    if (code === "NETWORK" || /Failed to fetch|NetworkError|Load failed|无法连接服务器/.test(msg)) {
      return "无法连接 Supabase 服务器。最常见原因：免费项目 7 天无活动被自动暂停（暂停后域名失效）。请打开 supabase.com/dashboard 查看项目是否显示 Paused，点 Restore 恢复后重试。";
    }
    if (/连接超时/.test(msg)) {
      return "连接超时：服务器无响应，可能是项目已暂停或当前网络无法访问 Supabase。请检查项目状态后重试。";
    }
    if (code === "PGRST205" || /Could not find the table/.test(msg)) {
      return "登录成功，但云端数据表未创建：请在 Supabase 控制台 SQL Editor 执行 docs/SUPABASE_SETUP.md 第 3 节的迁移 SQL。";
    }
    if (/Invalid login credentials/.test(msg)) return "邮箱或密码不正确（若刚注册，请先确认邮箱里的验证邮件）。";
    if (/Email not confirmed/.test(msg)) return "邮箱尚未验证：请打开注册邮箱点击确认链接，再回来登录。";
    if (/User already registered/.test(msg)) return "这个邮箱已注册过，直接点「登录」即可。";
    return msg || "未知错误";
  },

  /* 连接诊断：逐步检查服务器、登录状态、数据表 */
  async diagnose() {
    const cfg = SupabaseConfig.get();
    const out = { configured: !!(cfg && cfg.url && cfg.key), url: cfg ? cfg.url : "", steps: [] };
    if (!out.configured) {
      out.steps.push({ name: "配置", ok: false, msg: "尚未填写 Supabase 地址和密钥" });
      return out;
    }
    const probe = new SupabaseAdapter({ url: cfg.url, key: cfg.key });
    // 1. 服务器连通（不需要登录）
    let t0 = performance.now();
    try {
      await probe.req("/auth/v1/settings");
      out.steps.push({ name: "服务器连通", ok: true, msg: `响应 ${Math.round(performance.now() - t0)} ms` });
    } catch (e) {
      out.steps.push({
        name: "服务器连通", ok: false,
        msg: "无法访问该地址：域名解析失败或项目已暂停。请打开 supabase.com/dashboard 检查项目状态（Paused → Restore）。"
      });
      return out;
    }
    // 2. 登录状态
    let user = null;
    try { user = await probe.currentUser(); } catch (e) { user = null; }
    out.steps.push({ name: "登录状态", ok: !!user, msg: user ? `已登录：${user.email}` : "未登录（需在下方输入邮箱密码）" });
    if (!user) return out;
    // 3. 数据表
    try {
      await probe.req("/rest/v1/tasks?select=id&limit=1", { auth: true });
      out.steps.push({ name: "数据表", ok: true, msg: "云端表可读写" });
    } catch (e) {
      out.steps.push({
        name: "数据表", ok: false,
        msg: e.code === "PGRST205" ? "云端表未创建，请执行迁移 SQL（docs/SUPABASE_SETUP.md 第 3 节）" : this.friendlyError(e)
      });
    }
    return out;
  },

  /* 本地发生更改：有 adapter 时标记待同步并触发 flush；无 adapter 时仅记录 */
  markLocalChange() {
    if (!this.adapter) return;
    this._dirty = true;
    if (this.status === "synced") this.setStatus("pending");
    this.scheduleFlush();
  },

  _flushTimer: null,
  scheduleFlush() {
    clearTimeout(this._flushTimer);
    this._flushTimer = setTimeout(() => this.flush(), 1200);
  },

  async flush() {
    if (!this.adapter || !this._dirty) return;
    if (navigator.onLine === false) { this.setStatus("offline"); return; }
    this.setStatus("syncing");
    try {
      await this.adapter.push(Store.state);
      this._dirty = false;
      this.lastSyncAt = Date.now();
      this.setStatus("synced");
    } catch (e) {
      console.warn("[sync] push failed:", e && e.message);
      this.setStatus("error", this.friendlyError(e));
    }
  },

  async pull() {
    if (!this.adapter) return;
    this.setStatus("syncing");
    try {
      const remote = await this.adapter.pull();
      const merged = mergeStates(Store.state, remote);
      Store.state = merged;
      Store.save();
      this._dirty = false;
      this.setStatus("synced");
    } catch (e) {
      console.warn("[sync] pull failed:", e && e.message);
      this.setStatus("error", e && e.message);
    }
  },

  async retry() {
    if (!this.adapter) { UI.toast("尚未配置云同步：在「设置」中填写 Supabase 地址和密钥"); return; }
    let user = null;
    try { user = await this.adapter.currentUser(); } catch (e) { user = null; }
    if (!user) { this.setStatus("loggedout"); UI.toast("登录状态已失效，请在设置中重新登录"); return; }
    await this.flush();
    if (this.status === "error") UI.toast("同步失败：" + this.friendlyError({ message: this.lastError }) + "，可再次点击重试");
  },

  renderChip() {
    const chip = document.getElementById("syncChip");
    if (!chip) return;
    const s = this.STATUS_TEXT[this.status] || this.STATUS_TEXT.local;
    chip.innerHTML = `<span class="sync-icon ${this.status}" aria-hidden="true">${s.icon}</span><span class="sync-text">${s.text}</span>`;
    chip.title = s.tip;
    chip.setAttribute("aria-label", "数据同步状态：" + s.text);
  }
};

/* ---------- 记录级合并（为跨设备同步准备） ----------
 * 策略：按集合逐条比较 updatedAt，较新者胜；软删除记录保留墓碑，避免已删除项被同步回来；
 * 无 updatedAt 的旧记录视为本地较新。 */
function mergeStates(local, remote) {
  if (!remote || typeof remote !== "object") return local;
  const pick = (a, b) => (b && (b.updatedAt || 0) >= (a && a.updatedAt || 0)) ? b : a;
  const mergeArr = (A = [], B = []) => {
    const map = new Map();
    A.concat(B).forEach(r => {
      if (!r || !r.id) return;
      const ex = map.get(r.id);
      map.set(r.id, ex ? pick(ex, r) : r);
    });
    return Array.from(map.values());
  };
  const mergeDict = (A = {}, B = {}) => {
    const out = { ...A };
    Object.keys(B).forEach(k => {
      const a = out[k], b = B[k];
      if (a && b && typeof a === "object" && !Array.isArray(a)) out[k] = { ...a, ...b, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
      else out[k] = b;
    });
    return out;
  };
  return {
    v: 2,
    settings: { ...local.settings, ...remote.settings, training: { ...local.settings.training, ...(remote.settings && remote.settings.training || {}) } },
    tasks: mergeArr(local.tasks, remote.tasks),
    study: normalizeStudy((remote.study && (remote.study.updatedAt || 0) >= (local.study && local.study.updatedAt || 0)) ? remote.study : local.study),
    blocks: mergeArr(local.blocks, remote.blocks),
    fitness: mergeDict(local.fitness, remote.fitness),
    weight: mergeDict(local.weight, remote.weight),
    diet: mergeDict(local.diet, remote.diet),
    reviews: mergeDict(local.reviews, remote.reviews),
    quotes: local.quotes
  };
}

/* ---------- CloudAdapter 接口约定（实现类需提供） ----------
 * class SupabaseAdapter {
 *   constructor({ url, anonKey }) { ... }
 *   async signUp / signIn / signOut / currentUser()
 *   async push(state)   // 上传本地更改（可实现为按表 upsert）
 *   async pull()        // 拉取远端全量，返回与本地同构的 state
 * }
 * 密钥只允许来自服务端环境变量或部署平台的环境变量注入，禁止写进前端源码。 */


/* ================= src/js/supabase-adapter.js ================= */
/* ================= Supabase 云同步适配器 =================
 * 零依赖实现 CloudAdapter 接口（src/js/sync.js 末尾的约定）：
 *   - 认证：/auth/v1（邮箱密码，会话持久化，access_token 自动刷新）
 *   - 数据：/rest/v1（按表 upsert / select，RLS 保证用户隔离）
 * 凭据来源（按优先级）：URL 参数一次性注入 > localStorage 配置（App 内表单填写）。
 * publishable key 是设计上前端可用的公开客户端密钥，数据隔离由 RLS 强制；
 * service_role key 严禁出现在任何前端代码中。 */
"use strict";

const SupabaseConfig = {
  KEY: "lifeos.supabase.config",      // {url, key}
  SESSION_KEY: "lifeos.supabase.session", // {access_token, refresh_token, expires_at, email}

  get() {
    try { return JSON.parse(localStorage.getItem(this.KEY) || "null"); } catch (e) { return null; }
  },
  save(cfg) { localStorage.setItem(this.KEY, JSON.stringify(cfg)); },
  clear() { localStorage.removeItem(this.KEY); },

  /* URL 参数一次性注入：?sb_url=...&sb_key=... （注入后从地址栏清除，避免留在历史记录） */
  applyFromUrl() {
    try {
      const p = new URLSearchParams(location.search);
      const url = p.get("sb_url"), key = p.get("sb_key");
      if (url && key) {
        this.save({ url: url.replace(/\/+$/, ""), key });
        history.replaceState(null, "", location.pathname + location.hash);
        return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  },

  getSession() {
    try { return JSON.parse(localStorage.getItem(this.SESSION_KEY) || "null"); } catch (e) { return null; }
  },
  saveSession(s) {
    if (s) localStorage.setItem(this.SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(this.SESSION_KEY);
  }
};

class SupabaseAdapter {
  constructor({ url, key }) {
    this.url = url.replace(/\/+$/, "");
    this.key = key;
    this.user = null;   // {id, email}
  }

  /* ---------- 内部：请求（带 12 秒超时 + 网络失败自动重试 1 次） ---------- */
  async req(path, opts = {}) {
    return this._req(path, opts, 0);
  }

  async _req(path, { method = "GET", body, auth = false, headers = {} } = {}, attempt) {
    const h = { "apikey": this.key, "Content-Type": "application/json", ...headers };
    if (auth) {
      const token = await this.validToken();
      h["Authorization"] = "Bearer " + token;
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    let res;
    try {
      res = await fetch(this.url + path, {
        method, headers: h,
        body: body ? JSON.stringify(body) : undefined,
        signal: ctrl.signal
      });
    } catch (e) {
      // 网络层失败：超时 / DNS 解析失败 / 连接被拒
      if (attempt < 1) {
        await new Promise(r => setTimeout(r, 900));
        return this._req(path, { method, body, auth, headers }, attempt + 1);
      }
      const err = new Error(e.name === "AbortError" ? "连接超时（12 秒）" : "无法连接服务器");
      err.code = "NETWORK";
      throw err;
    } finally {
      clearTimeout(timer);
    }
    if (res.status === 401 && auth) {
      // token 可能失效：尝试刷新一次再重试
      await this.refresh(true);
      const t2 = await this.validToken();
      const res2 = await fetch(this.url + path, { method, headers: { ...h, Authorization: "Bearer " + t2 }, body: body ? JSON.stringify(body) : undefined });
      return this.parse(res2);
    }
    return this.parse(res);
  }

  async parse(res) {
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!res.ok) {
      const msg = (data && data.message) || (data && data.msg) || (data && data.error_description) || ("HTTP " + res.status);
      const err = new Error(msg);
      err.code = (data && data.code) || String(res.status);
      throw err;
    }
    return data;
  }

  /* ---------- 认证 ---------- */
  async validToken() {
    const s = SupabaseConfig.getSession();
    if (!s) throw new Error("未登录");
    if (s.expires_at && s.expires_at < Date.now() / 1000 + 60) await this.refresh();
    const s2 = SupabaseConfig.getSession();
    return s2.access_token;
  }

  async refresh(force = false) {
    const s = SupabaseConfig.getSession();
    if (!s || !s.refresh_token) throw new Error("会话已过期，请重新登录");
    if (!force && s.expires_at && s.expires_at >= Date.now() / 1000 + 60) return;
    const data = await this.req("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", body: { refresh_token: s.refresh_token }
    });
    this._saveAuth(data);
  }

  _saveAuth(data) {
    if (!data || !data.access_token) throw new Error((data && data.msg) || "登录失败");
    SupabaseConfig.saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: data.expires_at || (Date.now() / 1000 + (data.expires_in || 3600)),
      email: (data.user && data.user.email) || ""
    });
    this.user = data.user ? { id: data.user.id, email: data.user.email } : this.user;
  }

  async signUp(email, password) {
    const data = await this.req("/auth/v1/signup", { method: "POST", body: { email, password } });
    // 开了邮箱确认时不会返回 session
    if (data && data.access_token) this._saveAuth(data);
    return data;
  }

  async signIn(email, password) {
    const data = await this.req("/auth/v1/token?grant_type=password", { method: "POST", body: { email, password } });
    this._saveAuth(data);
    return data;
  }

  async signOut() {
    try { await this.req("/auth/v1/logout", { method: "POST", auth: true }); } catch (e) { /* 忽略 */ }
    SupabaseConfig.saveSession(null);
    this.user = null;
  }

  async currentUser() {
    const s = SupabaseConfig.getSession();
    if (!s) return null;
    try {
      const u = await this.req("/auth/v1/user", { auth: true });
      this.user = { id: u.id, email: u.email };
      return this.user;
    } catch (e) {
      SupabaseConfig.saveSession(null);
      return null;
    }
  }

  /* ---------- 数据：拉取 ---------- */
  async pull() {
    const h = {};
    const [tasks, blocks, diet, fitness, weight, reviews, settings] = await Promise.all([
      this.req("/rest/v1/tasks?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/blocks?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/diet_entries?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/fitness_days?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/weight_entries?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/reviews?select=*", { auth: true, headers: h }),
      this.req("/rest/v1/user_settings?select=*", { auth: true, headers: h })
    ]);
    const ts = v => (v ? new Date(v).getTime() : null);
    const st = defaultState();
    st.tasks = (tasks || []).map(r => ({
      id: r.id, title: r.title || "", subjectId: r.subject_id || null, due: r.due || "",
      priority: r.priority || "normal", estMin: r.est_min || 0, done: !!r.done,
      doneAt: ts(r.done_at), createdAt: ts(r.created_at) || Date.now(), updatedAt: ts(r.updated_at) || Date.now(), deleted: !!r.deleted
    }));
    st.blocks = (blocks || []).map(r => ({
      id: r.id, title: r.title || "", type: r.type || "other", date: r.date,
      start: (r.start || "").slice(0, 5), end: (r.end || "").slice(0, 5), taskId: r.task_id || null,
      done: !!r.done, createdAt: ts(r.created_at) || Date.now(), updatedAt: ts(r.updated_at) || Date.now(), deleted: !!r.deleted
    }));
    st.diet = {};
    (diet || []).forEach(r => {
      if (!st.diet[r.date]) st.diet[r.date] = [];
      st.diet[r.date].push({ id: r.id, meal: r.meal, food: r.food, kcal: r.kcal, note: r.note || "", createdAt: ts(r.created_at) || Date.now(), updatedAt: ts(r.updated_at) || Date.now(), deleted: !!r.deleted });
    });
    st.fitness = {};
    (fitness || []).forEach(r => {
      st.fitness[r.date] = { checks: r.checks || {}, note: r.note || "", rpe: r.rpe || "", updatedAt: ts(r.updated_at) || Date.now() };
    });
    st.weight = {};
    (weight || []).forEach(r => { st.weight[r.date] = parseFloat(r.kg); });
    st.reviews = {};
    (reviews || []).forEach(r => {
      st.reviews[r.key] = { ...(r.data || {}), updatedAt: ts(r.updated_at) || Date.now() };
    });
    st.settings = { ...st.settings, ...(settings && settings[0] && settings[0].data || {}) };
    st.study = normalizeStudy(settings && settings[0] && settings[0].data && settings[0].data.study);
    return st;
  }

  /* ---------- 数据：推送（upsert，软删除记录一并上传作为墓碑） ---------- */
  async push(state) {
    const uid = this.user && this.user.id;
    if (!uid) { await this.currentUser(); if (!this.user) throw new Error("未登录"); }
    const me = this.user.id;
    const iso = v => (v ? new Date(v).toISOString() : new Date().toISOString());
    const upsert = (table, rows) => this.req("/rest/v1/" + table, {
      method: "POST",
      auth: true,
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: rows
    });
    await Promise.all([
      state.tasks.length && upsert("tasks", state.tasks.map(t => ({
        id: t.id, user_id: me, title: t.title, subject_id: t.subjectId || null, due: t.due || null,
        priority: t.priority || "normal", est_min: t.estMin || 0, done: !!t.done,
        done_at: t.doneAt ? new Date(t.doneAt).toISOString() : null,
        created_at: iso(t.createdAt), updated_at: iso(t.updatedAt), deleted: !!t.deleted
      }))),
      state.study.length && upsert("study_records", state.study.map(r => ({
        id: r.id, user_id: me, subject_id: r.subjectId || null, task_id: r.taskId || null,
        date: r.date, start_time: r.startTime || null, minutes: r.minutes || 0, note: r.note || "",
        created_at: iso(r.createdAt), updated_at: iso(r.updatedAt), deleted: !!r.deleted
      }))),
      state.blocks.length && upsert("blocks", state.blocks.map(b => ({
        id: b.id, user_id: me, title: b.title, type: b.type || "other", date: b.date,
        start: b.start, end: b.end, task_id: b.taskId || null, done: !!b.done,
        created_at: iso(b.createdAt), updated_at: iso(b.updatedAt), deleted: !!b.deleted
      }))),
      Object.keys(state.diet).length && upsert("diet_entries", Object.entries(state.diet).flatMap(([date, items]) =>
        (items || []).map(d => ({
          id: d.id, user_id: me, date, meal: d.meal, food: d.food, kcal: d.kcal || 0, note: d.note || "",
          created_at: iso(d.createdAt), updated_at: iso(d.updatedAt), deleted: !!d.deleted
        })))),
      Object.keys(state.fitness).length && upsert("fitness_days", Object.entries(state.fitness).map(([date, rec]) => ({
        date, user_id: me, checks: rec.checks || {}, note: rec.note || "", rpe: rec.rpe || "", updated_at: iso(rec.updatedAt)
      }))),
      Object.keys(state.weight).length && upsert("weight_entries", Object.entries(state.weight).map(([date, kg]) => ({
        date, user_id: me, kg, updated_at: new Date().toISOString()
      }))),
      Object.keys(state.reviews).length && upsert("reviews", Object.entries(state.reviews).map(([key, data]) => ({
        key, user_id: me, data, updated_at: iso(data.updatedAt)
      }))),
      upsert("user_settings", [{
        user_id: me,
        data: {
          examName: state.settings.examName, examDate: state.settings.examDate,
          dietGoalKcal: state.settings.dietGoalKcal, weightGoal: state.settings.weightGoal,
          training: state.settings.training,
          subjects: state.settings.subjects,
          study: state.study
        },
        updated_at: new Date().toISOString()
      }])
    ]);
  }

  /* ---------- 首次登录后的合并 ----------
   * 规则：先拉取远端与本地按记录合并（较新者胜），再把合并结果推回云端。
   * 本地有数据、云端为空 → 本地数据上传；云端有、本地空 → 落地；两边都有 → 逐条合并。
   * 全程不会用空数据覆盖任何一侧。 */
  async syncAfterLogin() {
    const remote = await this.pull();
    Store.state = mergeStates(Store.state, remote);
    Store.save();
    await this.push(Store.state);
    Sync.lastSyncAt = Date.now();
  }
}


/* ================= src/js/timer.js ================= */
/* ================= 专注计时引擎（番茄钟） =================
 * 规则：
 * - 同时只允许一个计时；开始新的必须先结束或丢弃当前计时；
 * - 计时状态持久化到 localStorage，刷新/切页面不丢，恢复后继续累计；
 * - 暂停/继续只切换累计状态，不会产生重复时长；
 * - stop() 返回本次时长（分钟），由调用方记入对应事项，引擎不直接写业务数据。 */
"use strict";

const Timer = {
  active: null,   // { itemId, note, startedAt, accumMs, pausedAt }
  _tick: null,

  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(TIMER_KEY) || "null");
      if (raw && raw.itemId) this.active = raw;
    } catch (e) { this.active = null; }
    return this.active;
  },

  persist() {
    try {
      if (this.active) localStorage.setItem(TIMER_KEY, JSON.stringify(this.active));
      else localStorage.removeItem(TIMER_KEY);
    } catch (e) { /* 忽略 */ }
  },

  isRunning() { return this.active && !this.active.pausedAt; },
  elapsedMs() {
    if (!this.active) return 0;
    const now = this.active.pausedAt || Date.now();
    return this.active.accumMs + (now - this.active.startedAt);
  },

  start(itemId, note) {
    if (this.active) {
      UI.toast("已有计时在进行，请先结束或丢弃");
      return false;
    }
    this.active = { itemId, note: note || "", startedAt: Date.now(), accumMs: 0, pausedAt: null };
    this.persist();
    this.startTick();
    UI.toast("计时开始");
    return true;
  },

  pause() {
    if (!this.active || this.active.pausedAt) return;
    this.active.accumMs += Date.now() - this.active.startedAt;
    this.active.pausedAt = Date.now();
    this.persist();
    UI.toast("已暂停");
  },

  resume() {
    if (!this.active || !this.active.pausedAt) return;
    this.active.startedAt = Date.now();
    this.active.pausedAt = null;
    this.persist();
    UI.toast("继续计时");
  },

  /* 结束：返回 { itemId, minutes } 并清空计时；不足 1 分钟按 1 分钟计 */
  stop() {
    if (!this.active) return null;
    const minutes = Math.max(1, Math.round(this.elapsedMs() / 60000));
    const result = { itemId: this.active.itemId, minutes };
    this.discard();
    return result;
  },

  discard() {
    this.active = null;
    this.persist();
    this.stopTick();
  },

  startTick() {
    this.stopTick();
    // 只更新学习页的大时钟（无全局浮动条）
    this._tick = setInterval(() => {
      const big = document.getElementById("timerBig");
      if (big) big.textContent = fmtClock(this.elapsedMs() / 1000);
    }, 1000);
  },
  stopTick() {
    clearInterval(this._tick);
    this._tick = null;
  },

  /* 恢复：页面加载时若有持久化计时，重启 tick */
  restore() {
    this.load();
    if (this.active) this.startTick();
  }
};


/* ================= src/js/views/today.js ================= */
/* ================= 视图：今日（仪表盘） =================
 * 只负责展示：所有数字均来自 Store 的真实记录，无演示数据。
 * 按钮沿用既有的 App.switchView / TasksView.startTimerForTask，不改写数据模型。 */
"use strict";

const TodayView = {
  render() {
    const el = document.getElementById("view-today");
    const t = today();
    const ts = todayStr();
    const hour = new Date().getHours();
    const greet = hour < 6 ? "夜深了" : hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : "晚上好";

    el.innerHTML = "";
    el.append(
      this.heroSection(greet, t, ts),
      this.nextActionCard(ts),
      this.dashGrid(ts)
    );
    this.fillSummary(ts);
  },

  /* 顶部问候：叠在雪山横幅上；徽标是真实统计，副标题是固定问候语 */
  heroSection(greet, t, ts) {
    return UI.h("div", { class: "dash-hero" },
      UI.h("div", { class: "hero-left" },
        UI.h("div", { class: "hi" }, `${greet}，Moon`, UI.h("span", { class: "wave", "aria-hidden": "true" }, "👋")),
        UI.h("div", { class: "sub" }, "今天也要加油呀，向着目标前进！"),
        UI.h("div", { class: "hero-badge" },
          UI.h("span", { id: "todaySummary" }, "正在整理今日数据…"))),
      UI.h("div", { class: "hero-date" },
        `${t.getMonth() + 1} 月 ${t.getDate()} 日`, UI.h("br"), `${WEEK_CN[t.getDay()]}`)
    );
  },

  fillSummary(ts) {
    const summary = document.getElementById("todaySummary");
    if (!summary) return;
    const open = Store.openTasks();
    const overdue = open.filter(x => x.due && dayDiff(ts, x.due) < 0);
    const parts = [`待完成 ${open.length} 项`];
    if (overdue.length) parts.push(`逾期 ${overdue.length} 项`);
    parts.push("向着目标前进");
    summary.textContent = parts.join(" · ");
  },

  /* 下一步：优先正在计时 → 逾期 → 今天到期 → 最高优先级 → 引导学习
   * 逻辑与原版一致，仅作为细条展示，不占仪表盘视觉重量 */
  nextActionCard(ts) {
    const pri = { high: 0, normal: 1, low: 2 };
    const byPri = (a, b) => (pri[a.priority] ?? 1) - (pri[b.priority] ?? 1);

    if (Timer.active) {
      const item = Store.studyItems().find(x => x.id === Timer.active.itemId);
      return UI.h("div", { class: "next-action" },
        UI.h("div", { class: "na-label" }, "正在计时"),
        UI.h("div", { class: "na-body" },
          UI.h("div", { class: "na-title" }, item ? item.title : "计时中"),
          UI.h("div", { class: "na-sub" }, Timer.isRunning() ? "计时进行中，保持专注" : "已暂停")),
        UI.h("div", { class: "na-ops" },
          UI.h("button", { class: "btn small primary", type: "button", onclick: () => App.switchView("study") }, "回到计时")));
    }

    const open = Store.openTasks();
    const overdue = open.filter(t => t.due && dayDiff(ts, t.due) < 0).sort(byPri);
    const dueToday = open.filter(t => t.due === ts).sort(byPri);
    const pool = overdue.length ? overdue : (dueToday.length ? dueToday : open.slice().sort(byPri));

    if (!pool.length) {
      return UI.h("div", { class: "next-action" },
        UI.h("div", { class: "na-label" }, "下一步"),
        UI.h("div", { class: "na-body" },
          UI.h("div", { class: "na-title" }, "今天没有待办"),
          UI.h("div", { class: "na-sub" }, "去学习页挑一件事，开始一段计时")),
        UI.h("div", { class: "na-ops" },
          UI.h("button", { class: "btn small primary", type: "button", onclick: () => App.switchView("study") }, "开始学习")));
    }

    const t = pool[0];
    const tagText = t.due && dayDiff(ts, t.due) < 0 ? `逾期 ${-dayDiff(ts, t.due)} 天` : t.due === ts ? "今天到期" : PRIORITY_LABEL(t.priority);
    const tagCls = !t.due ? "" : dayDiff(ts, t.due) < 0 ? "over" : "today";
    return UI.h("div", { class: "next-action" },
      UI.h("div", { class: "na-label" }, "下一步"),
      UI.h("div", { class: "na-body" },
        UI.h("div", { class: "na-title" }, t.title),
        UI.h("div", { class: "na-sub" },
          UI.h("span", { class: "tag tag-due " + tagCls }, tagText),
          t.spentMin ? UI.h("span", { style: "margin-left:6px" }, `已投入 ${fmtMin(t.spentMin)}`) : null)),
      UI.h("div", { class: "na-ops" },
        UI.h("button", { class: "btn small primary", type: "button", onclick: () => TasksView.startTimerForTask(t) }, "开始计时"),
        UI.h("button", { class: "btn small", type: "button", onclick: () => { t.done = true; t.doneAt = Date.now(); Store.touch(t); Store.save(); TodayView.render(); TasksView.renderCounts(); UI.toast(t.spentMin ? `完成 ✓ 累计投入 ${fmtMin(t.spentMin)}` : "完成一项 ✓"); } }, "完成")));
  },

  /* 仪表盘网格：第一行 4+2，第二行 2+2+2，第三行 3+3，底部数据条 */
  dashGrid(ts) {
    const grid = UI.h("div", { class: "dash-grid" });
    grid.append(
      this.focusCard(ts),
      this.examCard(ts),
      this.studyCard(ts),
      this.weightCard(ts),
      this.weekStudyCard(ts),
      this.timelineCard(ts),
      this.quickCard(ts),
      this.miniStatsCard(ts)
    );
    return grid;
  },

  /* 今日重点（4 列） */
  focusCard(ts) {
    const open = Store.openTasks();
    const dueToday = open.filter(x => x.due === ts);
    const pri = { high: 0, normal: 1, low: 2 };
    const focus = open.slice().sort((a, b) => {
      const ao = a.due && dayDiff(ts, a.due) < 0 ? 1 : 0, bo = b.due && dayDiff(ts, b.due) < 0 ? 1 : 0;
      if (ao !== bo) return bo - ao;
      if (a.due !== b.due) return a.due ? (b.due ? (a.due < b.due ? -1 : 1) : -1) : 1;
      return pri[a.priority] - pri[b.priority];
    }).slice(0, 2);
    const doneToday = Store.state.tasks.filter(x => x.done && x.doneAt && dstr(new Date(x.doneAt)) === ts).length;
    const totalToday = doneToday + dueToday.length;
    const rate = totalToday ? Math.round(doneToday / totalToday * 100) : 0;

    const card = UI.h("div", { class: "card span4" },
      UI.h("div", { class: "card-title" },
        icoEl("star"), "今日重点", UI.h("span", { class: "go" }, "›"),
        UI.h("span", { class: "extra" }, `今日已完成 ${doneToday}/${totalToday} · ${rate}%`)));
    const body = UI.h("div", { class: "card-body" });
    const list = UI.h("div", { class: "focus-list" });
    if (focus.length) focus.forEach(task => list.append(TasksView.taskRow(task, { compact: true })));
    else list.append(UI.empty("今日无待办任务", "去「任务」页添加，或给自己留一段自由时间"));
    body.append(list);

    const foot = UI.h("div", { class: "card-foot" },
      UI.h("div", { class: "focus-tip" },
        UI.h("span", { class: "dot" }),
        focus.length ? `建议：先完成「${focus[0].title}」` : "建议：先挑一件最重要的事"),
      UI.h("button", { class: "btn pill", type: "button", onclick: () => App.switchView("study") }, "开始学习 →"));
    card.append(body, foot);
    return card;
  },

  /* 考研倒计时（2 列） */
  examCard(ts) {
    const s = Store.state.settings;
    const card = UI.h("div", { class: "card span2" },
      UI.h("div", { class: "card-title" }, icoEl("cap"), "考研倒计时", UI.h("span", { class: "go" }, "›")));
    const body = UI.h("div", { class: "card-body" });
    const row = UI.h("div", { class: "metric-row" });
    if (!s.examDate) {
      row.append(
        UI.h("div", {},
          UI.h("div", { class: "metric" }, "—", UI.h("small", {}, "天")),
          UI.h("div", { class: "metric-sub" }, "尚未设置考试日期")),
        miniRing(0, "未设置考试日期"));
      body.append(row, UI.h("div", { class: "card-foot" },
        UI.h("span", { class: "hint" }, "在「设置」填写后自动计算"),
        UI.h("button", { class: "btn pill", type: "button", onclick: () => App.switchView("settings") }, "去设置 →")));
    } else {
      const diff = dayDiff(ts, s.examDate);
      const start = parseDate(s.examDate); start.setMonth(start.getMonth() - 4);
      const total = Math.max(1, dayDiff(dstr(start), s.examDate));
      const pct = diff > 0 ? Math.min(100, Math.max(2, Math.round((total - diff) / total * 100))) : 100;
      row.append(
        UI.h("div", {},
          UI.h("div", { class: "metric" }, String(Math.max(0, diff)), UI.h("small", {}, "天")),
          UI.h("div", { class: "metric-sub" }, "加油，未来可期！")),
        miniRing(pct, "备考进程"));
      body.append(row, UI.h("div", { class: "card-foot" },
        UI.h("span", { class: "hint" }, `${s.examName || "考试"} · ${s.examDate.replace(/-/g, "/")}`),
        UI.h("span", { class: "badge-goal" }, `进程 ${pct}%`)));
    }
    card.append(body);
    return card;
  },

  /* 学习计时（2 列）：今日真实专注时长 */
  studyCard(ts) {
    const min = Store.studyMinutes(ts);
    const hhmm = `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
    const running = !!Timer.active;
    const card = UI.h("div", { class: "card span2" },
      UI.h("div", { class: "card-title" }, icoEl("play"), "学习计时", UI.h("span", { class: "go" }, "›")));
    const body = UI.h("div", { class: "card-body" },
      UI.h("div", { class: "metric" }, hhmm),
      UI.h("div", { class: "metric-sub" }, running ? "时:分 · 正在计时，今日累计专注" : "时:分 · 今日累计专注，番茄钟 25 分钟"),
      UI.h("div", { class: "card-foot" },
        UI.h("span", { class: "hint" }, `本周 ${(Store.studyMinutesBetween(...weekRange()) / 60).toFixed(1)} h`),
        UI.h("button", { class: "btn soft", type: "button", onclick: () => App.switchView("study") }, "开始专注")));
    // 玻璃球装饰（纯视觉，不承载数据）
    const orb = UI.h("div", { "aria-hidden": "true", style: "position:absolute;right:-16px;bottom:-34px;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.92),rgba(120,165,255,.42) 46%,rgba(47,109,246,.04) 72%);pointer-events:none" });
    card.append(orb, body);
    return card;
  },

  /* 健身与增重（2 列）：真实体重 + 真实趋势 + 本周训练完成度 */
  weightCard(ts) {
    const w = Store.weightOf(ts);
    const y = new Date(parseDate(ts)); y.setDate(y.getDate() - 1);
    const prev = Store.weightOf(dstr(y));
    const delta = (w !== null && prev !== null) ? +(w - prev).toFixed(1) : null;
    const goal = Store.state.settings.weightGoal;
    const [w0, w1] = weekRange();
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    const plan = (Store.state.settings.training.planDays || []).length;
    const pct = plan ? Math.min(100, Math.round(weekFit / plan * 100)) : 0;

    const card = UI.h("div", { class: "card span2" },
      UI.h("div", { class: "card-title" }, icoEl("dumbbell"), "健身与增重", UI.h("span", { class: "go" }, "›")));
    const body = UI.h("div", { class: "card-body" });
    const row = UI.h("div", { class: "metric-row" },
      UI.h("div", {},
        UI.h("div", { class: "metric" }, w === null ? "—" : String(w), UI.h("small", {}, "kg")),
        UI.h("div", { class: "metric-sub" },
          delta === null ? "记录两天后可看变化" : "较昨日",
          delta === null ? null : UI.h("span", { class: "trend" + (delta > 0 ? "" : delta < 0 ? " down" : " flat"), style: "margin-left:6px" }, `${delta > 0 ? "+" : ""}${delta}`))),
      miniRing(pct, "本周训练"));
    body.append(row);
    const spark = sparkline(ts);
    if (spark) body.append(spark);
    else body.append(UI.h("div", { class: "hint", style: "margin-top:auto;padding-top:14px" }, "暂无连续体重记录，去健身页记一次"));
    body.append(UI.h("div", { class: "card-foot" },
      UI.h("span", { class: "badge-goal" }, goal ? `目标 ${goal} kg` : "目标未设置"),
      UI.h("button", { class: "btn small", type: "button", onclick: () => App.switchView("fitness") }, "去记录 →")));
    card.append(body);
    return card;
  },

  /* 本周学习时长（2 列）：本周 7 天真实计时柱状图 */
  weekStudyCard(ts) {
    const [w0] = weekRange();
    const mon = parseDate(w0);
    const dow = (today().getDay() + 6) % 7;
    let cur = 0, prev = 0;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const v = Store.studyMinutes(dstr(d));
      days.push({ date: dstr(d), value: v, label: WEEK_SHORT[(i + 1) % 7], today: i === dow });
      if (i <= dow) cur += v;
      const p = new Date(mon); p.setDate(mon.getDate() + i - 7);
      if (i <= dow) prev += Store.studyMinutes(dstr(p));
    }
    const pct = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    const trend = pct === null ? "— 上周同期无记录" : `${pct >= 0 ? "▲ +" : "▼ "}${pct}% 较上周同期`;

    const card = UI.h("div", { class: "card span2" },
      UI.h("div", { class: "card-title" }, icoEl("bars"), "本周学习时长", UI.h("span", { class: "go" }, "›")));
    card.append(
      UI.h("div", { class: "metric-row" },
        UI.h("div", { class: "metric" }, (cur / 60).toFixed(1), UI.h("small", {}, "h")),
        UI.h("span", { class: "trend" + (pct !== null && pct < 0 ? " down" : " flat"), style: "font-size:10.5px" }, trend)),
      weekBars(days),
      UI.h("div", { class: "card-foot", style: "padding-top:6px" },
        UI.h("span", { class: "hint" }, "数据来自专注计时"),
        UI.h("button", { class: "btn small", type: "button", onclick: () => App.switchView("study") }, "去学习 →")));
    return card;
  },

  /* 今日时间轴（3 列）：时间块 / 今日任务 / 今日学习记录，均为真实数据 */
  timelineCard(ts) {
    const card = UI.h("div", { class: "card span3" },
      UI.h("div", { class: "card-title" }, icoEl("clock"), "今日时间轴",
        UI.h("span", { class: "extra" }, UI.h("button", { class: "btn small ghost", type: "button", style: "min-height:24px;padding:2px 6px;font-size:11px;box-shadow:none", onclick: () => App.switchView("tasks") }, "查看全部 →"))));
    const list = UI.h("div", { class: "timeline" });
    const rows = [];

    // 1. 已保存的时间块（v1 老数据 / 云同步数据）
    Store.blocksOf(ts).forEach(b => {
      const start = b.start || "", end = b.end || "";
      rows.push({
        time: start ? (end ? `${start} – ${end}` : start) : "今天",
        name: b.title || b.name || "未命名安排",
        sub: b.type ? BLOCK_TYPE_LABEL(b.type) : "安排"
      });
    });
    // 2. 今日到期任务
    if (rows.length < 4) {
      Store.openTasks().filter(x => x.due === ts).slice(0, 4 - rows.length).forEach(x => {
        rows.push({ time: "今天到期", name: x.title, sub: PRIORITY_LABEL(x.priority) });
      });
    }
    // 3. 今日有计时记录的学习事项
    if (rows.length < 4) {
      const rec = Store.studyDay(ts);
      Object.keys(rec).filter(k => rec[k] > 0).slice(0, 4 - rows.length).forEach(k => {
        const it = Store.studyItems().find(s => s.id === k);
        rows.push({ time: "已专注", name: it ? it.title : "学习事项", sub: `${rec[k]} 分钟` });
      });
    }

    if (!rows.length) {
      // 明确标注为操作引导，不冒充任何已发生的记录
      list.append(UI.h("div", { class: "hint", style: "padding:2px 0 6px" }, "今天还没有安排记录，可以这样开始："));
      [
        { time: "待办", name: "添加一条今日到期的任务", sub: "任务页 · 回车快速添加" },
        { time: "专注", name: "开始一次 25 分钟计时", sub: "学习页 · 自动累计时长" },
        { time: "记录", name: "记一次体重或训练", sub: "健身页 · 生成真实趋势" }
      ].forEach(r => list.append(UI.h("div", { class: "tl-row tip" },
        UI.h("span", { class: "tl-dot" }),
        UI.h("span", { class: "tl-time" }, r.time),
        UI.h("span", { class: "tl-main" },
          UI.h("div", { class: "tl-name" }, r.name),
          UI.h("div", { class: "tl-sub" }, r.sub)))));
    } else {
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      rows.slice(0, 4).forEach((r, i) => {
        const inNow = /^\d{2}:\d{2}/.test(r.time) && (() => {
          const [a, b] = r.time.split("–").map(x => x.trim());
          const toM = s => { const [h, m] = (s || "").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
          return nowMin >= toM(a) && (b ? nowMin <= toM(b) : nowMin <= toM(a) + 60);
        })();
        list.append(UI.h("div", { class: "tl-row" + (inNow ? " now" : "") },
          UI.h("span", { class: "tl-dot" }),
          UI.h("span", { class: "tl-time" }, r.time),
          UI.h("span", { class: "tl-main" },
            UI.h("div", { class: "tl-name" }, r.name),
            UI.h("div", { class: "tl-sub" }, r.sub))));
      });
    }
    card.append(list);
    return card;
  },

  /* 快速入口 + 激励卡（3 列） */
  quickCard(ts) {
    const card = UI.h("div", { class: "card span3" },
      UI.h("div", { class: "card-title" }, icoEl("grid"), "快速入口", UI.h("span", { class: "go" }, "›")));
    const items = [
      { view: "study", label: "学习", cls: "book", path: '<path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2V5z"/><path d="M20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2V5z"/>' },
      { view: "fitness", label: "健身", cls: "fit", path: '<path d="M6.5 6.5h11v11h-11z"/><path d="M2 9v6M22 9v6M6.5 2v4M17.5 2v4M6.5 18v4M17.5 18v4"/>' },
      { view: "tasks", label: "任务", cls: "cal", path: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>' },
      { view: "settings", label: "设置", cls: "chart", path: '<path d="M4 20V12M10 20V6M16 20v-6M22 20H2"/>' }
    ];
    const grid = UI.h("div", { class: "quick-grid" });

      UI.h("span", { class: "q-go", "aria-hidden": "true" }, "→"));
    card.append(grid, quote);
    return card;
  },

  /* 底部真实数据条 */
  miniStatsCard(ts) {
    const [w0, w1] = weekRange();
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    const w = Store.weightOf(ts);
    const card = UI.h("div", { class: "card span6", style: "padding:10px 16px" });

const DASH_ICONS = {
  star: '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.2l5.9-.9L12 3z"/>',
  cap: '<path d="M2 8l10-4 10 4-10 4-10-4z"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/>',
  dumbbell: '<path d="M6.5 6.5h11v11h-11z"/><path d="M2 9v6M22 9v6M6.5 2v4M17.5 2v4M6.5 18v4M17.5 18v4"/>',
  bars: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'
};
function icoEl(name) {
  const s = UI.h("span", { class: "ico", "aria-hidden": "true" });
  s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${DASH_ICONS[name] || DASH_ICONS.grid}</svg>`;
  return s;
}
function svgEl(w, h, content, cls, label, stretch) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("role", "img");
  if (stretch) s.setAttribute("preserveAspectRatio", "none");
  if (label) s.setAttribute("aria-label", label);
  if (cls) s.setAttribute("class", cls);
  s.innerHTML = content;
  return s;
}
function miniRing(pct, label) {
  const r = 25, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
  const content = `<circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 31 31)"/>
    <text x="31" y="32" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="var(--ink)" font-family="var(--font)">${pct}%</text>`;
  return svgEl(62, 62, content, "mini-ring", label || `完成度 ${pct}%`);
}
/* 最近 7 天有记录的体重，全部来自 Store.state.weight */
function sparkline(ts) {
  const pts = [];
  for (let i = 6; i >= 0; i--) {
    const d = parseDate(ts); d.setDate(d.getDate() - i);
    const v = Store.weightOf(dstr(d));
    if (v !== null) pts.push({ label: `${d.getMonth() + 1}/${d.getDate()}`, value: v });
  }
  if (pts.length < 2) return null;
  const vals = pts.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 0.4) { max += 0.2; min -= 0.2; }
  const W = 240, H = 46, L = 6, R = 6, T = 7, B = 7;
  const xy = pts.map((p, i) => [
    L + (W - L - R) * (i / (pts.length - 1)),
    T + (H - T - B) * (1 - (p.value - min) / (max - min))
  ]);
  const path = "M" + xy.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L");
  const dots = xy.map((p, i) => `<circle class="spark-dot${i === xy.length - 1 ? " last" : ""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === xy.length - 1 ? 3.6 : 2.8}"><title>${esc(pts[i].label)}：${pts[i].value} kg</title></circle>`).join("");
  const content = `<line class="spark-grid" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <path class="spark-line" d="${path}"/>${dots}`;
  return svgEl(W, H, content, "mini-line", "最近体重趋势", true);
}
/* 本周 7 天学习分钟柱状图 */
function weekBars(days) {
  const W = 240, H = 62, T = 7, B = 15;
  const max = Math.max(60, ...days.map(d => d.value));
  const bw = (W - 12) / 7;
  const bars = days.map((d, i) => {
    const h = Math.max(3, (H - T - B) * (d.value / max));
    const x = 6 + i * bw + bw * 0.18;
    const y = H - B - h;
    return `<rect class="mb${d.today ? " today" : ""}${d.value === 0 ? " zero" : ""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="5"><title>周${d.label}：${d.value} 分钟</title></rect>`;
  }).join("");
  const labels = days.map((d, i) => `<text class="ml" x="${(6 + i * bw + bw * 0.5).toFixed(1)}" y="${H - 3}" text-anchor="middle">${d.label}</text>`).join("");
  return svgEl(W, H, bars + labels, "mini-bars", "本周每日学习时长（分钟）", true);
}

function doneRateWeek() {
  const [w0, w1] = weekRange();
  const all = Store.state.tasks.filter(t => !t.deleted && t.createdAt && dstr(new Date(t.createdAt)) >= w0 && dstr(new Date(t.createdAt)) <= w1);
  if (!all.length) return 0;
  const done = all.filter(t => t.done && t.doneAt && dstr(new Date(t.doneAt)) >= w0 && dstr(new Date(t.doneAt)) <= w1).length;
  return Math.round(done / all.length * 100);
}

    const nums = {
      open: cnt(t => !t.deleted && !t.done),

  renderList() {

    const ts = todayStr(), [w0, w1] = weekRange();
    let items = Store.state.tasks.filter(t => !t.deleted);
    if (this.filterSubj) items = items.filter(t => this.filterSubj === "__none" ? !t.subjectId : t.subjectId === this.filterSubj);
    if (this.filter === "open") items = items.filter(t => !t.done);
    else if (this.filter === "today") items = items.filter(t => !t.done && t.due === ts);
    else if (this.filter === "week") items = items.filter(t => !t.done && t.due && t.due >= w0 && t.due <= w1);
    else if (this.filter === "over") items = items.filter(t => !t.done && t.due && dayDiff(ts, t.due) < 0);
    else if (this.filter === "done") items = items.filter(t => t.done);
    const pri = { high: 0, normal: 1, low: 2 };
    items.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (!a.done && a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
      if (!a.done && a.due !== b.due) return a.due ? -1 : 1;
      if (!a.done && a.priority !== b.priority) return pri[a.priority] - pri[b.priority];
      return (b.createdAt || 0) - (a.createdAt || 0);

        UI.h("button", { class: "mini-btn danger", type: "button", title: "删除", "aria-label": "删除任务", onclick: () => this.remove(t) },

  /* 为一个任务开始计时：自动匹配/创建同名学习事项并建立关联 */
  startTimerForTask(t) {
    if (Timer.active) { UI.toast("已有计时在进行，先去学习页结束它"); return; }
    const short = t.title.trim().slice(0, 14);
    let item = Store.state.study.items.find(i => i.taskId === t.id)
            || Store.state.study.items.find(i => i.title === short);
    if (!item) {
      item = { id: uid(), title: short, taskId: t.id };
      Store.state.study.items.push(item);
    } else if (!item.taskId) {
      item.taskId = t.id;

    Store.save();
    if (Timer.start(item.id, t.title)) App.switchView("study");

    if (App.curView === "today") TodayView.render();

        taskTip = `，已累计到「${task.title.slice(0, 8)}」`;
      }
    }
    Store.save();
    this.render();
    if (App.curView === "today") TodayView.render();
    UI.toast(`已记录 ${r.minutes} 分钟${taskTip}`, 2600);
  },

  async discardTimer() {
    const ok = await UI.confirmDanger("丢弃本次计时", "当前累计的时长将作废，不会记录。确定丢弃吗？", "丢弃");
    if (!ok) return;
    Timer.discard();
    this.render();
  },

  /* ---- 今日事项 ---- */
  itemsCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--blue)" }), "今日事项",
        UI.h("span", { class: "extra" }, "自己设置每天要做的事"))
    );
    const inp = UI.input({ placeholder: "添加事项，例如：英语阅读一篇", maxlength: 30, id: "studyItemInp" });
    const add = () => {
      const v = inp.value.trim();
      if (!v) { UI.toast("先输入事项名称"); return; }
      if (Store.studyItems().some(x => x.title === v)) { UI.toast("事项已存在"); return; }
      Store.state.study.items.push({ id: uid(), title: v });
      Store.state.study.updatedAt = Date.now();
      Store.save();
      inp.value = "";
      this.render();
      UI.toast("已添加");
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    card.append(UI.h("div", { class: "add-row" }, inp, UI.h("button", { class: "btn primary", type: "button", onclick: add }, "添加")));

    const items = Store.studyItems();
    if (!items.length) {
      card.append(UI.empty("还没有事项", "添加今天要做的事，然后点「开始」计时"));
      return card;
    }
    const day = Store.studyDay(todayStr());
    const list = UI.h("div", { class: "study-items" });
    items.forEach((it, i) => {
      const mins = day[it.id] || 0;
      const isActive = Timer.active && Timer.active.itemId === it.id;
      list.append(UI.h("div", { class: "study-item" + (isActive ? " active" : "") },
        UI.h("span", { class: "study-item-dot", style: `background:${ITEM_COLORS[i % ITEM_COLORS.length]}` }),
        UI.h("div", { class: "study-item-body" },
          UI.h("div", { class: "study-item-name" }, it.title),
          UI.h("div", { class: "study-item-mins" }, mins > 0 ? `今日已学 ${fmtMin(mins)}` : "今日未学")),
        UI.h("div", { class: "study-item-ops" },
          UI.h("button", { class: "mini-btn", type: "button", title: "重命名", "aria-label": "重命名事项", onclick: () => this.renameItem(it) },
            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" }))),
          UI.h("button", { class: "mini-btn danger", type: "button", title: "删除事项", "aria-label": "删除事项", onclick: () => this.removeItem(it) },
            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" }))),
          isActive
            ? UI.h("span", { class: "tag tag-type-study" }, "计时中")
            : UI.h("button", { class: "btn small primary", type: "button", onclick: () => { if (Timer.start(it.id)) this.render(); } }, "开始"))
      ));
    });
    card.append(list);
    return card;
  },

  renameItem(it) {
    UI.modal({
      title: "重命名事项",
      submitText: "保存",
      body: (box) => {
        const name = UI.input({ value: it.title, required: true, maxlength: 30 });
        box.append(UI.field("事项名称", name));
        box._get = () => name;
      },
      onSubmit: (box) => {
        const v = box._get().value.trim();
        if (!v) { UI.toast("名称不能为空"); return false; }
        it.title = v;
        Store.state.study.updatedAt = Date.now();
        Store.save(); this.render();
        UI.toast("已保存");
      }
    });
  },

  async removeItem(it) {
    const used = Object.values(Store.studyDay(todayStr())).length;
    const ok = await UI.confirmDanger("删除事项", `确定删除「${it.title}」吗？历史学习记录会保留但不再显示名称。`, "确认删除");
    if (!ok) return;
    Store.state.study.items = Store.state.study.items.filter(x => x.id !== it.id);
    Store.state.study.updatedAt = Date.now();
    if (Timer.active && Timer.active.itemId === it.id) Timer.discard();
    Store.save();
    this.render();
    UI.toast("已删除");
  },

  /* ---- 当日饼状图 ---- */
  donutCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--coral)" }), "今日时长", UI.h("span", { class: "extra" }, todayStr().slice(5).replace("-", "/")))
    );
    const day = Store.studyDay(todayStr());
    const total = Store.studyMinutes(todayStr());
    if (!total) {
      card.append(UI.empty("今天还没有学习记录", "开始第一次计时，这里就会出现占比图"));
      return card;
    }
    const items = Store.studyItems();
    const segments = items.map((it, i) => ({ name: it.title, value: day[it.id] || 0, color: ITEM_COLORS[i % ITEM_COLORS.length] })).filter(s => s.value > 0);
    const wrap = UI.h("div", { class: "donut-wrap" });
    const chart = Charts.donut({ segments, centerText: fmtMin(total), centerSub: "今日总计" });
    if (chart) wrap.append(chart);
    const legend = UI.h("div", { class: "donut-legend" });
    segments.forEach((s, i) => {
      const pct = Math.round(s.value / total * 100);
      legend.append(UI.h("div", { class: "donut-leg-row" },
        UI.h("span", { class: "donut-leg-dot", style: `background:${ITEM_COLORS[items.findIndex(x => x.title === s.name) % ITEM_COLORS.length]}` }),
        UI.h("span", { class: "donut-leg-name" }, s.name),
        UI.h("span", { class: "donut-leg-val" }, `${fmtMin(s.value)} · ${pct}%`)));
    });
    wrap.append(legend);
    card.append(wrap);
    return card;
  },

  /* ---- 每日统计 ---- */
  dailyCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "每日学习时长", UI.h("span", { class: "extra" }, "最近 14 天"))
    );
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = today(); d.setDate(d.getDate() - i); days.push(dstr(d)); }
    const items = days.map(d => ({ label: d.slice(5).replace("-", "/"), value: Store.studyMinutes(d), tip: d }));
    const hasAny = items.some(x => x.value > 0);
    if (!hasAny) {
      card.append(UI.empty("暂无统计数据", "坚持记录几天，这里会出现每日时长"));
      return card;
    }
    card.append(UI.h("div", { class: "chart-box" }, Charts.bars({ items, unit: " 分钟", label: "最近 14 天每日学习时长" }),
      UI.h("div", { class: "chart-note" }, "悬停柱子查看具体日期与时长")));
    // 近 14 天汇总
    const [w0] = weekRange();
    const weekMin = Store.studyMinutesBetween(w0, todayStr());
    const activeDays = days.filter(d => Store.studyMinutes(d) > 0).length;
    card.append(UI.h("div", { class: "stat-row", style: "margin-top:14px" },
      UI.stat({ value: fmtMin(Store.studyMinutes(todayStr())), label: "今日学习", color: "violet" }),
      UI.stat({ value: fmtMin(weekMin), label: "本周学习", color: "blue" }),
      UI.stat({ value: `${activeDays} 天`, label: "近 14 天学习天数", color: "green" })));
    return card;
  }
};


/* ================= src/js/views/fitness.js ================= */
/* ================= 视图：健身与增重 ================= */
"use strict";

const FitnessView = {
  render() {
    const el = document.getElementById("view-fitness");
    el.innerHTML = "";
    el.append(
      this.banner(),
      this.statsRow(),
      this.todayCard(),
      this.weightCard(),
      this.dietCard(),
      this.historyCard()
    );
    // 卡片已挂载到文档，再渲染依赖 DOM 的图表与列表
    this.renderWeightChart();
    this.renderWeightList();
  },

  banner() {
    const dow = today().getDay();
    const isPlan = Store.state.settings.training.planDays.includes(dow);
    return UI.h("div", { class: "card fit-banner " + (isPlan ? "on" : "off") },
      UI.h("div", { class: "icon" },
        UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M6.5 6.5h11v11h-11z" }), UI.h("path", { d: "M2 9v6M22 9v6M6.5 2v4M17.5 2v4M6.5 18v4M17.5 18v4" }))),
      UI.h("div", {},
        UI.h("h3", {}, isPlan ? "今天是训练日" : "今天不是计划训练日"),
        UI.h("p", {}, isPlan ? `${WEEK_CN[dow]} · 按计划完成今日动作` : "休息日，好好恢复；也可以主动补练")),
      UI.h("div", { class: "rule", style: "margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink-2);font-weight:600" },
        `每周 ${Store.state.settings.training.planDays.map(d => WEEK_CN[d]).join(" / ")}`, UI.h("br"),
        `${Store.state.settings.training.exercises.length} 个动作`)
    );
  },

  statsRow() {
    const [w0, w1] = weekRange();
    const monthPrefix = todayStr().slice(0, 7);
    const monthFit = Object.keys(Store.state.fitness).filter(d => d.startsWith(monthPrefix)).length;
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    const dates = Object.keys(Store.state.fitness).sort();
    let best = 0, cur = 0;
    dates.forEach((d, i) => {
      if (i === 0) cur = 1;
      else {
        const p = new Date(d); p.setDate(p.getDate() - 1);
        cur = Store.state.fitness[dstr(p)] ? cur + 1 : 1;
      }
      best = Math.max(best, cur);
    });
    let streak = 0;
    for (let i = 0; ; i++) {
      const d = today(); d.setDate(d.getDate() - i);
      if (Store.state.fitness[dstr(d)]) streak++;
      else { if (i === 0) continue; break; }
    }
    return UI.h("div", { class: "stat-row", style: "margin-bottom:16px" },
      UI.stat({ value: monthFit, label: "本月训练", color: "blue", sub: "天" }),
      UI.stat({ value: weekFit, label: "本周训练", color: "coral", sub: `计划 ${Store.state.settings.training.planDays.length} 次` }),
      UI.stat({ value: `${streak} 天`, label: "当前连续", color: streak ? "green" : "" }),
      UI.stat({ value: `${best} 天`, label: "最长连续", color: "violet" })
    );
  },

  /* ---- 今日训练打卡 ---- */
  todayCard() {
    const ts = todayStr();
    const plan = Store.state.settings.training;
    const rec = Store.state.fitness[ts] || { checks: {} };
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--coral)" }), "今日训练",
        UI.h("span", { class: "extra" },
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editTraining() }, "编辑训练计划")))
    );
    const grid = UI.h("div", { class: "ex-grid" });
    const totalSets = plan.exercises.reduce((a, e) => a + e.sets, 0);
    let doneSets = 0;
    plan.exercises.forEach((ex, i) => {
      const checks = rec.checks && rec.checks[ex.id] || [];
      const n = checks.filter(Boolean).length;
      doneSets += n;
      const allDone = n === ex.sets;
      grid.append(UI.h("div", { class: "ex" + (allDone ? " all-done" : "") },
        UI.h("div", { class: "ex-head" },
          UI.h("span", { class: "ex-num" }, String(i + 1)),
          UI.h("span", { class: "ex-name" }, ex.name),
          UI.h("span", { class: "ex-part" }, ex.part)),
        UI.h("div", { class: "ex-target" }, `${ex.sets} 组 × ${ex.reps}`),
        ex.tip ? UI.h("div", { class: "ex-tip" }, ex.tip) : null,
        UI.h("div", { class: "sets" },
          Array.from({ length: ex.sets }, (_, s) => UI.h("button", {
            class: "set-btn" + (checks[s] ? " on" : ""), type: "button",
            "aria-label": `${ex.name} 第 ${s + 1} 组`, "aria-pressed": checks[s] ? "true" : "false",
            onclick: () => this.toggleSet(ex.id, s, ex.sets)
          }, String(s + 1))),
          UI.h("span", { class: "lbl" }, "组"))
      ));
    });
    card.append(grid);

    // RPE + 备注
    const rpe = UI.select(Array.from({ length: 10 }, (_, i) => ({ value: String(i + 1), label: `${i + 1}${i === 0 ? "（很轻松）" : i === 8 ? "（很吃力）" : i === 9 ? "（极限）" : ""}` })), String(rec.rpe || ""), { allLabel: "主观难度（可选）" });
    rpe.style.maxWidth = "180px";
    const note = UI.h("textarea", { class: "inp", placeholder: "训练备注：重量、状态、感受……", id: "fitNote" });
    note.value = rec.note || "";
    rpe.addEventListener("change", () => { this.saveToday({ rpe: rpe.value }); });
    note.addEventListener("input", () => {
      clearTimeout(note._tm);
      note._tm = setTimeout(() => this.saveToday({ note: note.value }), 500);
    });
    card.append(
      UI.h("div", { class: "row", style: "margin-top:14px" }, rpe),
      note,
      UI.h("div", { class: "rest-tip" },
        UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("circle", { cx: "12", cy: "12", r: "10" }), UI.h("polyline", { points: "12 6 12 12 16 14" })),
        `每组之间休息 ${plan.restSec} 秒；单臂动作左右交替，左右各一次合计为一次`),
      UI.h("div", { style: "font-size:12.5px;color:var(--ink-3);margin-top:10px" }, `今日进度：${doneSets} / ${totalSets} 组`)
    );
    return card;
  },

  toggleSet(exId, idx, sets) {
    const ts = todayStr();
    if (!Store.state.fitness[ts]) Store.state.fitness[ts] = { checks: {}, note: "", rpe: "" };
    const rec = Store.state.fitness[ts];
    if (!rec.checks[exId]) rec.checks[exId] = Array(sets).fill(false);
    rec.checks[exId][idx] = !rec.checks[exId][idx];
    rec.updatedAt = Date.now();
    Store.save();
    this.render();
    const plan = Store.state.settings.training;
    const total = plan.exercises.reduce((a, e) => a + e.sets, 0);
    const done = plan.exercises.reduce((a, e) => a + ((rec.checks[e.id] || []).filter(Boolean).length), 0);
    if (done === total) UI.toast("今日训练全部完成 💪");
  },

  saveToday(patch) {
    const ts = todayStr();
    if (!Store.state.fitness[ts]) Store.state.fitness[ts] = { checks: {}, note: "", rpe: "" };
    Object.assign(Store.state.fitness[ts], patch, { updatedAt: Date.now() });
    Store.save();
  },

  /* ---- 体重 ---- */
  weightCard() {
    const ts = todayStr();
    const cur = Store.weightOf(ts);
    const goal = Store.state.settings.weightGoal;
    const avg7 = Store.weight7Avg(ts);
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "每日体重",
        UI.h("span", { class: "extra" }, goal ? `目标 ${goal} kg` : "未设目标"),
        UI.h("span", {},
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editWeightGoal() }, goal ? "修改目标" : "设目标")))
    );
    const inp = UI.input({ type: "number", step: "0.1", min: "30", max: "200", placeholder: "0.0", value: cur === null ? "" : cur, id: "wInp" });
    inp.style.maxWidth = "130px";
    const add = () => {
      const v = parseFloat(inp.value);
      if (isNaN(v) || v < 30 || v > 200) { UI.toast("请输入 30–200 之间的体重（kg）"); return; }
      Store.state.weight[ts] = +v.toFixed(1);
      Store.save(); this.render();
      UI.toast("体重已记录");
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    const y = new Date(today()); y.setDate(y.getDate() - 1);
    const prev = Store.weightOf(dstr(y));
    let deltaTxt = "", deltaCls = "flat";
    if (cur !== null && prev !== null && cur !== prev) {
      const d = +(cur - prev).toFixed(1);
      deltaTxt = `较昨日 ${d > 0 ? "+" : ""}${d} kg`;
      deltaCls = d > 0 ? "up" : d < 0 ? "down" : "flat";
    } else if (cur !== null) deltaTxt = "今日已记录";
    card.append(
      UI.h("div", { class: "row" }, inp, UI.h("span", { style: "font-weight:700;color:var(--ink-2)" }, "kg"),
        UI.h("button", { class: "btn primary", type: "button", onclick: add }, "记录"),
        UI.h("span", { class: `delta ${deltaCls}`, style: "margin-left:auto;font-weight:700;font-size:13px" }, deltaTxt)),
      UI.h("div", { class: "chart-box", style: "margin-top:12px", id: "wChartBox" }),
      UI.h("div", { id: "wList" })
    );
    return card;
  },

  renderWeightChart() {
    const box = document.getElementById("wChartBox");
    if (!box) return;
    box.innerHTML = "";
    const series = [];
    for (let i = 29; i >= 0; i--) {
      const d = today(); d.setDate(d.getDate() - i);
      const ds = dstr(d);
      const v = Store.weightOf(ds);
      if (v !== null) series.push({ label: ds.slice(5).replace("-", "/"), value: v, date: ds });
    }
    const avg7 = Store.weight7Avg(todayStr());
    const points = series.map(p => ({ label: p.label, value: p.value }));
    const chart = Charts.line({ points, unit: " kg", label: "最近 30 天体重趋势" });
    if (!chart) {
      box.append(UI.empty(series.length ? "只有一个记录" : "暂无体重记录", series.length ? "再记一天就能看到趋势曲线" : "每天花三秒记一下，30 天出趋势"));
      return;
    }
    box.append(UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "最近 30 天体重趋势（kg）"), chart);
    const notes = [];
    if (avg7 !== null) notes.push(`7 日平均 ${avg7} kg（平滑日常波动）`);
    if (series.length >= 2) {
      const d = +(series[series.length - 1].value - series[0].value).toFixed(1);
      notes.push(`区间变化 ${d > 0 ? "+" : ""}${d} kg`);
    }
    if (notes.length) box.append(UI.h("div", { class: "chart-note" }, notes.join(" · ") + "。单次体重受水分和饮食影响，以 7 日均值判断趋势。"));
  },

  renderWeightList() {
    const box = document.getElementById("wList");
    if (!box) return;
    box.innerHTML = "";
    const entries = Object.keys(Store.state.weight).sort().reverse();
    if (!entries.length) { box.append(UI.empty("还没有记录", "输入体重后点「记录」")); return; }
    const list = UI.h("div", {});
    entries.slice(0, 10).forEach((d, i) => {
      const prevD = entries[i + 1];
      const diff = prevD !== undefined ? +(Store.state.weight[d] - Store.state.weight[prevD]).toFixed(1) : null;
      const txt = diff === null ? "—" : (diff > 0 ? `+${diff}` : diff < 0 ? `${diff}` : "±0");
      const cls = diff === null ? "flat" : diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      list.append(UI.h("div", { class: "w-item" },
        UI.h("span", { class: "d" }, d.slice(5).replace("-", "/")),
        UI.h("span", { class: "v" }, `${Store.state.weight[d]} kg`),
        UI.h("span", { class: `delta ${cls}` }, diff === null ? "" : `${txt} kg`),
        UI.h("button", { class: "del", type: "button", "aria-label": "删除该记录", onclick: async () => {
          const ok = await UI.confirmDanger("删除体重记录", `确定删除 ${d} 的记录吗？`, "删除");
          if (!ok) return;
          delete Store.state.weight[d]; Store.save(); this.renderWeightChart(); this.renderWeightList(); UI.toast("已删除");
        } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round" }, UI.h("path", { d: "M18 6L6 18M6 6l12 12" }))))
      );
    });
    box.append(UI.h("div", { class: "sec-title", style: "margin-top:16px" }, UI.h("h2", {}, "体重历史"), UI.h("span", { class: "extra" }, "最近 10 条")), list);
  },

  /* ---- 饮食 ---- */
  dietCard() {
    const ts = todayStr();
    const goal = Store.state.settings.dietGoalKcal;
    const kcal = Store.dietKcal(ts);
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--amber)" }), "饮食记录",
        UI.h("span", { class: "extra" }, goal ? `目标 ${goal} kcal/天` : "未设目标"),
        UI.h("span", {},
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editDietGoal() }, goal ? "修改目标" : "设目标")))
    );
    const rows = UI.h("div", { id: "dietRows" });
    const items = Store.dietOf(ts);
    if (items.length) {
      items.forEach(it => {
        rows.append(UI.h("div", { class: "diet-row" },
          UI.h("span", { class: "meal" }, it.meal),
          UI.h("span", { class: "food" }, it.food),
          UI.h("span", { class: "kcal" }, `${it.kcal} kcal`),
          UI.h("button", { class: "del", type: "button", "aria-label": "删除饮食记录", onclick: () => {
            it.deleted = true; Store.touch(it); Store.save(); this.render(); UI.toast("已删除");
          } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round" }, UI.h("path", { d: "M18 6L6 18M6 6l12 12" })))
        ));
      });
    } else {
      rows.append(UI.empty("今天还没有饮食记录", "热量为手动估算值，仅供趋势参考"));
    }
    card.append(rows);
    const total = UI.h("div", { class: "diet-total" },
      UI.h("span", {}, `今日摄入 ${kcal} kcal`),
      UI.h("span", {}, goal ? (kcal > goal ? `超出 ${kcal - goal}` : `还可 ${goal - kcal}`) : "未设目标"));
    card.append(total);
    const meal = UI.select(MEALS.map(m => ({ value: m, label: m })), "早餐");
    meal.style.maxWidth = "110px";
    const food = UI.input({ placeholder: "食物名称" });
    const kc = UI.input({ type: "number", min: 0, max: 5000, step: 10, placeholder: "kcal" });
    kc.style.maxWidth = "100px";
    const add = () => {
      if (!food.value.trim()) { UI.toast("填写食物名称"); return; }
      const v = parseInt(kc.value || "0", 10);
      if (isNaN(v) || v < 0) { UI.toast("填写正确的热量数值"); return; }
      if (!Store.state.diet[ts]) Store.state.diet[ts] = [];
      Store.state.diet[ts].push({ id: uid(), meal: meal.value, food: food.value.trim(), kcal: v, note: "", createdAt: Date.now(), updatedAt: Date.now(), deleted: false });
      Store.save(); this.render();
      food.value = ""; kc.value = "";
      UI.toast("已记录");
    };
    card.append(UI.h("div", { class: "add-row", style: "margin-top:12px" }, meal, food, kc, UI.h("button", { class: "btn primary", type: "button", onclick: add }, "添加")),
      UI.h("div", { class: "chart-note" }, "热量来自你的手动输入或估算，不是精确测量；建议固定称重或按包装标签填写，保持口径一致。"));
    return card;
  },

  /* ---- 训练历史 ---- */
  historyCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "训练历史", UI.h("span", { class: "extra" }, "最近 14 次"))
    );
    const dates = Object.keys(Store.state.fitness).sort().reverse();
    const list = UI.h("div", { class: "hist" });
    if (!dates.length) {
      list.append(UI.empty("还没有训练记录", "完成今日打卡后这里会出现历史"));
    } else {
      const plan = Store.state.settings.training;
      const total = plan.exercises.reduce((a, e) => a + e.sets, 0);
      dates.slice(0, 14).forEach(d => {
        const rec = Store.state.fitness[d];
        const done = plan.exercises.reduce((a, e) => a + ((rec.checks && rec.checks[e.id] || []).filter(Boolean).length), 0);
        const pct = Math.round(done / total * 100);
        list.append(UI.h("div", { class: "hist-item" },
          UI.h("span", { class: "hist-date" }, `${d.slice(5).replace("-", "/")} ${WEEK_CN[parseDate(d).getDay()]}`),
          UI.h("span", { class: "hist-bar" }, UI.h("i", { style: `width:${pct}%` })),
          UI.h("span", { class: "hist-n" }, `${done}/${total}`),
          rec.rpe ? UI.h("span", { class: "rpe-badge" }, `RPE ${rec.rpe}`) : null,
          rec.note ? UI.h("span", { class: "hist-note" }, rec.note) : null
        ));
      });
    }
    card.append(list);
    return card;
  }
};

      cancelText: "关闭",

                  UI.input({ value: ex.name, placeholder: "动作名称", "data-f": "name", style: "flex:1;min-width:120px" }),

                t.exercises.splice(i, 1);
                Store.save(); draw();
                if (App.curView === "fitness") FitnessView.render();
              } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" })))

  goalsCard() {

    dg.style.maxWidth = "140px";

    dg.addEventListener("change", () => { s.dietGoalKcal = parseInt(dg.value || "0", 10) || 0; Store.save(); if (App.curView === "fitness") FitnessView.render(); UI.toast("已保存"); });
    return UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--violet)" }), "目标"),
