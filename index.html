/* ================= 视图：任务 ================= */
"use strict";

const TasksView = {
  filter: "open",
  filterSubj: "",

  render() {
    const el = document.getElementById("view-tasks");
    el.innerHTML = "";
    el.append(this.addCard(), this.listCard());
    this.renderList();
    this.renderCounts();
  },

  addCard() {
    const inp = UI.input({ placeholder: "任务内容，例如：机械设计第三章作业", required: true, maxlength: 80, id: "taskInp" });
    const subj = UI.select(Store.subjects().map(s => ({ value: s.id, label: s.name })), "", { allLabel: "未分类" });
    const due = UI.input({ type: "date", id: "taskDue", value: todayStr() });
    const pri = UI.select([
      { value: "normal", label: "普通" }, { value: "high", label: "紧急" }, { value: "low", label: "低优" }
    ], "normal");
    const est = UI.input({ type: "number", min: 0, max: 600, step: 5, placeholder: "预计分钟", id: "taskEst" });
    est.style.width = "100px";
    const submit = () => {
      const title = inp.value.trim();
      if (!title) { UI.toast("先输入任务内容"); inp.focus(); return; }
      Store.state.tasks.push(Store.touch({
        id: uid(), title, subjectId: subj.value || null, due: due.value || "",
        priority: pri.value, estMin: parseInt(est.value || "0", 10) || 0,
        done: false, doneAt: null, createdAt: Date.now(), deleted: false
      }));
      Store.save();
      inp.value = ""; est.value = "";
      this.render(); this.renderCounts();
      UI.toast("已添加任务");
      inp.focus();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    return UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar" }), "添加任务", UI.h("span", { class: "extra" }, "回车快速添加")),
      UI.h("div", { class: "add-row" },
        inp, subj, due, pri, est,
        UI.h("button", { class: "btn primary", type: "button", onclick: submit }, "添加"))
    );
  },

  listCard() {
    const card = UI.h("div", { class: "card" });
    const filters = UI.h("div", { class: "filters", id: "taskFilters" },
      ...[
        { f: "open", label: "进行中" }, { f: "today", label: "今天" }, { f: "week", label: "本周" },
        { f: "over", label: "逾期" }, { f: "done", label: "已完成" }, { f: "all", label: "全部" }
      ].map(x => {
        const b = UI.h("button", { class: "chip" + (this.filter === x.f ? " active" : ""), type: "button", "data-f": x.f, "data-label": x.label }, x.label);
        b.addEventListener("click", () => { this.filter = x.f; this.render(); });
        return b;
      }),
      UI.select(
        [{ value: "", label: "全部科目" }].concat(Store.subjects().map(s => ({ value: s.id, label: s.name })), [{ value: "__none", label: "未分类" }]),
        this.filterSubj, {}
      )
    );
    filters.querySelector("select").addEventListener("change", e => { this.filterSubj = e.target.value; this.render(); });
    card.append(UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--coral)" }), "任务列表", UI.h("span", { class: "extra", id: "taskListExtra" })), filters);
    const list = UI.h("div", { class: "task-list", id: "taskList" });
    card.append(list);
    return card;
  },

  renderCounts() {
    const ts = todayStr(), [w0, w1] = weekRange();
    const cnt = f => Store.state.tasks.filter(f).length;
    const nums = {
      open: cnt(t => !t.deleted && !t.done),
      today: cnt(t => !t.deleted && !t.done && t.due && dayDiff(ts, t.due) <= 0),
      week: cnt(t => !t.deleted && !t.done && t.due && t.due >= w0 && t.due <= w1),
      over: cnt(t => !t.deleted && !t.done && t.due && dayDiff(ts, t.due) > 0),
      done: cnt(t => !t.deleted && t.done),
      all: cnt(t => !t.deleted)
    };
    document.querySelectorAll("#taskFilters .chip").forEach(c => {
      const f = c.dataset.f;
      const n = nums[f];
      c.innerHTML = `${esc(c.dataset.label || "")}<span class="n">${n}</span>`;
    });
    // 导航角标：今日待办 + 逾期
    const badge = nums.today + nums.over;
    const navBtn = document.querySelector('.nav-item[data-view="tasks"]');
    let b = navBtn.querySelector(".badge");
    if (badge > 0) {
      if (!b) { b = UI.h("span", { class: "badge" }); navBtn.append(b); }
      b.textContent = badge;
    } else if (b) b.remove();
    const extra = document.getElementById("taskListExtra");
    if (extra) extra.textContent = `共 ${nums.all} 项`;
  },

  renderList() {
    const list = document.getElementById("taskList");
    if (!list) return;
    const ts = todayStr(), [w0, w1] = weekRange();
    let items = Store.state.tasks.filter(t => !t.deleted);
    if (this.filterSubj) items = items.filter(t => this.filterSubj === "__none" ? !t.subjectId : t.subjectId === this.filterSubj);
    if (this.filter === "open") items = items.filter(t => !t.done);
    else if (this.filter === "today") items = items.filter(t => !t.done && t.due && dayDiff(ts, t.due) <= 0);
    else if (this.filter === "week") items = items.filter(t => !t.done && t.due && t.due >= w0 && t.due <= w1);
    else if (this.filter === "over") items = items.filter(t => !t.done && t.due && dayDiff(ts, t.due) > 0);
    else if (this.filter === "done") items = items.filter(t => t.done);
    const pri = { high: 0, normal: 1, low: 2 };
    items.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (!a.done && a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
      if (!a.done && a.due !== b.due) return a.due ? -1 : 1;
      if (!a.done && a.priority !== b.priority) return pri[a.priority] - pri[b.priority];
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    list.innerHTML = "";
    if (!items.length) {
      const msg = this.filter === "done" ? "还没有完成的任务" : this.filter === "open" ? "任务全部清空" : "这个筛选下暂无任务";
      list.append(UI.empty(msg, "换个筛选条件，或在上方添加一个任务"));
      return;
    }
    items.forEach(t => list.append(this.taskRow(t)));
  },

  /* 任务行（compact 用于首页今日重点） */
  taskRow(t, { compact = false } = {}) {
    const row = UI.h("div", { class: "task" + (t.done ? " done" : "") },
      UI.h("button", { class: "t-check" + (t.done ? " on" : ""), type: "button", "aria-label": t.done ? "标记为未完成" : "完成任务", onclick: () => this.toggle(t) },
        UI.h("svg", { viewBox: "0 0 24 24" }, UI.h("polyline", { points: "20 6 9 17 4 12" }))),
      UI.h("div", { class: "body" },
        UI.h("div", { class: "t-title" }, t.title),
        UI.h("div", { class: "t-meta" },
          UI.h("span", { class: "tag " + (t.subjectId ? "tag-subject" : "tag-due") }, Store.subjectName(t.subjectId) || "未分类"),
          t.due ? UI.h("span", { class: `tag tag-due ${dueCls(t.due, t.done)}` }, fmtDue(t.due)) : null,
          t.estMin ? UI.h("span", { class: "tag tag-due" }, `预计 ${fmtMin(t.estMin)}`) : null,
          t.done ? UI.h("span", { class: "tag tag-done" }, "已完成") : UI.h("span", { class: "tag tag-due" }, UI.h("i", { class: `pri-dot pri-${t.priority}` }), PRIORITY_LABEL(t.priority)))
      ),
      UI.h("div", { class: "ops" },
        compact ? null : UI.h("button", { class: "mini-btn", type: "button", title: "编辑", "aria-label": "编辑任务", onclick: () => this.edit(t) },
          UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"}))),
        UI.h("button", { class: "mini-btn danger", type: "button", title: "删除", "aria-label": "删除任务", onclick: () => this.remove(t) },
          UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"}))))
    );
    return row;
  },

  toggle(t) {
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    Store.touch(t);
    Store.save();
    this.render(); this.renderCounts();
    if (App.curView === "today") TodayView.render();
    UI.toast(t.done ? "完成一项 ✓" : "已恢复为进行中");
  },

  async remove(t) {
    const ok = await UI.confirmDanger("删除任务", `确定删除「${t.title}」吗？删除后可在同步场景中通过墓碑机制避免复活，本地将立即移除。`, "确认删除");
    if (!ok) return;
    t.deleted = true; // 软删除，保留墓碑
    Store.touch(t);
    Store.save();
    this.render(); this.renderCounts();
    UI.toast("已删除");
  },

  edit(t) {
    UI.modal({
      title: "编辑任务",
      submitText: "保存",
      body: (box) => {
        const title = UI.input({ value: t.title, required: true });
        const subj = UI.select(Store.subjects().map(s => ({ value: s.id, label: s.name })), t.subjectId || "", { allLabel: "未分类" });
        const due = UI.input({ type: "date", value: t.due || "" });
        const pri = UI.select([{ value: "normal", label: "普通" }, { value: "high", label: "紧急" }, { value: "low", label: "低优" }], t.priority);
        const est = UI.input({ type: "number", min: 0, max: 600, step: 5, value: t.estMin || "" });
        box.append(
          UI.field("任务内容", title),
          UI.field("科目", subj),
          UI.field("截止日期", due, "留空表示无截止日期"),
          UI.field("优先级", pri),
          UI.field("预计时长（分钟）", est, "用于日程规划参考，不影响实际记录")
        );
        box._get = () => ({ title, subj, due, pri, est });
      },
      onSubmit: (box) => {
        const f = box._get;
        if (!f.title.value.trim()) { UI.toast("任务内容不能为空"); return false; }
        t.title = f.title.value.trim();
        t.subjectId = f.subj.value || null;
        t.due = f.due.value;
        t.priority = f.pri.value;
        t.estMin = parseInt(f.est.value || "0", 10) || 0;
        Store.touch(t); Store.save();
        this.render(); this.renderCounts();
        if (App.curView === "today") TodayView.render();
        UI.toast("已保存");
      }
    });
  }
};

            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" }))),
          UI.h("button", { class: "mini-btn danger", type: "button", title: "删除科目", "aria-label": "删除科目", onclick: () => this.removeSubject(s) },
            UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" }))))
      ));
    });
    if (!Store.subjects().length) {
      wrap.append(UI.empty("还没有科目", "点击「+ 新增科目」建立你的第一个学习科目"));
    }
    return card;
  },

  editSubject(s) {
    const isNew = !s;
    UI.modal({
      title: isNew ? "新增科目" : "编辑科目",
      submitText: "保存",
      body: (box) => {
        const name = UI.input({ value: s ? s.name : "", placeholder: "例如：机械设计", required: true, maxlength: 12 });
        const goal = UI.input({ value: s ? s.goal : "", placeholder: "例如：期末 90 分 / 完成三轮复习" });
        const wm = UI.input({ type: "number", min: 0, max: 3000, step: 30, value: s && s.weeklyMin ? s.weeklyMin : "", placeholder: "0" });
        const note = UI.input({ value: s ? s.note : "", placeholder: "备注（可选）" });
        box.append(
          UI.field("科目名称", name),
          UI.field("阶段目标", goal, "长期目标，用于复盘对照"),
          UI.field("每周目标时长（分钟）", wm, "例如 900 = 15 小时；0 表示不设目标"),
          UI.field("备注", note)
        );
        box._get = () => ({ name, goal, wm, note });
      },
      onSubmit: (box) => {
        const f = box._get;
        const n = f.name.value.trim();
        if (!n) { UI.toast("科目名称不能为空"); return false; }
        if (Store.subjects().some(x => x.name === n && (!s || x.id !== s.id))) { UI.toast("科目名称已存在"); return false; }
        if (isNew) {
          Store.state.settings.subjects.push({ id: uid(), name: n, weeklyMin: parseInt(f.wm.value || "0", 10) || 0, goal: f.goal.value.trim(), note: f.note.value.trim() });
        } else {
          s.name = n; s.weeklyMin = parseInt(f.wm.value || "0", 10) || 0; s.goal = f.goal.value.trim(); s.note = f.note.value.trim();
        }
        Store.save();
        this.render();
        TasksView.renderCounts();
        UI.toast(isNew ? "科目已创建" : "已保存");
      }
    });
  },

  async removeSubject(s) {
    const used = Store.state.tasks.filter(t => t.subjectId === s.id && !t.deleted).length;
    const recs = Store.state.study.filter(r => r.subjectId === s.id && !r.deleted).length;
    const ok = await UI.confirmDanger("删除科目",
      `确定删除「${s.name}」吗？\n\n影响：${used} 个任务将变为「未分类」，${recs} 条学习记录会保留但失去科目关联。此操作不可撤销。`, "确认删除");
    if (!ok) return;
    Store.state.settings.subjects = Store.state.settings.subjects.filter(x => x.id !== s.id);
    Store.state.tasks.forEach(t => { if (t.subjectId === s.id) { t.subjectId = null; Store.touch(t); } });
    Store.save();
    this.render(); TasksView.renderCounts();
    UI.toast("已删除科目");
  },

  /* ---- 学习统计 ---- */
  statsCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "学习统计", UI.h("span", { class: "extra" }, "最近 14 天"))
    );
    const grid = UI.h("div", { class: "grid2" });

    // 每日时长柱状图
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = today(); d.setDate(d.getDate() - i); days.push(dstr(d)); }
    const chart = Charts.bars({
      items: days.map(d => ({ label: d.slice(5).replace("-", "/"), value: Store.studyMinutes(d), tip: d })),
      unit: " 分钟", label: "最近 14 天每日学习时长"
    });
    const barsBox = UI.h("div", { class: "chart-box" },
      UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "每日学习时长（分钟）"),
      chart || UI.empty("暂无学习记录", "开始一次专注计时，或手动补记"),
      UI.h("div", { class: "chart-note" }, "悬停柱子查看具体日期与时长")
    );

    // 科目分布 + 连续天数
    const bySub = {};
    Store.state.study.filter(r => !r.deleted).forEach(r => { bySub[r.subjectId || "__none"] = (bySub[r.subjectId || "__none"] || 0) + r.minutes; });
    const items = Object.entries(bySub).map(([k, v]) => ({ name: k === "__none" ? "未分类" : (Store.subjectName(k) || "已删科目"), minutes: v }))
      .sort((a, b) => b.minutes - a.minutes);
    const totalMin = items.reduce((a, b) => a + b.minutes, 0) || 1;
    const distBox = UI.h("div", { class: "chart-box" },
      UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "科目时长分布"),
      items.length ? UI.h("div", { class: "hbars" }, items.map(it => {
        const pct = Math.round(it.minutes / totalMin * 100);
        return UI.h("div", { class: "hbar-row" },
          UI.h("span", { class: "hbar-name" }, it.name),
          UI.h("span", { class: "hbar-track" }, UI.h("span", { class: "hbar-fill", style: `width:${pct}%` })),
          UI.h("span", { class: "hbar-n" }, `${pct}%`));
      })) : UI.empty("暂无数据"),
      UI.h("div", { class: "chart-note" }, `累计 ${fmtMin(totalMin)}`));

    // 连续学习天数
    let streak = 0;
    for (let i = 0; ; i++) {
      const d = today(); d.setDate(d.getDate() - i);
      if (Store.studyMinutes(dstr(d)) > 0) streak++;
      else { if (i === 0) continue; break; }
    }
    const [w0, w1] = weekRange();
    const weekMin = Store.studyMinutesBetween(w0, w1);
    const weekGoal = Store.subjects().reduce((a, s) => a + (s.weeklyMin || 0), 0);
    grid.append(barsBox, distBox);
    card.append(grid,
      UI.h("div", { class: "stat-row", style: "margin-top:14px" },
        UI.stat({ value: `${streak} 天`, label: "连续学习", color: streak > 0 ? "green" : "", sub: "今日未学则中断" }),
        UI.stat({ value: fmtMin(weekMin), label: "本周学习", color: "violet", sub: weekGoal ? `目标 ${fmtMin(weekGoal)}` : "未设总目标" }),
        UI.stat({ value: Store.state.study.filter(r => !r.deleted).length, label: "累计记录", color: "blue", sub: "条学习记录" }))
    );
    return card;
  },

  /* ---- 学习记录 ---- */
  recordsCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--amber)" }), "学习记录",
        UI.h("span", { class: "extra" }, UI.h("button", { class: "btn small", type: "button", onclick: () => this.addRecord() }, "+ 手动补记")))
    );
    const recs = Store.state.study.filter(r => !r.deleted).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0))).slice(0, 20);
    const list = UI.h("div", {});
    if (!recs.length) {
      list.append(UI.empty("还没有学习记录", "用上面的计时器开始第一段学习"));
    } else {
      recs.forEach(r => {
        const task = r.taskId ? Store.taskById(r.taskId) : null;
        list.append(UI.h("div", { class: "study-rec" },
          UI.h("span", { class: "t" }, r.startTime || "--:--"),
          UI.h("div", { class: "body" },
            UI.h("div", { style: "font-weight:700" }, Store.subjectName(r.subjectId) || "未分类"),
            UI.h("div", { style: "font-size:12px;color:var(--ink-3)" }, [r.date, task ? `关联：${task.title}` : null, r.note].filter(Boolean).join(" · "))),
          UI.h("span", { class: "min" }, `${r.minutes} 分钟`),
          UI.h("button", { class: "mini-btn danger", type: "button", title: "删除记录", "aria-label": "删除学习记录", onclick: async () => {
            const ok = await UI.confirmDanger("删除学习记录", `确定删除 ${r.date} 的 ${r.minutes} 分钟记录吗？`, "删除");
            if (!ok) return;
            r.deleted = true; Store.touch(r); Store.save(); this.render(); UI.toast("已删除");
          } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" })))
        ));
      });
    }
    card.append(list);
    return card;
  },

  addRecord() {
    UI.modal({
      title: "手动补记学习",
      submitText: "保存",
      body: (box) => {
        const date = UI.input({ type: "date", value: todayStr() });
        const start = UI.input({ type: "time", value: "09:00" });
        const end = UI.input({ type: "time", value: "10:30" });
        const subj = UI.select(Store.subjects().map(s => ({ value: s.id, label: s.name })), Store.subjects()[0] && Store.subjects()[0].id, { allLabel: "选择科目" });
        const open = Store.openTasks();
        const task = UI.select([{ value: "", label: "不关联任务" }].concat(open.map(t => ({ value: t.id, label: t.title }))), "");
        const note = UI.input({ placeholder: "学习内容（可选）" });
        box.append(
          UI.field("日期", date), UI.field("开始时间", start), UI.field("结束时间", end),
          UI.field("科目", subj), UI.field("关联任务", task), UI.field("备注", note)
        );
        box._get = () => ({ date, start, end, subj, task, note });
      },
      onSubmit: (box) => {
        const f = box._get;
        const minutes = Math.max(0, toMin(f.end.value) - toMin(f.start.value));
        if (!f.date.value || !f.start.value || !f.end.value) { UI.toast("请填写日期与起止时间"); return false; }
        if (minutes <= 0) { UI.toast("结束时间必须晚于开始时间"); return false; }
        if (!f.subj.value) { UI.toast("请选择科目"); return false; }
        Store.state.study.push({
          id: uid(), subjectId: f.subj.value, taskId: f.task.value || null,
          date: f.date.value, startTime: f.start.value, minutes,
          note: f.note.value.trim(), createdAt: Date.now(), updatedAt: Date.now(), deleted: false
        });
        Store.save(); this.render(); UI.toast(`已记录 ${minutes} 分钟`);
      }
    });
  }
};


/* ================= src/js/views/fitness.js ================= */
/* ================= 视图：健身与增重 ================= */
"use strict";

const FitnessView = {
  render() {
    const el = document.getElementById("view-fitness");
    el.innerHTML = "";
    el.append(
      this.banner(),
      this.statsRow(),
      this.todayCard(),
      this.weightCard(),
      this.dietCard(),
      this.historyCard()
    );
    // 卡片已挂载到文档，再渲染依赖 DOM 的图表与列表
    this.renderWeightChart();
    this.renderWeightList();
  },

  banner() {
    const dow = today().getDay();
    const isPlan = Store.state.settings.training.planDays.includes(dow);
    return UI.h("div", { class: "card fit-banner " + (isPlan ? "on" : "off") },
      UI.h("div", { class: "icon" },
        UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("path", { d: "M6.5 6.5h11v11h-11z" }), UI.h("path", { d: "M2 9v6M22 9v6M6.5 2v4M17.5 2v4M6.5 18v4M17.5 18v4" }))),
      UI.h("div", {},
        UI.h("h3", {}, isPlan ? "今天是训练日" : "今天不是计划训练日"),
        UI.h("p", {}, isPlan ? `${WEEK_CN[dow]} · 按计划完成今日动作` : "休息日，好好恢复；也可以主动补练")),
      UI.h("div", { class: "rule", style: "margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink-2);font-weight:600" },
        `每周 ${Store.state.settings.training.planDays.map(d => WEEK_CN[d]).join(" / ")}`, UI.h("br"),
        `${Store.state.settings.training.exercises.length} 个动作`)
    );
  },

  statsRow() {
    const [w0, w1] = weekRange();
    const monthPrefix = todayStr().slice(0, 7);
    const monthFit = Object.keys(Store.state.fitness).filter(d => d.startsWith(monthPrefix)).length;
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    const dates = Object.keys(Store.state.fitness).sort();
    let best = 0, cur = 0;
    dates.forEach((d, i) => {
      if (i === 0) cur = 1;
      else {
        const p = new Date(d); p.setDate(p.getDate() - 1);
        cur = Store.state.fitness[dstr(p)] ? cur + 1 : 1;
      }
      best = Math.max(best, cur);
    });
    let streak = 0;
    for (let i = 0; ; i++) {
      const d = today(); d.setDate(d.getDate() - i);
      if (Store.state.fitness[dstr(d)]) streak++;
      else { if (i === 0) continue; break; }
    }
    return UI.h("div", { class: "stat-row", style: "margin-bottom:16px" },
      UI.stat({ value: monthFit, label: "本月训练", color: "blue", sub: "天" }),
      UI.stat({ value: weekFit, label: "本周训练", color: "coral", sub: `计划 ${Store.state.settings.training.planDays.length} 次` }),
      UI.stat({ value: `${streak} 天`, label: "当前连续", color: streak ? "green" : "" }),
      UI.stat({ value: `${best} 天`, label: "最长连续", color: "violet" })
    );
  },

  /* ---- 今日训练打卡 ---- */
  todayCard() {
    const ts = todayStr();
    const plan = Store.state.settings.training;
    const rec = Store.state.fitness[ts] || { checks: {} };
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--coral)" }), "今日训练",
        UI.h("span", { class: "extra" },
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editTraining() }, "编辑训练计划")))
    );
    const grid = UI.h("div", { class: "ex-grid" });
    const totalSets = plan.exercises.reduce((a, e) => a + e.sets, 0);
    let doneSets = 0;
    plan.exercises.forEach((ex, i) => {
      const checks = rec.checks && rec.checks[ex.id] || [];
      const n = checks.filter(Boolean).length;
      doneSets += n;
      const allDone = n === ex.sets;
      grid.append(UI.h("div", { class: "ex" + (allDone ? " all-done" : "") },
        UI.h("div", { class: "ex-head" },
          UI.h("span", { class: "ex-num" }, String(i + 1)),
          UI.h("span", { class: "ex-name" }, ex.name),
          UI.h("span", { class: "ex-part" }, ex.part)),
        UI.h("div", { class: "ex-target" }, `${ex.sets} 组 × ${ex.reps}`),
        ex.tip ? UI.h("div", { class: "ex-tip" }, ex.tip) : null,
        UI.h("div", { class: "sets" },
          Array.from({ length: ex.sets }, (_, s) => UI.h("button", {
            class: "set-btn" + (checks[s] ? " on" : ""), type: "button",
            "aria-label": `${ex.name} 第 ${s + 1} 组`, "aria-pressed": checks[s] ? "true" : "false",
            onclick: () => this.toggleSet(ex.id, s, ex.sets)
          }, String(s + 1))),
          UI.h("span", { class: "lbl" }, "组"))
      ));
    });
    card.append(grid);

    // RPE + 备注
    const rpe = UI.select(Array.from({ length: 10 }, (_, i) => ({ value: String(i + 1), label: `${i + 1}${i === 0 ? "（很轻松）" : i === 8 ? "（很吃力）" : i === 9 ? "（极限）" : ""}` })), String(rec.rpe || ""), { allLabel: "主观难度（可选）" });
    rpe.style.maxWidth = "180px";
    const note = UI.h("textarea", { class: "inp", placeholder: "训练备注：重量、状态、感受……", id: "fitNote" });
    note.value = rec.note || "";
    rpe.addEventListener("change", () => { this.saveToday({ rpe: rpe.value }); });
    note.addEventListener("input", () => {
      clearTimeout(note._tm);
      note._tm = setTimeout(() => this.saveToday({ note: note.value }), 500);
    });
    card.append(
      UI.h("div", { class: "row", style: "margin-top:14px" }, rpe),
      note,
      UI.h("div", { class: "rest-tip" },
        UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round" }, UI.h("circle", { cx: "12", cy: "12", r: "10" }), UI.h("polyline", { points: "12 6 12 12 16 14" })),
        `每组之间休息 ${plan.restSec} 秒；单臂动作左右交替，左右各一次合计为一次`),
      UI.h("div", { style: "font-size:12.5px;color:var(--ink-3);margin-top:10px" }, `今日进度：${doneSets} / ${totalSets} 组`)
    );
    return card;
  },

  toggleSet(exId, idx, sets) {
    const ts = todayStr();
    if (!Store.state.fitness[ts]) Store.state.fitness[ts] = { checks: {}, note: "", rpe: "" };
    const rec = Store.state.fitness[ts];
    if (!rec.checks[exId]) rec.checks[exId] = Array(sets).fill(false);
    rec.checks[exId][idx] = !rec.checks[exId][idx];
    rec.updatedAt = Date.now();
    Store.save();
    this.render();
    const plan = Store.state.settings.training;
    const total = plan.exercises.reduce((a, e) => a + e.sets, 0);
    const done = plan.exercises.reduce((a, e) => a + ((rec.checks[e.id] || []).filter(Boolean).length), 0);
    if (done === total) UI.toast("今日训练全部完成 💪");
  },

  saveToday(patch) {
    const ts = todayStr();
    if (!Store.state.fitness[ts]) Store.state.fitness[ts] = { checks: {}, note: "", rpe: "" };
    Object.assign(Store.state.fitness[ts], patch, { updatedAt: Date.now() });
    Store.save();
  },

  /* ---- 体重 ---- */
  weightCard() {
    const ts = todayStr();
    const cur = Store.weightOf(ts);
    const goal = Store.state.settings.weightGoal;
    const avg7 = Store.weight7Avg(ts);
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "每日体重",
        UI.h("span", { class: "extra" }, goal ? `目标 ${goal} kg` : "未设目标"),
        UI.h("span", {},
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editWeightGoal() }, goal ? "修改目标" : "设目标")))
    );
    const inp = UI.input({ type: "number", step: "0.1", min: "30", max: "200", placeholder: "0.0", value: cur === null ? "" : cur, id: "wInp" });
    inp.style.maxWidth = "130px";
    const add = () => {
      const v = parseFloat(inp.value);
      if (isNaN(v) || v < 30 || v > 200) { UI.toast("请输入 30–200 之间的体重（kg）"); return; }
      Store.state.weight[ts] = +v.toFixed(1);
      Store.save(); this.render();
      UI.toast("体重已记录");
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    const y = new Date(today()); y.setDate(y.getDate() - 1);
    const prev = Store.weightOf(dstr(y));
    let deltaTxt = "", deltaCls = "flat";
    if (cur !== null && prev !== null && cur !== prev) {
      const d = +(cur - prev).toFixed(1);
      deltaTxt = `较昨日 ${d > 0 ? "+" : ""}${d} kg`;
      deltaCls = d > 0 ? "up" : d < 0 ? "down" : "flat";
    } else if (cur !== null) deltaTxt = "今日已记录";
    card.append(
      UI.h("div", { class: "row" }, inp, UI.h("span", { style: "font-weight:700;color:var(--ink-2)" }, "kg"),
        UI.h("button", { class: "btn primary", type: "button", onclick: add }, "记录"),
        UI.h("span", { class: `delta ${deltaCls}`, style: "margin-left:auto;font-weight:700;font-size:13px" }, deltaTxt)),
      UI.h("div", { class: "chart-box", style: "margin-top:12px", id: "wChartBox" }),
      UI.h("div", { id: "wList" })
    );
    return card;
  },

  renderWeightChart() {
    const box = document.getElementById("wChartBox");
    if (!box) return;
    box.innerHTML = "";
    const series = [];
    for (let i = 29; i >= 0; i--) {
      const d = today(); d.setDate(d.getDate() - i);
      const ds = dstr(d);
      const v = Store.weightOf(ds);
      if (v !== null) series.push({ label: ds.slice(5).replace("-", "/"), value: v, date: ds });
    }
    const avg7 = Store.weight7Avg(todayStr());
    const points = series.map(p => ({ label: p.label, value: p.value }));
    const chart = Charts.line({ points, unit: " kg", label: "最近 30 天体重趋势" });
    if (!chart) {
      box.append(UI.empty(series.length ? "只有一个记录" : "暂无体重记录", series.length ? "再记一天就能看到趋势曲线" : "每天花三秒记一下，30 天出趋势"));
      return;
    }
    box.append(UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "最近 30 天体重趋势（kg）"), chart);
    const notes = [];
    if (avg7 !== null) notes.push(`7 日平均 ${avg7} kg（平滑日常波动）`);
    if (series.length >= 2) {
      const d = +(series[series.length - 1].value - series[0].value).toFixed(1);
      notes.push(`区间变化 ${d > 0 ? "+" : ""}${d} kg`);
    }
    if (notes.length) box.append(UI.h("div", { class: "chart-note" }, notes.join(" · ") + "。单次体重受水分和饮食影响，以 7 日均值判断趋势。"));
  },

  renderWeightList() {
    const box = document.getElementById("wList");
    if (!box) return;
    box.innerHTML = "";
    const entries = Object.keys(Store.state.weight).sort().reverse();
    if (!entries.length) { box.append(UI.empty("还没有记录", "输入体重后点「记录」")); return; }
    const list = UI.h("div", {});
    entries.slice(0, 10).forEach((d, i) => {
      const prevD = entries[i + 1];
      const diff = prevD !== undefined ? +(Store.state.weight[d] - Store.state.weight[prevD]).toFixed(1) : null;
      const txt = diff === null ? "—" : (diff > 0 ? `+${diff}` : diff < 0 ? `${diff}` : "±0");
      const cls = diff === null ? "flat" : diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      list.append(UI.h("div", { class: "w-item" },
        UI.h("span", { class: "d" }, d.slice(5).replace("-", "/")),
        UI.h("span", { class: "v" }, `${Store.state.weight[d]} kg`),
        UI.h("span", { class: `delta ${cls}` }, diff === null ? "" : `${txt} kg`),
        UI.h("button", { class: "del", type: "button", "aria-label": "删除该记录", onclick: async () => {
          const ok = await UI.confirmDanger("删除体重记录", `确定删除 ${d} 的记录吗？`, "删除");
          if (!ok) return;
          delete Store.state.weight[d]; Store.save(); this.renderWeightChart(); this.renderWeightList(); UI.toast("已删除");
        } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round" }, UI.h("path", { d: "M18 6L6 18M6 6l12 12" }))))
      );
    });
    box.append(UI.h("div", { class: "sec-title", style: "margin-top:16px" }, UI.h("h2", {}, "体重历史"), UI.h("span", { class: "extra" }, "最近 10 条")), list);
  },

  /* ---- 饮食 ---- */
  dietCard() {
    const ts = todayStr();
    const goal = Store.state.settings.dietGoalKcal;
    const kcal = Store.dietKcal(ts);
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--amber)" }), "饮食记录",
        UI.h("span", { class: "extra" }, goal ? `目标 ${goal} kcal/天` : "未设目标"),
        UI.h("span", {},
          UI.h("button", { class: "btn small", type: "button", onclick: () => SettingsView.editDietGoal() }, goal ? "修改目标" : "设目标")))
    );
    const rows = UI.h("div", { id: "dietRows" });
    const items = Store.dietOf(ts);
    if (items.length) {
      items.forEach(it => {
        rows.append(UI.h("div", { class: "diet-row" },
          UI.h("span", { class: "meal" }, it.meal),
          UI.h("span", { class: "food" }, it.food),
          UI.h("span", { class: "kcal" }, `${it.kcal} kcal`),
          UI.h("button", { class: "del", type: "button", "aria-label": "删除饮食记录", onclick: () => {
            it.deleted = true; Store.touch(it); Store.save(); this.render(); UI.toast("已删除");
          } }, UI.h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.4", "stroke-linecap": "round" }, UI.h("path", { d: "M18 6L6 18M6 6l12 12" })))
        ));
      });
    } else {
      rows.append(UI.empty("今天还没有饮食记录", "热量为手动估算值，仅供趋势参考"));
    }
    card.append(rows);
    const total = UI.h("div", { class: "diet-total" },
      UI.h("span", {}, `今日摄入 ${kcal} kcal`),
      UI.h("span", {}, goal ? (kcal > goal ? `超出 ${kcal - goal}` : `还可 ${goal - kcal}`) : "未设目标"));
    card.append(total);
    const meal = UI.select(MEALS.map(m => ({ value: m, label: m })), "早餐");
    meal.style.maxWidth = "110px";
    const food = UI.input({ placeholder: "食物名称" });
    const kc = UI.input({ type: "number", min: 0, max: 5000, step: 10, placeholder: "kcal" });
    kc.style.maxWidth = "100px";
    const add = () => {
      if (!food.value.trim()) { UI.toast("填写食物名称"); return; }
      const v = parseInt(kc.value || "0", 10);
      if (isNaN(v) || v < 0) { UI.toast("填写正确的热量数值"); return; }
      if (!Store.state.diet[ts]) Store.state.diet[ts] = [];
      Store.state.diet[ts].push({ id: uid(), meal: meal.value, food: food.value.trim(), kcal: v, note: "", createdAt: Date.now(), updatedAt: Date.now(), deleted: false });
      Store.save(); this.render();
      food.value = ""; kc.value = "";
      UI.toast("已记录");
    };
    card.append(UI.h("div", { class: "add-row", style: "margin-top:12px" }, meal, food, kc, UI.h("button", { class: "btn primary", type: "button", onclick: add }, "添加")),
      UI.h("div", { class: "chart-note" }, "热量来自你的手动输入或估算，不是精确测量；建议固定称重或按包装标签填写，保持口径一致。"));
    return card;
  },

  /* ---- 训练历史 ---- */
  historyCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "训练历史", UI.h("span", { class: "extra" }, "最近 14 次"))
    );
    const dates = Object.keys(Store.state.fitness).sort().reverse();
    const list = UI.h("div", { class: "hist" });
    if (!dates.length) {
      list.append(UI.empty("还没有训练记录", "完成今日打卡后这里会出现历史"));
    } else {
      const plan = Store.state.settings.training;
      const total = plan.exercises.reduce((a, e) => a + e.sets, 0);
      dates.slice(0, 14).forEach(d => {
        const rec = Store.state.fitness[d];
        const done = plan.exercises.reduce((a, e) => a + ((rec.checks && rec.checks[e.id] || []).filter(Boolean).length), 0);
        const pct = Math.round(done / total * 100);
        list.append(UI.h("div", { class: "hist-item" },
          UI.h("span", { class: "hist-date" }, `${d.slice(5).replace("-", "/")} ${WEEK_CN[parseDate(d).getDay()]}`),
          UI.h("span", { class: "hist-bar" }, UI.h("i", { style: `width:${pct}%` })),
          UI.h("span", { class: "hist-n" }, `${done}/${total}`),
          rec.rpe ? UI.h("span", { class: "rpe-badge" }, `RPE ${rec.rpe}`) : null,
          rec.note ? UI.h("span", { class: "hist-note" }, rec.note) : null
        ));
      });
    }
    card.append(list);
    return card;
  }
};


/* ================= src/js/views/schedule.js ================= */
/* ================= 视图：日程 ================= */
"use strict";

const ScheduleView = {
  mode: "day",        // day | week
  dayOffset: 0,       // 相对今天的天数

  curDate() { const d = today(); d.setDate(d.getDate() + this.dayOffset); return dstr(d); },

  render() {
    const el = document.getElementById("view-schedule");
    el.innerHTML = "";
    el.append(this.toolbar(), this.mode === "day" ? this.dayView() : this.weekView(), this.unscheduledCard());
    if (this.mode === "day") this.renderDayBlocks();
  },

  toolbar() {
    const d = parseDate(this.curDate());
    const label = this.dayOffset === 0 ? "今天" : this.dayOffset === 1 ? "明天" : this.dayOffset === -1 ? "昨天" :
      `${d.getMonth() + 1}月${d.getDate()}日 ${WEEK_CN[d.getDay()]}`;
    return UI.h("div", { class: "card" },
      UI.h("div", { class: "row", style: "justify-content:space-between" },
        UI.h("div", { class: "row" },
          UI.h("button", { class: "btn small", type: "button", "aria-label": "前一天", onclick: () => { this.dayOffset--; this.render(); } }, "←"),
          UI.h("strong", { style: "font-size:15px;min-width:110px;text-align:center" }, label),
          UI.h("button", { class: "btn small", type: "button", "aria-label": "后一天", onclick: () => { this.dayOffset++; this.render(); } }, "→"),
          this.dayOffset !== 0 ? UI.h("button", { class: "btn small ghost", type: "button", onclick: () => { this.dayOffset = 0; this.render(); } }, "回到今天") : null),
        UI.h("div", { class: "row" },
          UI.h("button", { class: "chip" + (this.mode === "day" ? " active" : ""), type: "button", onclick: () => { this.mode = "day"; this.render(); } }, "日视图"),
          UI.h("button", { class: "chip" + (this.mode === "week" ? " active" : ""), type: "button", onclick: () => { this.mode = "week"; this.render(); } }, "周视图"),
          UI.h("button", { class: "btn primary small", type: "button", onclick: () => this.editBlock(null) }, "+ 新建时间块"))
      )
    );
  },

  /* ---- 日视图：时间网格 ---- */
  dayView() {
    return UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--blue)" }), "时间安排", UI.h("span", { class: "extra", id: "dayBlockCount" })),
      UI.h("div", { class: "sched-day" }, UI.h("div", { class: "sched-hours", id: "schedHours" }))
    );
  },

  renderDayBlocks() {
    const wrap = document.getElementById("schedHours");
    if (!wrap) return;
    const ds = this.curDate();
    const blocks = Store.blocksOf(ds);
    const count = document.getElementById("dayBlockCount");
    if (count) count.textContent = `${blocks.length} 个时间块`;
    // 小时刻度 6:00 - 24:00
    wrap.innerHTML = "";
    for (let h = 6; h <= 23; h++) {
      wrap.append(UI.h("div", { class: "sched-hour" }, UI.h("span", { class: "lab" }, `${pad(h)}:00`)));
    }
    const conflicts = this.findConflicts(blocks);
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    const isToday = ds === todayStr();
    blocks.forEach(b => {
      const startM = toMin(b.start), endM = Math.max(toMin(b.end), startM + 15);
      const top = (startM - 6 * 60) / (18 * 60) * 100;
      const height = Math.max(4, (endM - startM) / (18 * 60) * 100);
      const el = UI.h("div", {
        class: `sched-block type-${b.type}` + (b.done ? " done" : ""),
        style: `top:${top}%;height:${height}%`,
        role: "button", tabindex: "0",
        "aria-label": `${b.title}，${b.start} 到 ${b.end}`,
        onclick: () => this.editBlock(b),
        onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.editBlock(b); } }
      },
      UI.h("div", { class: "t" }, b.done ? UI.h("s", {}, b.title) : UI.h("span", {}, b.title), UI.h("span", { class: `tag tag-type-${b.type}` }, BLOCK_TYPE_LABEL(b.type))),
      UI.h("div", { class: "s" }, `${b.start}–${b.end}${isToday && nowMin >= startM && nowMin < endM ? " · 进行中" : ""}`)
      );
      if (conflicts.has(b.id)) {
        el.append(UI.h("span", { class: "conflict-flag", title: "与其他时间块重叠" }, "⚠"));
      }
      wrap.append(el);
    });
  },

  /* 冲突检测：同一时间段重叠 */
  findConflicts(blocks) {
    const set = new Set();
    const sorted = blocks.slice().sort((a, b) => toMin(a.start) - toMin(b.start));
    for (let i = 0; i < sorted.length; i++) {
      for (let j = i + 1; j < sorted.length; j++) {
        if (toMin(sorted[j].start) < toMin(sorted[i].end)) { set.add(sorted[i].id); set.add(sorted[j].id); }
        else break;
      }
    }
    return set;
  },

  /* ---- 周视图 ---- */
  weekView() {
    const [w0, w1] = weekRange();
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "本周安排",
        UI.h("span", { class: "extra" }, `${w0.slice(5).replace("-", "/")} – ${w1.slice(5).replace("-", "/")}`))
    );
    const grid = UI.h("div", { class: "sched-week" });
    for (let i = 0; i < 7; i++) {
      const d = parseDate(w0); d.setDate(d.getDate() + i);
      const ds = dstr(d);
      const col = UI.h("div", { class: "sched-wcol" + (ds === todayStr() ? " today" : "") },
        UI.h("div", { class: "head" }, `${WEEK_SHORT[d.getDay()]} ${d.getDate()}`));
      const blocks = Store.blocksOf(ds);
      if (!blocks.length) col.append(UI.h("div", { style: "font-size:10.5px;color:var(--ink-3);text-align:center;padding:8px 0" }, "—"));
      blocks.forEach(b => {
        col.append(UI.h("div", {
          class: `sched-wblock type-${b.type}` + (b.done ? " done" : ""),
          role: "button", tabindex: "0", title: `${b.title} ${b.start}–${b.end}（点击编辑）`,
          onclick: () => { this.dayOffset = dayDiff(todayStr(), ds); this.mode = "day"; this.render(); setTimeout(() => this.editBlock(b), 50); },
          onkeydown: e => { if (e.key === "Enter") e.target.click(); }
        },
        UI.h("div", { class: "bt" }, b.title),
        UI.h("div", { class: "bs" }, `${b.start}–${b.end}`)));
      });
      grid.append(col);
    }
    card.append(grid);
    return card;
  },

  /* ---- 未安排任务 ---- */
  unscheduledCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--amber)" }), "未安排时间的任务", UI.h("span", { class: "extra" }, "把任务排进时间轴"))
    );
    const scheduledIds = new Set(Store.state.blocks.filter(b => !b.deleted && b.taskId).map(b => b.taskId));
    const unscheduled = Store.openTasks().filter(t => !scheduledIds.has(t.id));
    if (!unscheduled.length) {
      card.append(UI.empty("所有任务都已安排或暂无待办", "新建任务后可从这里排入日程"));
      return card;
    }
    const list = UI.h("div", { class: "task-list" });
    unscheduled.slice(0, 8).forEach(t => {
      list.append(UI.h("div", { class: "task" },
        UI.h("div", { class: "body" },
          UI.h("div", { class: "t-title" }, t.title),
          UI.h("div", { class: "t-meta" },
            UI.h("span", { class: "tag " + (t.subjectId ? "tag-subject" : "tag-due") }, Store.subjectName(t.subjectId) || "未分类"),
            t.due ? UI.h("span", { class: `tag tag-due ${dueCls(t.due, false)}` }, fmtDue(t.due)) : null,
            t.estMin ? UI.h("span", { class: "tag tag-due" }, `预计 ${fmtMin(t.estMin)}`) : null)),
        UI.h("div", { class: "ops" },
          UI.h("button", { class: "btn small", type: "button", onclick: () => this.editBlock(null, t) }, "安排时间")))
      );
    });
    card.append(list);
    return card;
  },

  /* ---- 新建 / 编辑时间块 ---- */
  editBlock(b, presetTask) {
    const isNew = !b;
    const ds = b ? b.date : this.curDate();
    UI.modal({
      title: isNew ? "新建时间块" : "编辑时间块",
      submitText: "保存",
      body: (box) => {
        const title = UI.input({ value: b ? b.title : (presetTask ? presetTask.title : ""), placeholder: "标题，例如：高数复习", required: true });
        const type = UI.select(BLOCK_TYPES.map(x => ({ value: x.id, label: x.name })), b ? b.type : (presetTask ? "study" : "study"));
        const date = UI.input({ type: "date", value: ds });
        const start = UI.input({ type: "time", value: b ? b.start : "09:00" });
        const end = UI.input({ type: "time", value: b ? b.end : "10:30" });
        const open = Store.openTasks();
        const taskSel = UI.select(
          [{ value: "", label: "不关联任务" }].concat(open.map(t => ({ value: t.id, label: t.title }))),
          b ? (b.taskId || "") : (presetTask ? presetTask.id : "")
        );
        const done = UI.h("input", { type: "checkbox" });
        done.checked = b ? !!b.done : false;
        done.style.width = "18px"; done.style.height = "18px";
        box.append(
          UI.field("标题", title),
          UI.field("类型", type),
          UI.field("日期", date),
          UI.h("div", { class: "row" }, UI.h("div", { class: "grow" }, UI.field("开始时间", start)), UI.h("div", { class: "grow" }, UI.field("结束时间", end))),
          UI.field("关联任务", taskSel, "关联后，完成时间块不会自动完成任务，需在任务列表中确认"),
          UI.h("div", { class: "field" }, UI.h("label", { class: "field-label" }, "已完成"), done)
        );
        box._get = () => ({ title, type, date, start, end, taskSel, done });
      },
      onSubmit: (box, close) => {
        const f = box._get;
        if (!f.title.value.trim()) { UI.toast("标题不能为空"); return false; }
        if (!f.date.value || !f.start.value || !f.end.value) { UI.toast("请填写日期与起止时间"); return false; }
        if (toMin(f.end.value) <= toMin(f.start.value)) { UI.toast("结束时间必须晚于开始时间"); return false; }
        const rec = {
          id: isNew ? uid() : b.id,
          title: f.title.value.trim(),
          type: f.type.value,
          date: f.date.value,
          start: f.start.value,
          end: f.end.value,
          taskId: f.taskSel.value || null,
          done: f.done.checked,
          createdAt: isNew ? Date.now() : b.createdAt,
          updatedAt: Date.now(),
          deleted: false
        };
        // 冲突提醒（允许用户确认后保留）
        const others = Store.blocksOf(rec.date).filter(x => x.id !== rec.id);
        const conflict = others.some(x => toMin(x.start) < toMin(rec.end) && toMin(rec.start) < toMin(x.end));
        const save = () => {
          if (isNew) Store.state.blocks.push(rec);
          else Object.assign(b, rec);
          Store.save();
          this.render();
          if (App.curView === "today") TodayView.render();
          UI.toast(isNew ? "时间块已创建" : "已保存");
        };
        if (conflict) {
          UI.modal({
            title: "时间重叠提醒",
            body: el => el.append(UI.h("p", { class: "modal-text" }, `「${rec.title}」（${rec.start}–${rec.end}）与当天其他时间块重叠。如果是有意安排的（例如边听音频边刷题），可以保留；否则请返回修改。`)),
            submitText: "仍然保存",
            onSubmit: () => save()
          });
          // 关闭当前编辑框，保留冲突确认框
          setTimeout(() => close(), 0);
          return;
        }
        save();
      }
    });
    if (!isNew) {
      // 删除入口
      const dlg = document.querySelector("dialog.modal");
      if (dlg) {
        const del = UI.h("button", { class: "btn danger", type: "button", style: "margin-right:auto" }, "删除时间块");
        del.addEventListener("click", async () => {
          const ok = await UI.confirmDanger("删除时间块", `确定删除「${b.title}」吗？关联的任务不会被删除。`, "删除");
          if (!ok) return;
          b.deleted = true; Store.touch(b); Store.save();
          document.querySelectorAll("dialog.modal").forEach(d => d.remove());
          this.render();
          if (App.curView === "today") TodayView.render();
          UI.toast("已删除");
        });
        dlg.querySelector(".modal-actions").prepend(del);
      }
    }
  }
};

"use strict";

const ReviewView = {
  render() {
    const el = document.getElementById("view-review");

    el.append(
      this.dailyCard(),
      this.weeklyCard(),
      this.historyCard()
    );
  },

  /* ---- 每日复盘 ---- */
  dailyCard() {
    const ts = todayStr();
    const rec = Store.reviewOf(ts) || {};
    const studyMin = Store.studyMinutes(ts);
    const fitRec = Store.state.fitness[ts];
    const plan = Store.state.settings.training;
    let fitTxt = "未训练";
    if (fitRec) {
      const total = plan.exercises.reduce((a, e) => a + e.sets, 0);
      const done = plan.exercises.reduce((a, e) => a + ((fitRec.checks && fitRec.checks[e.id] || []).filter(Boolean).length), 0);
      fitTxt = `训练 ${done}/${total} 组${fitRec.rpe ? ` · RPE ${fitRec.rpe}` : ""}`;
    }
    const doneTasks = Store.state.tasks.filter(t => t.done && t.doneAt && dstr(new Date(t.doneAt)) === ts);

    const card = UI.h("div", { class: "card" },

        UI.h("span", { class: "extra" }, `${today().getMonth() + 1}月${today().getDate()}日 ${WEEK_CN[today().getDay()]}`))
    );

    // 自动汇总的真实数据
    card.append(UI.h("div", { class: "chart-box", style: "margin-bottom:14px" },
      UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "今日真实数据"),
      UI.h("div", { style: "font-size:13px;line-height:1.9;color:var(--ink-2)" },
        `完成关键任务 ${doneTasks.length} 项${doneTasks.length ? "：" + doneTasks.slice(0, 3).map(t => t.title).join("；") : ""}`, UI.h("br"),
        `实际学习时长：${fmtMin(studyMin)}`, UI.h("br"),
        `训练完成情况：${fitTxt}`, UI.h("br"),
        `今日体重记录：${Store.weightOf(ts) === null ? "未记录" : Store.weightOf(ts) + " kg"}`),
      UI.h("button", { class: "btn small", type: "button", style: "margin-top:8px", onclick: () => this.draftDaily() }, "根据数据生成草稿")));

    const mk = (label, key, ph) => {
      const ta = UI.h("textarea", { placeholder: ph, "data-key": key });
      ta.value = rec[key] || "";
      ta.addEventListener("input", () => {
        clearTimeout(ta._tm);
        ta._tm = setTimeout(() => {
          const ts2 = todayStr();
          if (!Store.state.reviews[ts2]) Store.state.reviews[ts2] = { updatedAt: 0 };
          Store.state.reviews[ts2][key] = ta.value;
          Store.state.reviews[ts2].updatedAt = Date.now();
          Store.save();
        }, 600);
      });
      return UI.h("div", { class: "review-field" }, UI.h("label", {}, label), ta);
    };
    card.append(
      mk("今日进展", "progress", "今天实际推进了什么事？"),
      mk("遇到的问题", "problems", "什么让你卡住或低效？"),
      mk("明日最重要的事", "tomorrow", "明天第一件要解决的事")
    );
    return card;
  },

  /* 根据真实数据生成初稿（可编辑，不覆盖手写内容由用户确认） */
  draftDaily() {
    const ts = todayStr();
    const rec = Store.reviewOf(ts) || {};
    const studyMin = Store.studyMinutes(ts);
    const doneTasks = Store.state.tasks.filter(t => t.done && t.doneAt && dstr(new Date(t.doneAt)) === ts);
    const overdue = Store.openTasks().filter(t => t.due && dayDiff(ts, t.due) > 0);
    const fitRec = Store.state.fitness[ts];
    const progress = [
      doneTasks.length ? `完成任务：${doneTasks.slice(0, 3).map(t => t.title).join("；")}` : "今日无已完成任务",
      studyMin ? `学习 ${fmtMin(studyMin)}` : "今日无学习记录",
      fitRec ? "完成训练打卡" : null,
      Store.weightOf(ts) !== null ? `记录体重 ${Store.weightOf(ts)} kg` : null
    ].filter(Boolean).join("；") + "。";
    const problems = overdue.length ? `有 ${overdue.length} 项任务已逾期，需要重新安排或取舍。` : "（根据数据未发现明显问题，请手动补充）";
    const top = Store.openTasks().sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : 1)[0];
    const tomorrow = top ? `优先处理：${top.title}${top.due ? `（${fmtDue(top.due)}）` : ""}` : "暂无待办，可主动推进阶段目标";
    UI.modal({
      title: "根据数据生成复盘草稿",
      submitText: "填入表单",
      body: el => el.append(
        UI.h("p", { class: "modal-text", style: "margin-bottom:12px" }, "以下内容根据今日真实记录生成，仅作初稿，你可以在表单中继续修改。"),
        UI.h("div", { class: "review-field" }, UI.h("label", {}, "今日进展"), UI.h("div", { style: "font-size:13px;color:var(--ink-2);white-space:pre-wrap" }, progress)),
        UI.h("div", { class: "review-field" }, UI.h("label", {}, "遇到的问题"), UI.h("div", { style: "font-size:13px;color:var(--ink-2);white-space:pre-wrap" }, problems)),
        UI.h("div", { class: "review-field" }, UI.h("label", {}, "明日最重要的事"), UI.h("div", { style: "font-size:13px;color:var(--ink-2);white-space:pre-wrap" }, tomorrow))),
      onSubmit: () => {
        if (!Store.state.reviews[ts]) Store.state.reviews[ts] = { updatedAt: 0 };
        Store.state.reviews[ts].progress = rec.progress ? rec.progress + "\n" + progress : progress;
        Store.state.reviews[ts].problems = rec.problems ? rec.problems : problems;
        Store.state.reviews[ts].tomorrow = rec.tomorrow ? rec.tomorrow : tomorrow;
        Store.state.reviews[ts].updatedAt = Date.now();
        Store.save(); this.render();
        UI.toast("已填入，可继续编辑");
      }
    });
  },

  /* ---- 每周复盘 ---- */
  weeklyCard() {
    const [w0, w1] = weekRange();
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" },
        UI.h("span", { class: "bar", style: "background:var(--violet)" }), "本周复盘",
        UI.h("span", { class: "extra" }, `${w0.slice(5).replace("-", "/")} – ${w1.slice(5).replace("-", "/")}`))
    );
    // 本周真实统计
    const weekStudy = Store.studyMinutesBetween(w0, w1);
    const weekTasks = Store.state.tasks.filter(t => !t.deleted && t.createdAt && dstr(new Date(t.createdAt)) >= w0 && dstr(new Date(t.createdAt)) <= w1);
    const weekDone = Store.state.tasks.filter(t => t.done && t.doneAt && dstr(new Date(t.doneAt)) >= w0 && dstr(new Date(t.doneAt)) <= w1);
    const weekFit = Object.keys(Store.state.fitness).filter(d => d >= w0 && d <= w1).length;
    // 科目时长
    const bySub = {};
    Store.state.study.forEach(r => { if (!r.deleted && r.date >= w0 && r.date <= w1) bySub[r.subjectId || "__none"] = (bySub[r.subjectId || "__none"] || 0) + r.minutes; });
    const subjItems = Object.entries(bySub).map(([k, v]) => ({
      name: k === "__none" ? "未分类" : (Store.subjectName(k) || "已删科目"), minutes: v
    })).sort((a, b) => b.minutes - a.minutes);
    // 体重变化
    const wStart = (() => { for (let i = 0; i < 7; i++) { const d = parseDate(w0); d.setDate(d.getDate() + i); const v = Store.weightOf(dstr(d)); if (v !== null) return v; } return null; })();
    const wEnd = (() => { for (let i = 6; i >= 0; i--) { const d = parseDate(w0); d.setDate(d.getDate() + i); const v = Store.weightOf(dstr(d)); if (v !== null) return v; } return null; })();

    card.append(
      UI.h("div", { class: "stat-row", style: "margin-bottom:14px" },
        UI.stat({ value: fmtMin(weekStudy), label: "本周学习", color: "violet" }),
        UI.stat({ value: `${weekDone.length}/${weekTasks.length}`, label: "任务完成", color: "green" }),
        UI.stat({ value: `${weekFit} 次`, label: "本周训练", color: "coral", sub: `计划 ${Store.state.settings.training.planDays.length} 次` }),
        UI.stat({ value: wStart !== null && wEnd !== null ? `${(wEnd - wStart > 0 ? "+" : "")}${(wEnd - wStart).toFixed(1)} kg` : "—", label: "本周体重变化", color: "blue" })),
      subjItems.length ? UI.h("div", { class: "chart-box", style: "margin-bottom:14px" },
        UI.h("div", { style: "font-size:13px;font-weight:700;margin-bottom:8px" }, "各科目学习时长"),
        UI.h("div", { class: "hbars" }, subjItems.map(it => {
          const total = subjItems.reduce((a, b) => a + b.minutes, 0) || 1;
          const pct = Math.round(it.minutes / total * 100);
          return UI.h("div", { class: "hbar-row" },
            UI.h("span", { class: "hbar-name" }, it.name),
            UI.h("span", { class: "hbar-track" }, UI.h("span", { class: "hbar-fill", style: `width:${pct}%` })),
            UI.h("span", { class: "hbar-n" }, `${(it.minutes / 60).toFixed(1)}h`));
        }))) : UI.empty("本周暂无学习记录"),
      UI.h("div", { class: "chart-note", style: "margin-bottom:14px" }, "以上均为本周真实记录汇总。周复盘内容按周独立保存，生成新一周不会覆盖历史。")
    );

    // 周复盘表单（按周 key 存储）
    const wkKey = `W${weekNum(parseDate(w0))}`;
    const rec = Store.state.reviews[wkKey] || {};
    const mk = (label, key, ph) => {
      const ta = UI.h("textarea", { placeholder: ph });
      ta.value = rec[key] || "";
      ta.addEventListener("input", () => {
        clearTimeout(ta._tm);
        ta._tm = setTimeout(() => {
          if (!Store.state.reviews[wkKey]) Store.state.reviews[wkKey] = { updatedAt: 0 };
          Store.state.reviews[wkKey][key] = ta.value;
          Store.state.reviews[wkKey].updatedAt = Date.now();
          Store.save();
        }, 600);
      });
      return UI.h("div", { class: "review-field" }, UI.h("label", {}, label), ta);
    };
    card.append(
      mk("计划与实际执行的差异", "diff", "哪些按计划完成了，哪些没有？差多少？"),
      mk("下周值得调整的事", "adjust", "时间分配、方法、任务量……")
    );
    return card;
  },

  /* ---- 历史复盘 ---- */
  historyCard() {
    const card = UI.h("div", { class: "card" },
      UI.h("div", { class: "card-title" }, UI.h("span", { class: "bar", style: "background:var(--green)" }), "历史复盘", UI.h("span", { class: "extra" }, "最近 14 条"))
    );
    const keys = Object.keys(Store.state.reviews).sort().reverse();
    if (!keys.length) {
      card.append(UI.empty("还没有复盘记录", "从今天的复盘开始写"));
      return card;
    }
    keys.slice(0, 14).forEach(k => {
      const r = Store.state.reviews[k];
      const isWeek = k.startsWith("W");
      const dateLabel = isWeek ? `${k} 周复盘` : `${k.slice(5).replace("-", "/")} 日复盘`;
      const parts = [];
      if (r.progress) parts.push(`进展：${r.progress}`);
      if (r.problems) parts.push(`问题：${r.problems}`);
      if (r.tomorrow) parts.push(`明日重点：${r.tomorrow}`);
      if (r.diff) parts.push(`差异：${r.diff}`);
      if (r.adjust) parts.push(`调整：${r.adjust}`);
      card.append(UI.h("div", { class: "review-hist", style: "margin-top:12px" },
        UI.h("div", { class: "rh-head" }, dateLabel),
        parts.length ? parts.map(p => UI.h("div", { class: "rh-item" }, p)) : UI.h("div", { class: "rh-item" }, "（空）")));
    });
    return card;
  }
};

function weekNum(d) {
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}

    if (!ok) return;
    try {
      const raw = JSON.parse(localStorage.getItem(DB_V1_BACKUP_KEY) || "null");
      if (!raw) { UI.toast("没有找到 v1 备份"); return; }
      const v1 = migrateV1(raw);
      // 以 v1 数据为主，保留 v2 新增集合中不冲突的记录
      const keepIds = new Set(v1.tasks.map(t => t.id));
      v1.study = Store.state.study.filter(r => !keepIds.has(r.taskId)).concat(v1.study);
      v1.blocks = Store.state.blocks.filter(b => !v1.tasks.some(t => t.id === b.taskId));
      v1.quotes = Store.state.quotes;
      Store.state = v1;
      Store.save();
      App.renderAll();
      UI.toast("v1 数据已恢复");
    } catch (e) {
      UI.toast("恢复失败：" + e.message);
    }
  },

  async clearAll() {
    const ok = await UI.confirmDanger("清空所有数据",
      "将删除全部任务、学习记录、训练记录、体重、饮食、日程和复盘数据，且不可恢复。强烈建议先「导出备份」。确定清空吗？", "全部清空");
    if (!ok) return;

    if (!ok2) return;
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(TIMER_KEY);
    Store.state = defaultState();
    Store.save();
    App.renderAll();
    UI.toast("已清空");
  }
};

  curView: "today",

  init() {
    Store.load();
    Theme.init();
    Sync.init();
    Timer.restore();
    this.bindNav();
    this.bindTopbar();
    this.initBg();
    this.initScrollFx();
    this.renderAll();
    this.renderTimerBar();
    // 每分钟刷新一次时间轴「现在」标记
    setInterval(() => { if (this.curView === "today") TodayView.renderTimelineInto(document.getElementById("view-today"), todayStr()); }, 60000);
  },

  bindNav() {
    document.getElementById("nav").addEventListener("click", e => {
      const btn = e.target.closest(".nav-item");
      if (!btn) return;
      this.switchView(btn.dataset.view);
    });
  },

  bindTopbar() {
    document.getElementById("btnTheme").addEventListener("click", () => { Theme.toggle(); this.syncThemeIcon(); });
    document.getElementById("btnExport").addEventListener("click", () => this.exportData());
    document.getElementById("btnSettings").addEventListener("click", () => this.switchView("settings"));
    document.getElementById("syncChip").addEventListener("click", () => {
      if (Sync.adapter) Sync.retry();
      else UI.toast("云同步未配置：完成 Supabase 部署后即可多设备同步（docs/SUPABASE_SETUP.md）", 3200);
    });
    this.syncThemeIcon();
  },

  syncThemeIcon() {
    const btn = document.getElementById("btnTheme");
    const dark = Theme.current() === "dark";
    btn.innerHTML = dark
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
    btn.title = dark ? "切换到浅色" : "切换到深色";
  },

  switchView(v) {
    this.curView = v;
    ["today", "tasks", "study", "fitness", "schedule", "review", "settings"].forEach(x => {
      const el = document.getElementById("view-" + x);
      if (!el) return;
      el.classList.toggle("show", x === v);
      el.hidden = x !== v;
    });
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === v));
    window.scrollTo({ top: 0, behavior: "instant" });
    if (v === "today") TodayView.render();
    if (v === "tasks") { TasksView.render(); }
    if (v === "study") StudyView.render();
    if (v === "fitness") FitnessView.render();
    if (v === "schedule") ScheduleView.render();
    if (v === "review") ReviewView.render();
    if (v === "settings") SettingsView.render();
  },

  renderAll() {
    const line = document.getElementById("dateLine");
    if (line) line.textContent = `${today().getFullYear()} 年 ${today().getMonth() + 1} 月 ${today().getDate()} 日 · ${WEEK_CN[today().getDay()]}`;
    this.switchView(this.curView);
    Sync.renderChip();
  },

  /* ---- 计时器浮动条 ---- */
  renderTimerBar() {
    const bar = document.getElementById("timerBar");
    if (!bar) return;
    if (!Timer.active) { bar.hidden = true; return; }
    bar.hidden = false;
    document.getElementById("timerLabel").textContent = (Store.subjectName(Timer.active.subjectId) || "计时") + (Timer.isRunning() ? "" : "（已暂停）");
    document.getElementById("timerClock").textContent = fmtClock(Timer.elapsedMs() / 1000);
    document.getElementById("timerPause").textContent = Timer.isRunning() ? "暂停" : "继续";
    document.getElementById("timerPause").onclick = () => { Timer.isRunning() ? Timer.pause() : Timer.resume(); if (this.curView === "study") StudyView.render(); };
    document.getElementById("timerStop").onclick = () => { Timer.stop(); if (this.curView === "study") StudyView.render(); };
    // 同步学习页大时钟
    const big = document.getElementById("timerBig");
    if (big) big.textContent = fmtClock(Timer.elapsedMs() / 1000);
  },

  /* ---- 导入 / 导出 ---- */
  exportData() {
    const blob = new Blob([JSON.stringify({ ...Store.state, exportAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `LifeOS备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    UI.toast("备份文件已下载");
  },

  bindImport() {
    document.getElementById("fileImport").addEventListener("change", async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        const data = JSON.parse(text);
        if (!data || typeof data !== "object" || !Array.isArray(data.tasks)) throw new Error("缺少 tasks 字段");
        const ok = await UI.confirmDanger("导入备份", "导入将合并/覆盖当前数据（同 ID 记录以较新者为准）。建议先导出当前数据作为备份。继续吗？", "确认导入");
        if (!ok) { e.target.value = ""; return; }
        const merged = mergeStates(Store.state, data);
        Store.state = merged;
        Store.save();
        this.renderAll();
        UI.toast("导入成功");
      } catch (err) {
        UI.toast("导入失败：文件格式不正确（" + err.message + "）");
      }
      e.target.value = "";
    });
  },

  /* ---- 动态背景（低强度，不干扰操作） ---- */
  initBg() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("bgCanvas");
    const ctx = cv.getContext("2d");
    let W, H, DPR;
    const resize = () => {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    };
    resize();
    window.addEventListener("resize", resize);
    const blobs = [
      { x: .15, y: .18, r: .42, vx: .00022, vy: .00016, c: [59, 110, 245], a: .10 },
      { x: .85, y: .25, r: .36, vx: -.00018, vy: .00021, c: [123, 92, 240], a: .09 },
      { x: .55, y: .85, r: .44, vx: .00015, vy: -.00019, c: [255, 90, 122], a: .07 },
      { x: .25, y: .7, r: .3, vx: .0002, vy: .00014, c: [23, 178, 106], a: .06 }
    ].map(b => ({ ...b, x: b.x * W, y: b.y * H, r: b.r * Math.max(W, H) }));
    let t = 0;
    (function draw() {
      t++;
      ctx.clearRect(0, 0, W, H);
      blobs.forEach(b => {
        b.x += b.vx * W * .05; b.y += b.vy * H * .05;
        if (b.x < -b.r * .6) b.x = W + b.r * .6; if (b.x > W + b.r * .6) b.x = -b.r * .6;
        if (b.y < -b.r * .6) b.y = H + b.r * .6; if (b.y > H + b.r * .6) b.y = -b.r * .6;
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a})`);
        g.addColorStop(1, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(draw);
    })();
  },

  initScrollFx() {
    const bar = document.getElementById("scrollProgress");
    const tb = document.getElementById("topbar");
    window.addEventListener("scroll", () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? window.scrollY / h * 100 : 0) + "%";
      tb.classList.toggle("stuck", window.scrollY > 8);
    }, { passive: true });
  }
};

/* 设置视图容器（动态加入，避免模板过长） */
(function ensureSettingsView() {
  const sec = document.createElement("section");
  sec.className = "view";
  sec.id = "view-settings";
  sec.setAttribute("role", "tabpanel");
  sec.setAttribute("aria-label", "设置");
  sec.hidden = true;
  document.getElementById("main").append(sec);
})();

document.addEventListener("DOMContentLoaded", () => {
  App.bindImport();
  App.init();
});

</script>
</body>
</html>
